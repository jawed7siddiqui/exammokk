<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ExamMokk - Profile</title>

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Dynamic Bottom Navigation Component -->
    <script src="js/nav.js"></script>

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #0f172a;
        -webkit-tap-highlight-color: transparent;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes modalFadeIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .modal-animate {
        animation: modalFadeIn 0.2s ease-out forwards;
      }
    </style>
  </head>
  <body class="flex justify-center items-center min-h-screen bg-slate-900">
    <!-- MOBILE CONTAINER -->
    <div
      class="w-full max-w-[430px] bg-slate-50 h-screen max-h-screen flex flex-col justify-start shadow-2xl relative overflow-hidden"
    >
      <!-- 1. TOP FIXED HEADER -->
      <div id="top-header-placeholder"></div>

      <!-- 2. MAIN CONTENT -->
      <main
        class="flex-1 px-4 pt-4 pb-24 space-y-3.5 overflow-y-auto no-scrollbar"
      >
        <!-- PROFILE HERO CARD -->
        <div
          class="bg-gradient-to-br from-indigo-600 via-indigo-700 to-slate-900 rounded-3xl p-5 text-white shadow-lg shadow-indigo-950/20 text-center relative overflow-hidden"
        >
          <div
            id="profile-avatar"
            class="w-16 h-16 mx-auto rounded-2xl bg-white/15 border-2 border-white/20 text-white font-extrabold flex items-center justify-center text-2xl shadow-inner uppercase mb-2"
          >
            U
          </div>

          <h2
            id="profile-name"
            class="text-lg font-black tracking-tight text-white"
          >
            Candidate
          </h2>
          <p
            id="profile-mobile-display"
            class="text-xs text-indigo-200 font-semibold font-mono mt-0.5"
          >
            --
          </p>
        </div>

        <!-- QUICK 3 STATS -->
        <div class="grid grid-cols-3 gap-2.5">
          <div
            class="bg-white border border-slate-200/80 rounded-2xl p-3 text-center shadow-2xs"
          >
            <span class="text-base">📝</span>
            <p class="text-[10px] font-bold text-slate-400 uppercase mt-0.5">
              Tests
            </p>
            <p
              id="stat-profile-tests"
              class="text-sm font-black text-slate-800 mt-0.5"
            >
              0
            </p>
          </div>
          <div
            class="bg-white border border-slate-200/80 rounded-2xl p-3 text-center shadow-2xs"
          >
            <span class="text-base">🎯</span>
            <p class="text-[10px] font-bold text-slate-400 uppercase mt-0.5">
              Accuracy
            </p>
            <p
              id="stat-profile-accuracy"
              class="text-sm font-black text-emerald-600 mt-0.5"
            >
              0%
            </p>
          </div>
          <div
            class="bg-white border border-slate-200/80 rounded-2xl p-3 text-center shadow-2xs"
          >
            <span class="text-base">⭐</span>
            <p class="text-[10px] font-bold text-slate-400 uppercase mt-0.5">
              Stars
            </p>
            <p
              id="stat-profile-stars"
              class="text-sm font-black text-amber-500 mt-0.5"
            >
              0
            </p>
          </div>
        </div>

        <!-- ACCOUNT DETAILS -->
        <div class="space-y-1.5">
          <h3
            class="text-xs font-extrabold text-slate-700 uppercase tracking-wider px-1"
          >
            Account
          </h3>

          <div
            class="bg-white border border-slate-200/80 rounded-2xl p-3.5 space-y-2.5 shadow-2xs text-xs"
          >
            <div class="flex items-center justify-between">
              <span class="text-slate-400 font-semibold">Full Name</span>
              <span
                id="detail-name"
                class="font-extrabold text-slate-800 text-xs"
                >Candidate</span
              >
            </div>
            <div
              class="border-t border-slate-100 pt-2.5 flex items-center justify-between"
            >
              <span class="text-slate-400 font-semibold"
                >Registered Mobile</span
              >
              <span
                id="detail-mobile"
                class="font-extrabold text-slate-800 font-mono text-xs"
                >--</span
              >
            </div>
            <div
              class="border-t border-slate-100 pt-2.5 flex items-center justify-between"
            >
              <span class="text-slate-400 font-semibold">Access Plan</span>
              <span class="font-extrabold text-emerald-600 text-xs"
                >Standard</span
              >
            </div>
          </div>
        </div>

        <!-- SHORTCUTS -->
        <div class="space-y-1.5">
          <h3
            class="text-xs font-extrabold text-slate-700 uppercase tracking-wider px-1"
          >
            Shortcuts
          </h3>

          <div
            class="bg-white border border-slate-200/80 rounded-2xl overflow-hidden shadow-2xs divide-y divide-slate-100 text-xs"
          >
            <button
              onclick="window.location.href = 'scoreboard.html'"
              class="w-full p-3.5 flex items-center justify-between hover:bg-slate-50 active:bg-slate-100 transition-all cursor-pointer"
            >
              <div
                class="flex items-center gap-3 font-bold text-slate-700 text-xs"
              >
                <span class="text-base">📊</span>
                <span>View Full Scoreboard</span>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </button>

            <button
              onclick="window.location.href = 'home.html'"
              class="w-full p-3.5 flex items-center justify-between hover:bg-slate-50 active:bg-slate-100 transition-all cursor-pointer"
            >
              <div
                class="flex items-center gap-3 font-bold text-slate-700 text-xs"
              >
                <span class="text-base">📝</span>
                <span>All Practice Tests</span>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </button>
          </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="pt-2 space-y-2">
          <button
            onclick="openLogoutModal()"
            class="w-full py-3 bg-white hover:bg-slate-100 border border-slate-200/90 rounded-2xl flex items-center justify-center gap-2 text-slate-700 hover:text-slate-900 font-extrabold text-xs transition-all active:scale-98 cursor-pointer shadow-2xs"
          >
            <i data-lucide="log-out" class="w-4 h-4 text-slate-400"></i>
            <span>Logout Account</span>
          </button>

          <button
            onclick="openDeleteModal()"
            class="w-full py-3 bg-rose-50 hover:bg-rose-100 border border-rose-200/80 rounded-2xl flex items-center justify-center gap-2 text-rose-600 hover:text-rose-700 font-extrabold text-xs transition-all active:scale-98 cursor-pointer shadow-2xs"
          >
            <i data-lucide="trash-2" class="w-4 h-4 text-rose-500"></i>
            <span>Delete Profile</span>
          </button>
        </div>
      </main>

      <!-- 3. DYNAMIC BOTTOM NAVIGATION -->
      <div id="bottom-nav-placeholder"></div>

      <!-- CENTER CONFIRMATION MODAL -->
      <div
        id="action-modal"
        class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4"
      >
        <div
          class="bg-white rounded-3xl p-5 w-full max-w-[340px] text-center shadow-2xl modal-animate border border-slate-100"
        >
          <div
            id="modal-icon-container"
            class="w-12 h-12 rounded-2xl mx-auto flex items-center justify-center mb-3.5"
          >
            <i id="modal-icon" data-lucide="alert-triangle" class="w-6 h-6"></i>
          </div>

          <h3 id="modal-title" class="text-base font-black text-slate-900">
            Confirm Action
          </h3>
          <p
            id="modal-desc"
            class="text-xs text-slate-500 mt-1.5 leading-relaxed font-semibold px-2"
          >
            Are you sure you want to proceed?
          </p>

          <div
            id="modal-error-msg"
            class="hidden text-[11px] font-bold text-rose-600 bg-rose-50 border border-rose-200 rounded-xl p-2 mt-3"
          ></div>

          <div class="grid grid-cols-2 gap-2.5 mt-5">
            <button
              id="modal-cancel-btn"
              onclick="closeModal()"
              class="py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-extrabold transition-all cursor-pointer"
            >
              Cancel
            </button>
            <button
              id="modal-confirm-btn"
              class="py-2.5 text-white rounded-xl text-xs font-extrabold transition-all cursor-pointer flex items-center justify-center gap-1.5"
            >
              Confirm
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- JAVASCRIPT PROFILE ENGINE -->
    <script>
      const SCOREBOARD_API_URL =
        "https://exam-api.jawedsiddiqui.cloud/api/test/questions/scoreboard";
      const AUTH_API_BASE_URL =
        "https://exam-api.jawedsiddiqui.cloud/api/kidspaint";

      function getActiveUserId() {
        const urlParams = new URLSearchParams(window.location.search);
        let userId = urlParams.get("user_id");

        if (!userId) {
          try {
            const rawUser =
              localStorage.getItem("kidsPaintUser") ||
              localStorage.getItem("examIndiaUser");
            if (rawUser) {
              const userObj = JSON.parse(rawUser);
              userId =
                userObj.id || userObj._id || userObj.userId || userObj.user_id;
            }
          } catch (e) {
            console.error("Local storage error:", e);
          }
        }
        return userId || "";
      }

      function getActiveUserMobile() {
        try {
          const rawUser =
            localStorage.getItem("kidsPaintUser") ||
            localStorage.getItem("examIndiaUser");
          if (rawUser) {
            const userObj = JSON.parse(rawUser);
            return userObj.mobileNumber || userObj.mobile || "";
          }
        } catch (e) {
          console.error("Local storage mobile error:", e);
        }
        return "";
      }

      function loadProfileData() {
        const userId = getActiveUserId() || "";
        let userName = "Candidate";
        let mobileNumber = "--";

        try {
          const rawUser =
            localStorage.getItem("kidsPaintUser") ||
            localStorage.getItem("examIndiaUser");
          if (rawUser) {
            const userObj = JSON.parse(rawUser);
            userName =
              userObj.candidateName ||
              userObj.studentName ||
              userObj.name ||
              userObj.userName ||
              "Candidate";
            mobileNumber = userObj.mobileNumber || userObj.mobile || "--";
          }
        } catch (e) {}

        document.getElementById("profile-name").innerText = userName;
        document.getElementById("detail-name").innerText = userName;
        document.getElementById("profile-avatar").innerText = userName
          .charAt(0)
          .toUpperCase();

        document.getElementById("profile-mobile-display").innerText =
          mobileNumber !== "--" ? `+91 ${mobileNumber}` : "";
        document.getElementById("detail-mobile").innerText =
          mobileNumber !== "--" ? mobileNumber : "Not Linked";

        if (userId) {
          fetchUserStats(userId);
        }
      }

      async function fetchUserStats(userId) {
        try {
          const res = await fetch(
            `${SCOREBOARD_API_URL}?student_id=${encodeURIComponent(userId)}&limit=1`,
          );
          if (!res.ok) return;
          const resData = await res.json();

          if (resData?.success && resData.data?.summary) {
            const summary = resData.data.summary;
            document.getElementById("stat-profile-tests").innerText =
              summary.total_tests || 0;
            document.getElementById("stat-profile-accuracy").innerText =
              `${summary.overall_accuracy || 0}%`;
            document.getElementById("stat-profile-stars").innerText =
              summary.total_stars || 0;
          }
        } catch (err) {
          console.warn("Profile Stats Fetch Error:", err);
        }
      }

      // MODAL CONTROLLERS
      function closeModal() {
        document.getElementById("action-modal").classList.add("hidden");
        document.getElementById("modal-error-msg").classList.add("hidden");
      }

      function openLogoutModal() {
        const modal = document.getElementById("action-modal");
        const iconContainer = document.getElementById("modal-icon-container");
        const icon = document.getElementById("modal-icon");
        const title = document.getElementById("modal-title");
        const desc = document.getElementById("modal-desc");
        const confirmBtn = document.getElementById("modal-confirm-btn");

        iconContainer.className =
          "w-12 h-12 rounded-2xl mx-auto flex items-center justify-center mb-3.5 bg-rose-50 text-rose-600 border border-rose-100";
        icon.setAttribute("data-lucide", "lock");
        title.innerText = "Logout?";
        desc.innerText = "Are you sure you want to log out?";

        confirmBtn.className =
          "py-2.5 px-3 rounded-xl bg-rose-600 hover:bg-rose-700 active:scale-95 text-white text-xs font-black shadow-md shadow-rose-600/25 transition-all cursor-pointer";
        confirmBtn.innerText = "Logout";
        confirmBtn.onclick = () => {
          localStorage.clear();
          sessionStorage.clear();
          window.location.href = "auth.html";
        };

        modal.classList.remove("hidden");
        if (typeof lucide !== "undefined") lucide.createIcons();
      }
      function openDeleteModal() {
        const modal = document.getElementById("action-modal");
        const iconContainer = document.getElementById("modal-icon-container");
        const icon = document.getElementById("modal-icon");
        const title = document.getElementById("modal-title");
        const desc = document.getElementById("modal-desc");
        const confirmBtn = document.getElementById("modal-confirm-btn");

        iconContainer.className =
          "w-12 h-12 rounded-2xl mx-auto flex items-center justify-center mb-3.5 bg-rose-50 text-rose-600 border border-rose-100";
        icon.setAttribute("data-lucide", "trash-2");
        title.innerText = "Delete Profile";
        desc.innerText =
          "This action is permanent. All test papers, scores, and analytics will be permanently deleted.";

        confirmBtn.className =
          "py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-extrabold transition-all cursor-pointer flex items-center justify-center";
        confirmBtn.innerText = "Delete Forever";
        confirmBtn.onclick = executeDeleteProfile;

        modal.classList.remove("hidden");
        if (typeof lucide !== "undefined") lucide.createIcons();
      }

      async function executeDeleteProfile() {
        const confirmBtn = document.getElementById("modal-confirm-btn");
        const cancelBtn = document.getElementById("modal-cancel-btn");
        const errorBox = document.getElementById("modal-error-msg");

        confirmBtn.disabled = true;
        cancelBtn.disabled = true;
        confirmBtn.innerText = "Deleting...";
        errorBox.classList.add("hidden");

        const userId = getActiveUserId();
        const mobileNumber = getActiveUserMobile();
        const token =
          localStorage.getItem("examIndiaToken") ||
          localStorage.getItem("kidsPaintToken") ||
          "";

        try {
          const response = await fetch(`${AUTH_API_BASE_URL}/delete-profile`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: token ? `Bearer ${token}` : "",
            },
            body: JSON.stringify({
              userId: userId,
              mobileNumber: mobileNumber,
            }),
          });

          const result = await response.json();

          if (response.ok && result.success) {
            localStorage.clear();
            sessionStorage.clear();
            window.location.href = "auth.html";
          } else {
            errorBox.innerText =
              result.message || "Failed to delete account. Please try again.";
            errorBox.classList.remove("hidden");
            confirmBtn.disabled = false;
            cancelBtn.disabled = false;
            confirmBtn.innerText = "Delete Forever";
          }
        } catch (error) {
          console.error("Delete Error:", error);
          errorBox.innerText =
            "Server connection error. Please try again later.";
          errorBox.classList.remove("hidden");
          confirmBtn.disabled = false;
          cancelBtn.disabled = false;
          confirmBtn.innerText = "Delete Forever";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadProfileData();
        if (typeof lucide !== "undefined") {
          lucide.createIcons();
        }
      });
    </script>
  </body>
</html>
