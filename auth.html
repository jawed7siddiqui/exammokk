<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>EXAM MOKK — Candidate Portal</title>

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --brand-primary: #4f46e5;
        --brand-accent: #4338ca;
      }
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      .font-mono-tag {
        font-family: "Space Grotesk", monospace;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes smoothFadeIn {
        0% {
          opacity: 0;
          transform: translateY(6px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade {
        animation: smoothFadeIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body
    class="flex justify-center items-center min-h-screen bg-[#F1F5F9] p-0 sm:p-4 text-slate-900 antialiased select-none"
  >
    <!-- APP CONTAINER -->
    <div
      class="w-full max-w-[420px] h-screen sm:h-[820px] sm:max-h-[92vh] bg-white sm:rounded-[28px] flex flex-col justify-between shadow-[0_20px_50px_rgba(15,23,42,0.08)] border border-slate-200/80 relative overflow-hidden"
    >
      <!-- 1. TOP BRAND HEADER -->
      <header
        class="px-6 pt-6 pb-4 flex items-center justify-between border-b border-slate-100 bg-white/90 backdrop-blur-md sticky top-0 z-20"
      >
        <button
          id="app-back-btn"
          onclick="handleAppBackNavigation()"
          class="invisible w-9 h-9 rounded-xl bg-slate-50 text-slate-600 hover:text-slate-900 hover:bg-slate-100 flex items-center justify-center border border-slate-200/60 transition-all cursor-pointer active:scale-95"
          title="Back"
        >
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </button>

        <div class="flex items-center gap-2.5">
          <div
            class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-[0_4px_12px_rgba(79,70,229,0.28)]"
          >
            <i data-lucide="graduation-cap" class="w-5 h-5 text-white"></i>
          </div>
          <div class="flex flex-col">
            <h1
              class="text-base font-black tracking-tight text-slate-900 leading-none uppercase"
            >
              EXAM <span class="text-indigo-600">MOKK</span>
            </h1>
            <span
              class="text-[10px] font-semibold text-slate-400 font-mono-tag tracking-wider uppercase mt-0.5"
            >
              Candidate Portal
            </span>
          </div>
        </div>

        <div
          class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 border border-emerald-200/60 text-emerald-700 text-[10px] font-bold font-mono-tag"
        >
          <span
            class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"
          ></span>
          <span>LIVE PORTAL</span>
        </div>
      </header>

      <!-- 2. MAIN SCROLLABLE FORM BODY -->
      <main
        class="flex-1 px-6 py-6 overflow-y-auto no-scrollbar flex flex-col justify-between"
      >
        <!-- TOP BRAND HERO BANNER -->
        <div class="pt-2 flex flex-col items-center text-center">
          <div class="relative w-20 h-20 flex items-center justify-center mb-3">
            <div
              class="absolute inset-0 bg-indigo-50 rounded-2xl rotate-3"
            ></div>
            <div
              class="absolute inset-0 bg-slate-100/80 rounded-2xl -rotate-3"
            ></div>
            <div
              class="relative w-16 h-16 rounded-2xl bg-white shadow-sm border border-slate-100 flex items-center justify-center"
            >
              <svg
                class="w-10 h-10"
                viewBox="0 0 48 48"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect
                  x="8"
                  y="6"
                  width="32"
                  height="36"
                  rx="6"
                  fill="#F8FAFC"
                  stroke="#CBD5E1"
                  stroke-width="2"
                />
                <rect
                  x="14"
                  y="13"
                  width="20"
                  height="2.5"
                  rx="1.25"
                  fill="#4F46E5"
                />
                <rect
                  x="14"
                  y="20"
                  width="14"
                  height="2.5"
                  rx="1.25"
                  fill="#94A3B8"
                />
                <rect
                  x="14"
                  y="27"
                  width="16"
                  height="2.5"
                  rx="1.25"
                  fill="#94A3B8"
                />
                <circle cx="33" cy="33" r="5.5" fill="#10B981" />
                <path
                  d="M31 33L32.5 34.5L35.5 31.5"
                  stroke="white"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </div>

          <h2 class="text-lg font-bold text-slate-900 tracking-tight">
            Sign In / Register
          </h2>
          <p class="text-xs text-slate-500 mt-1 max-w-[260px] leading-relaxed">
            Enter mobile number to access all mock tests.
          </p>
        </div>

        <!-- FORM INTERACTION WRAPPER -->
        <div class="my-auto py-4 space-y-4">
          <!-- Modern Error Notification -->
          <div
            id="exam-alert-box"
            class="hidden text-xs font-semibold p-3.5 rounded-xl text-center bg-rose-50 text-rose-700 border border-rose-200/80 animate-fade"
          ></div>

          <!-- STEP 1: MOBILE ENTRY -->
          <section
            id="step-common-login"
            class="auth-step-container animate-fade space-y-4"
          >
            <form onsubmit="handleCommonLoginSubmit(event)" class="space-y-4">
              <div>
                <label
                  class="text-[11px] font-bold text-slate-700 block mb-1.5"
                >
                  Mobile Number
                </label>
                <div
                  class="flex items-center w-full bg-slate-50/70 border border-slate-200 rounded-xl overflow-hidden focus-within:border-indigo-600 focus-within:bg-white focus-within:ring-4 focus-within:ring-indigo-50 transition-all duration-200"
                >
                  <span
                    class="px-3.5 py-3 text-xs font-bold text-slate-600 bg-slate-100/60 border-r border-slate-200 shrink-0 font-mono-tag"
                    >🇮🇳 +91</span
                  >
                  <input
                    type="tel"
                    id="user-mobile"
                    required
                    maxlength="10"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    placeholder="Enter 10-digit mobile"
                    class="w-full px-3.5 py-3 font-semibold text-slate-900 outline-none bg-transparent text-sm tracking-wider placeholder:text-slate-400"
                  />
                </div>
              </div>

              <button
                type="submit"
                id="btn-mobile-submit"
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 active:scale-[0.99] text-white font-bold rounded-xl text-xs uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(79,70,229,0.25)]"
              >
                <span>Continue</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </button>
            </form>
          </section>

          <!-- STEP 2A: PASSWORD LOGIN -->
          <section
            id="step-enter-password"
            class="auth-step-container hidden animate-fade space-y-4"
          >
            <form onsubmit="handlePasswordSubmit(event)" class="space-y-4">
              <div>
                <div class="flex items-center justify-between mb-1.5">
                  <label class="text-[11px] font-bold text-slate-700">
                    Account Password
                  </label>
                  <span class="text-[10px] font-semibold text-slate-400"
                    >Default: 123456</span
                  >
                </div>
                <div class="relative flex items-center">
                  <input
                    type="password"
                    id="user-password-input"
                    required
                    minlength="4"
                    placeholder="Enter your password"
                    class="w-full p-3.5 border border-slate-200 rounded-xl font-mono-tag font-semibold text-slate-900 outline-none focus:border-indigo-600 focus:bg-white focus:ring-4 focus:ring-indigo-50 bg-slate-50/70 text-sm transition-all"
                  />
                </div>
              </div>

              <button
                type="submit"
                id="btn-password-submit"
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 active:scale-[0.99] text-white font-bold rounded-xl text-xs uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(79,70,229,0.25)]"
              >
                <span>Verify &amp; Sign In</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
              </button>
            </form>
          </section>

          <!-- STEP 2B: QUICK REGISTRATION -->
          <section
            id="step-registration"
            class="auth-step-container hidden animate-fade space-y-4"
          >
            <form
              onsubmit="handleRegistrationSubmit(event)"
              class="space-y-3.5"
            >
              <div>
                <label class="text-[11px] font-bold text-slate-700 block mb-1">
                  Candidate Full Name
                </label>
                <input
                  type="text"
                  id="reg-candidate-name"
                  required
                  placeholder="e.g. Rahul Sharma"
                  class="w-full px-3.5 py-3 bg-slate-50/70 border border-slate-200 rounded-xl font-semibold text-slate-900 text-xs outline-none focus:border-indigo-600 focus:bg-white focus:ring-4 focus:ring-indigo-50 transition-all placeholder:text-slate-400"
                />
              </div>

              <div>
                <label class="text-[11px] font-bold text-slate-700 block mb-1">
                  Create Password
                  <span class="text-[10px] text-slate-400 font-normal"
                    >(Min. 4 characters)</span
                  >
                </label>
                <input
                  type="password"
                  id="reg-password"
                  required
                  minlength="4"
                  placeholder="Create your password"
                  class="w-full px-3.5 py-3 bg-slate-50/70 border border-slate-200 rounded-xl font-semibold text-slate-900 text-xs outline-none focus:border-indigo-600 focus:bg-white focus:ring-4 focus:ring-indigo-50 transition-all placeholder:text-slate-400"
                />
              </div>

              <div class="flex items-start gap-2 pt-0.5">
                <input
                  type="checkbox"
                  id="terms-checkbox"
                  required
                  class="accent-indigo-600 w-4 h-4 rounded border-slate-300 cursor-pointer mt-0.5"
                />
                <label
                  for="terms-checkbox"
                  class="text-[11px] text-slate-500 leading-snug cursor-pointer select-none"
                >
                  I agree to the
                  <a
                    href="terms.html"
                    target="_blank"
                    class="text-indigo-600 font-semibold hover:underline"
                    >Terms</a
                  >
                  &amp;
                  <a
                    href="privacy-policy.html"
                    target="_blank"
                    class="text-indigo-600 font-semibold hover:underline"
                    >Privacy Policy</a
                  >.
                </label>
              </div>

              <button
                type="submit"
                id="btn-reg-submit"
                class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 active:scale-[0.99] text-white font-bold rounded-xl text-xs uppercase tracking-wider transition-all cursor-pointer flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(79,70,229,0.25)]"
              >
                <span>Create Candidate Profile</span>
                <i data-lucide="user-plus" class="w-4 h-4"></i>
              </button>
            </form>
          </section>

          <!-- STEP 3: SUCCESS CONFIRMATION -->
          <section
            id="step-reg-success"
            class="auth-step-container hidden text-center space-y-4 animate-fade py-2"
          >
            <div
              class="w-14 h-14 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-2xl mx-auto flex items-center justify-center text-xl shadow-xs"
            >
              <i data-lucide="check" class="w-7 h-7 stroke-[2.5]"></i>
            </div>
            <div>
              <h2 class="text-base font-bold text-slate-900">
                Profile Activated
              </h2>
              <p class="text-xs text-slate-500 mt-1">
                Your testing workspace is configured and ready.
              </p>
            </div>

            <button
              onclick="finishAuthAndGoHome()"
              class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold rounded-xl text-xs uppercase tracking-wider cursor-pointer shadow-[0_4px_14px_rgba(16,185,129,0.25)] transition-all"
            >
              Access Test Portal →
            </button>
          </section>
        </div>

        <div></div>
      </main>

      <!-- 3. FOOTER -->
      <footer
        class="py-3 px-6 text-center border-t border-slate-100 bg-slate-50/60 shrink-0"
      >
        <p
          class="text-[10px] font-semibold text-slate-400 font-mono-tag tracking-wider uppercase"
        >
          EXAM MOKK Candidate Services • Encrypted
        </p>
      </footer>
    </div>

    <!-- SCRIPT CONTROLLER -->
    <script>
      const API_BASE_URL = "https://exam-api.jawedsiddiqui.cloud/api/kidspaint";

      let activeStepHistory = ["step-common-login"];
      let mobileNumber = "";

      // Universal Device Telemetry & Push Token Helper (iOS / Android / Web)
      function getDeviceContext() {
        const ua = navigator.userAgent.toLowerCase();

        // 1. Platform Detection
        let platform = "web";
        if (/android/i.test(ua)) {
          platform = "android";
        } else if (
          /iphone|ipad|ipod/i.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1)
        ) {
          platform = "ios";
        }

        // 2. Form Factor Detection
        let deviceType = "desktop";
        if (/tablet|ipad/i.test(ua)) {
          deviceType = "tablet";
        } else if (/mobile|iphone|ipod|android/i.test(ua)) {
          deviceType = "mobile";
        }

        return {
          pushToken: localStorage.getItem("user_fcm_token") || null,
          platform: platform,
          deviceType: deviceType,
        };
      }

      function switchStep(stepId, pushHistory = true) {
        hideAlert();
        if (
          pushHistory &&
          activeStepHistory[activeStepHistory.length - 1] !== stepId
        ) {
          activeStepHistory.push(stepId);
        }

        const backBtn = document.getElementById("app-back-btn");
        if (activeStepHistory.length > 1 && stepId !== "step-common-login") {
          backBtn.classList.remove("invisible");
        } else {
          backBtn.classList.add("invisible");
        }

        document
          .querySelectorAll(".auth-step-container")
          .forEach((el) => el.classList.add("hidden"));
        const target = document.getElementById(stepId);
        if (target) target.classList.remove("hidden");
        if (typeof lucide !== "undefined") lucide.createIcons();
      }

      function handleAppBackNavigation() {
        if (activeStepHistory.length > 1) {
          activeStepHistory.pop();
          const prev = activeStepHistory[activeStepHistory.length - 1];
          switchStep(prev, false);
        }
      }

      function showAlert(msg) {
        const box = document.getElementById("exam-alert-box");
        if (box) {
          box.innerText = msg;
          box.classList.remove("hidden");
        }
      }

      function hideAlert() {
        const box = document.getElementById("exam-alert-box");
        if (box) box.classList.add("hidden");
      }

      // 1. Mobile Check
      async function handleCommonLoginSubmit(e) {
        e.preventDefault();
        hideAlert();

        const btn = document.getElementById("btn-mobile-submit");
        btn.disabled = true;
        btn.innerText = "Checking...";

        mobileNumber = document.getElementById("user-mobile").value.trim();

        try {
          const res = await fetch(`${API_BASE_URL}/check-mobile`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ mobileNumber }),
          });
          const data = await res.json();
          if (data.exists) {
            switchStep("step-enter-password");
          } else {
            switchStep("step-registration");
          }
        } catch (err) {
          switchStep("step-registration");
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<span>Continue</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
          if (typeof lucide !== "undefined") lucide.createIcons();
        }
      }

      // 2. Password Login
      async function handlePasswordSubmit(e) {
        e.preventDefault();
        hideAlert();

        const btn = document.getElementById("btn-password-submit");
        btn.disabled = true;
        btn.innerText = "Signing in...";

        const password = document.getElementById("user-password-input").value;
        const deviceMeta = getDeviceContext();

        const loginPayload = {
          mobileNumber: mobileNumber,
          password: password,
          pushToken: deviceMeta.pushToken,
          platform: deviceMeta.platform,
          deviceType: deviceMeta.deviceType,
        };

        try {
          const res = await fetch(`${API_BASE_URL}/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(loginPayload),
          });
          const data = await res.json();

          if (res.ok && data.success) {
            localStorage.setItem("examIndiaToken", data.token);
            localStorage.setItem("examIndiaUser", JSON.stringify(data.user));
            finishAuthAndGoHome();
          } else {
            showAlert(
              `❌ ${data.message || "Invalid credentials! Try again."}`,
            );
          }
        } catch (err) {
          finishAuthAndGoHome();
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<span>Verify & Sign In</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
          if (typeof lucide !== "undefined") lucide.createIcons();
        }
      }

      // 3. Quick Register
      async function handleRegistrationSubmit(e) {
        e.preventDefault();
        hideAlert();

        const btn = document.getElementById("btn-reg-submit");
        btn.disabled = true;
        btn.innerText = "Creating account...";

        const candidateName = document
          .getElementById("reg-candidate-name")
          .value.trim();
        const userPassword = document.getElementById("reg-password").value;
        const deviceMeta = getDeviceContext();

        const payload = {
          role: "aspirant",
          mobileNumber: mobileNumber,
          password: userPassword,
          candidateName: candidateName,
          studentName: candidateName,
          schoolName: "ExamMokk Aspirant Hub",
          rollNo: "MOKK" + Math.floor(1000 + Math.random() * 9000),
          pushToken: deviceMeta.pushToken,
          platform: deviceMeta.platform,
          deviceType: deviceMeta.deviceType,
        };

        try {
          const res = await fetch(`${API_BASE_URL}/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await res.json();

          if (res.ok && data.success) {
            localStorage.setItem("examIndiaToken", data.token);
            localStorage.setItem("examIndiaUser", JSON.stringify(data.user));
            switchStep("step-reg-success");
          } else {
            showAlert(
              `❌ ${data.message || "Registration failed. Try again."}`,
            );
          }
        } catch (err) {
          localStorage.setItem("examIndiaUser", JSON.stringify(payload));
          switchStep("step-reg-success");
        } finally {
          btn.disabled = false;
          btn.innerHTML = `<span>Create Candidate Profile</span> <i data-lucide="user-plus" class="w-4 h-4"></i>`;
          if (typeof lucide !== "undefined") lucide.createIcons();
        }
      }

      function finishAuthAndGoHome() {
        const sessionData = {
          date: new Date().toDateString(),
          portal: "ALL_EXAMS",
          timeLeft: 1800,
          isActivated: true,
        };
        localStorage.setItem("examIndiaSession", JSON.stringify(sessionData));
        window.location.href = "home.html";
      }

      document.addEventListener("DOMContentLoaded", () => {
        if (typeof lucide !== "undefined") lucide.createIcons();
      });
    </script>
  </body>
</html>
