          html += `<option value="${i}" class="bg-indigo-900 text-white font-bold">${label}</option>`;
        }
        select.innerHTML = html;
        select.value = currentSelectedClass;

        const content = document.getElementById(`content-${dayId}`);

        if (content.classList.contains("hidden")) {
          content.classList.remove("hidden");
          if (icon) icon.style.transform = "rotate(180deg)";
        } else {
          content.classList.add("hidden");
          if (icon) icon.style.transform = "rotate(0deg)";
        }
      }

      // MOBILE SIDEBAR MENU TOGGLE
      function toggleMobileMenu() {
        const drawer = document.getElementById("sidebar-drawer");
        const overlay = document.getElementById("sidebar-overlay");
        const icon = document.getElementById("hamburger-icon");

        if (drawer.classList.contains("-translate-x-full")) {
          drawer.classList.remove("-translate-x-full");
          overlay.classList.remove("hidden");
          icon.setAttribute("data-lucide", "x");
        } else {
          drawer.classList.add("-translate-x-full");
          overlay.classList.add("hidden");
          icon.setAttribute("data-lucide", "menu");
        }
        if (typeof lucide !== "undefined") {
          lucide.createIcons();
        }
      }

      // SIDEBAR SEARCH FILTER
      function searchSidebarFeatures() {
        const query = document
          .getElementById("sidebar-search")
          .value.toLowerCase()
          .trim();
        const items = document.querySelectorAll(".sidebar-item");
        const headers = document.querySelectorAll(".section-header");

        items.forEach((item) => {
          const keywords = item.getAttribute("data-keywords")
            ? item.getAttribute("data-keywords").toLowerCase()
            : "";
          const textContent = item.textContent.toLowerCase();
          if (
            query === "" ||
            keywords.includes(query) ||
            textContent.includes(query)
          ) {
            item.style.display = "flex";
          } else {
            item.style.display = "none";
          }
        });

        headers.forEach((header) => {
          let nextEl = header.nextElementSibling;
          let hasVisibleChild = false;
          while (nextEl && !nextEl.classList.contains("section-header")) {
            if (nextEl.style.display !== "none") {
              hasVisibleChild = true;
              break;
            }
            nextEl = nextEl.nextElementSibling;
          }
          header.style.display =
            hasVisibleChild || query === "" ? "block" : "none";
        });
      }
