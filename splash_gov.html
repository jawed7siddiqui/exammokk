<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>EXAM MOKK — Practice Today. Succeed Tomorrow.</title>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #020617;
        user-select: none;
      }
      .mobile-container {
        width: 100%;
        max-width: 430px;
        height: 100vh;
        max-height: 100vh;
        background-color: #ffffff;
        position: relative;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      }
      .bg-dots {
        background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
        background-size: 16px 16px;
      }
      .font-mono-code {
        font-family:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
      @keyframes floatSlow {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      .animate-float {
        animation: floatSlow 3.5s ease-in-out infinite;
      }
      @keyframes pulseSlow {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      .animate-pulse {
        animation: pulseSlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
    </style>
  </head>

  <body>
    <div class="mobile-container">
      <!-- Background Accents -->
      <div
        class="bg-dots"
        style="position: absolute; inset: 0; opacity: 0.4; pointer-events: none"
      ></div>
      <div
        style="
          position: absolute;
          top: -80px;
          right: -80px;
          width: 240px;
          height: 240px;
          background-color: rgba(224, 231, 255, 0.6);
          border-radius: 9999px;
          filter: blur(48px);
          pointer-events: none;
        "
      ></div>
      <div
        style="
          position: absolute;
          bottom: -80px;
          left: -80px;
          width: 240px;
          height: 240px;
          background-color: #eff6ff;
          border-radius: 9999px;
          filter: blur(48px);
          pointer-events: none;
        "
      ></div>

      <!-- 1. Top Bar -->
      <header
        style="
          position: relative;
          z-index: 10;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding-top: 4px;
        "
      >
        <div
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 9999px;
            padding: 6px 14px;
          "
        >
          <span style="font-size: 14px">🇮🇳</span>
          <span
            style="
              font-size: 10px;
              font-weight: 800;
              letter-spacing: 0.05em;
              color: #334155;
              text-transform: uppercase;
            "
          >
            All Government Exams
          </span>
        </div>

        <div
          style="
            display: flex;
            align-items: center;
            gap: 6px;
            background-color: #eef2ff;
            border: 1px solid #e0e7ff;
            padding: 4px 10px;
            border-radius: 9999px;
          "
        >
          <span
            class="animate-pulse"
            style="
              width: 6px;
              height: 6px;
              border-radius: 9999px;
              background-color: #4f46e5;
              display: inline-block;
            "
          ></span>
          <span
            class="font-mono-code"
            style="
              font-size: 9px;
              font-weight: 900;
              color: #4338ca;
              text-transform: uppercase;
            "
            >Smart Engine</span
          >
        </div>
      </header>

      <!-- 2. Main Center Hero -->
      <main
        style="
          position: relative;
          z-index: 10;
          display: flex;
          flex-direction: column;
          align-items: center;
          text-align: center;
          margin: auto 0;
        "
      >
        <!-- Logo Mascot -->
        <div
          class="animate-float"
          style="position: relative; margin-bottom: 20px"
        >
          <div
            style="
              width: 96px;
              height: 96px;
              border-radius: 24px;
              background-color: #0f172a;
              display: flex;
              align-items: center;
              justify-content: center;
              box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
              border: 4px solid #ffffff;
            "
          >
            <div
              style="
                width: 56px;
                height: 56px;
                border-radius: 16px;
                background-color: #4f46e5;
                display: flex;
                align-items: center;
                justify-content: center;
              "
            >
              <!-- Inline Zap SVG -->
              <svg
                width="28"
                height="28"
                viewBox="0 0 24 24"
                fill="#ffffff"
                stroke="#ffffff"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polygon
                  points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"
                ></polygon>
              </svg>
            </div>
          </div>
          <div
            style="
              position: absolute;
              bottom: -4px;
              right: -4px;
              background-color: #fbbf24;
              color: #020617;
              padding: 2px 8px;
              border-radius: 6px;
              font-size: 9px;
              font-weight: 900;
              letter-spacing: 0.05em;
              border: 1px solid #ffffff;
            "
          >
            MOKK
          </div>
        </div>

        <h1
          style="
            font-size: 30px;
            font-weight: 900;
            color: #020617;
            letter-spacing: -0.025em;
            display: flex;
            align-items: center;
            gap: 4px;
          "
        >
          EXAM <span style="color: #4f46e5">MOKK</span>
        </h1>

        <p
          style="
            font-size: 14px;
            font-weight: 700;
            color: #334155;
            margin-top: 4px;
          "
        >
          Practice Today. Succeed Tomorrow.
        </p>

        <div
          style="
            margin-top: 12px;
            display: inline-flex;
            align-items: center;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 4px 14px;
            border-radius: 9999px;
          "
        >
          <span style="font-size: 11px; font-weight: 700; color: #64748b">
            Mock Tests • Practice Sets • Smart Analytics
          </span>
        </div>

        <!-- 3-Step Roadmap -->
        <div
          style="
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            margin-top: 32px;
          "
        >
          <div
            style="
              background-color: rgba(248, 250, 252, 0.9);
              border: 1px solid #e2e8f0;
              border-radius: 16px;
              padding: 12px;
              display: flex;
              flex-direction: column;
              align-items: center;
            "
          >
            <div
              style="
                width: 32px;
                height: 32px;
                border-radius: 12px;
                background-color: #eef2ff;
                color: #4f46e5;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 6px;
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
              </svg>
            </div>
            <span style="font-size: 11px; font-weight: 900; color: #1e293b"
              >Learn</span
            >
            <span
              style="
                font-size: 9px;
                font-weight: 600;
                color: #94a3b8;
                margin-top: 2px;
              "
              >Concepts</span
            >
          </div>

          <div
            style="
              background-color: rgba(248, 250, 252, 0.9);
              border: 1px solid #e2e8f0;
              border-radius: 16px;
              padding: 12px;
              display: flex;
              flex-direction: column;
              align-items: center;
            "
          >
            <div
              style="
                width: 32px;
                height: 32px;
                border-radius: 12px;
                background-color: #fffbeb;
                color: #d97706;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 6px;
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="6"></circle>
                <circle cx="12" cy="12" r="2"></circle>
              </svg>
            </div>
            <span style="font-size: 11px; font-weight: 900; color: #1e293b"
              >Practice</span
            >
            <span
              style="
                font-size: 9px;
                font-weight: 600;
                color: #94a3b8;
                margin-top: 2px;
              "
              >Real Mocks</span
            >
          </div>

          <div
            style="
              background-color: rgba(248, 250, 252, 0.9);
              border: 1px solid #e2e8f0;
              border-radius: 16px;
              padding: 12px;
              display: flex;
              flex-direction: column;
              align-items: center;
            "
          >
            <div
              style="
                width: 32px;
                height: 32px;
                border-radius: 12px;
                background-color: #ecfdf5;
                color: #059669;
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 6px;
              "
            >
              <svg
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path
                  d="M10 14.66V17c0 .55-.45 1-1 1H7v2h10v-2h-2c-.55 0-1-.45-1-1v-2.34c3.2-1.07 5-3.8 5-7.66H4c0 3.86 1.8 6.59 5 7.66z"
                ></path>
              </svg>
            </div>
            <span style="font-size: 11px; font-weight: 900; color: #1e293b"
              >Succeed</span
            >
            <span
              style="
                font-size: 9px;
                font-weight: 600;
                color: #94a3b8;
                margin-top: 2px;
              "
              >Top AIR</span
            >
          </div>
        </div>
      </main>

      <!-- 3. Footer -->
      <footer
        style="
          position: relative;
          z-index: 10;
          width: 100%;
          padding-bottom: 8px;
          display: flex;
          flex-direction: column;
          gap: 10px;
        "
      >
        <!-- Progress Bar -->
        <div
          style="
            height: 8px;
            width: 100%;
            overflow: hidden;
            border-radius: 9999px;
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            padding: 2px;
          "
        >
          <div
            id="splash-progress-bar"
            style="
              height: 100%;
              border-radius: 9999px;
              background-color: #0f172a;
              width: 0%;
              transition: width 75ms linear;
            "
          ></div>
        </div>

        <div
          style="
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            padding: 0 2px;
          "
        >
          <span
            id="loading-text"
            style="font-size: 10px; font-weight: 700; color: #64748b"
          >
            Initializing your practice workspace...
          </span>
          <span
            id="progress-percentage"
            class="font-mono-code"
            style="font-size: 11px; font-weight: 900; color: #4338ca"
          >
            0%
          </span>
        </div>

        <div
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding-top: 4px;
            font-size: 10px;
            font-weight: 700;
            color: #94a3b8;
            border-top: 1px solid #f1f5f9;
          "
        >
          <svg
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#059669"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            <path d="m9 12 2 2 4-4"></path>
          </svg>
          <span>Your Complete Exam Preparation Partner</span>
        </div>
      </footer>
    </div>

    <!-- Script -->
    <script>
      (function () {
        const progressBar = document.getElementById("splash-progress-bar");
        const percentText = document.getElementById("progress-percentage");
        const loadingText = document.getElementById("loading-text");

        let progress = 0;

        const interval = setInterval(() => {
          progress += 1;

          if (progressBar) progressBar.style.width = progress + "%";
          if (percentText) percentText.textContent = progress + "%";

          if (progress === 25) {
            loadingText.textContent = "Setting up smart mock test engine...";
          }
          if (progress === 50) {
            loadingText.textContent = "Loading performance tracker...";
          }
          if (progress === 75) {
            loadingText.textContent = "Syncing All-India ranking system...";
          }
          if (progress === 95) {
            loadingText.textContent = "Your workspace is ready!";
          }

          if (progress >= 100) {
            clearInterval(interval);
            redirectUser();
          }
        }, 40);

        function redirectUser() {
          const session =
            localStorage.getItem("examIndiaSession") ||
            localStorage.getItem("kidsPaintSession");
          const user =
            localStorage.getItem("examIndiaUser") ||
            localStorage.getItem("kidsPaintUser");

          if (session && user) {
            window.location.href = "home_gov.html";
          } else {
            window.location.href = "auth_gov.html";
          }
        }
      })();
    </script>
  </body>
</html>
