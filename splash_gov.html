<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>EXAM NEXT — Practice Today. Succeed Tomorrow.</title>

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
      }
      .font-mono-code {
        font-family: "Space Grotesk", monospace;
      }
      .bg-dots {
        background-image: radial-gradient(#cbd5e1 1.2px, transparent 1.2px);
        background-size: 16px 16px;
      }
      @keyframes floatSlow {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      .animate-float {
        animation: floatSlow 3.5s ease-in-out infinite;
      }
    </style>
  </head>

  <body
    class="flex justify-center items-center min-h-screen bg-slate-950 select-none"
  >
    <!-- MOBILE CONTAINER (430px Viewport) -->
    <div
      class="w-full max-w-[430px] h-screen max-h-screen bg-white relative overflow-hidden flex flex-col justify-between p-6 shadow-2xl"
    >
      <!-- SUBTLE BACKGROUND ACCENTS -->
      <div
        class="absolute inset-0 bg-dots opacity-40 pointer-events-none"
      ></div>
      <div
        class="absolute -top-20 -right-20 w-60 h-60 bg-indigo-100/60 rounded-full blur-3xl pointer-events-none"
      ></div>
      <div
        class="absolute -bottom-20 -left-20 w-60 h-60 bg-blue-50 rounded-full blur-3xl pointer-events-none"
      ></div>

      <!-- 1. TOP BAR -->
      <header class="relative z-10 flex items-center justify-between pt-1">
        <div
          class="flex items-center gap-2 bg-slate-50 border border-slate-200/90 rounded-full px-3.5 py-1.5 shadow-2xs"
        >
          <span class="text-sm">🇮🇳</span>
          <span
            class="text-[10px] font-extrabold tracking-wider text-slate-700 uppercase"
          >
            All Government Exams
          </span>
        </div>

        <div
          class="flex items-center gap-1.5 bg-indigo-50 border border-indigo-100 px-2.5 py-1 rounded-full"
        >
          <span
            class="w-1.5 h-1.5 rounded-full bg-indigo-600 animate-pulse"
          ></span>
          <span
            class="text-[9px] font-black text-indigo-700 font-mono-code uppercase"
            >Smart Engine</span
          >
        </div>
      </header>

      <!-- 2. MAIN CENTER HERO -->
      <main
        class="relative z-10 flex flex-col items-center text-center my-auto"
      >
        <!-- Logo Mascot -->
        <div class="relative mb-5 animate-float">
          <div
            class="w-24 h-24 rounded-3xl bg-slate-900 text-white flex items-center justify-center shadow-xl border-4 border-white"
          >
            <div
              class="w-14 h-14 rounded-2xl bg-indigo-600 flex items-center justify-center text-white shadow-inner"
            >
              <i data-lucide="zap" class="w-7 h-7 fill-current"></i>
            </div>
          </div>
          <div
            class="absolute -bottom-1 -right-1 bg-amber-400 text-slate-950 px-2 py-0.5 rounded-md text-[9px] font-black tracking-wide border border-white shadow-xs"
          >
            NEXT
          </div>
        </div>

        <!-- Master Title -->
        <h1
          class="text-3xl font-black text-slate-950 tracking-tight flex items-center gap-1"
        >
          EXAM <span class="text-indigo-600">NEXT</span>
        </h1>

        <!-- Slogan -->
        <p class="text-sm font-bold text-slate-700 mt-1">
          Practice Today. Succeed Tomorrow.
        </p>

        <!-- Minimal Sub-Pill -->
        <div
          class="mt-3 inline-flex items-center gap-1.5 bg-slate-100 border border-slate-200/80 px-3.5 py-1 rounded-full"
        >
          <span class="text-[11px] font-bold text-slate-500">
            Mock Tests • Practice Sets • Smart Analytics
          </span>
        </div>

        <!-- Universal 3-Step Roadmap -->
        <div class="grid grid-cols-3 gap-2.5 w-full mt-8">
          <div
            class="bg-slate-50/90 border border-slate-200/80 rounded-2xl p-3 flex flex-col items-center shadow-2xs"
          >
            <div
              class="w-8 h-8 rounded-xl bg-indigo-50 text-indigo-600 flex items-center justify-center mb-1.5"
            >
              <i data-lucide="book-open" class="w-4 h-4"></i>
            </div>
            <span class="text-[11px] font-black text-slate-800">Learn</span>
            <span class="text-[9px] font-semibold text-slate-400 mt-0.5"
              >Concepts</span
            >
          </div>

          <div
            class="bg-slate-50/90 border border-slate-200/80 rounded-2xl p-3 flex flex-col items-center shadow-2xs"
          >
            <div
              class="w-8 h-8 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center mb-1.5"
            >
              <i data-lucide="target" class="w-4 h-4"></i>
            </div>
            <span class="text-[11px] font-black text-slate-800">Practice</span>
            <span class="text-[9px] font-semibold text-slate-400 mt-0.5"
              >Real Mocks</span
            >
          </div>

          <div
            class="bg-slate-50/90 border border-slate-200/80 rounded-2xl p-3 flex flex-col items-center shadow-2xs"
          >
            <div
              class="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-600 flex items-center justify-center mb-1.5"
            >
              <i data-lucide="trophy" class="w-4 h-4"></i>
            </div>
            <span class="text-[11px] font-black text-slate-800">Succeed</span>
            <span class="text-[9px] font-semibold text-slate-400 mt-0.5"
              >Top AIR</span
            >
          </div>
        </div>
      </main>

      <!-- 3. FOOTER WITH 4-SEC TIMER -->
      <footer class="relative z-10 w-full space-y-2.5 pb-2">
        <!-- Progress Bar -->
        <div
          class="h-2 w-full overflow-hidden rounded-full bg-slate-100 border border-slate-200 p-0.5"
        >
          <div
            id="splash-progress-bar"
            class="h-full rounded-full bg-slate-900 transition-all duration-75 ease-linear"
            style="width: 0%"
          ></div>
        </div>

        <div class="flex w-full items-center justify-between px-0.5">
          <span id="loading-text" class="text-[10px] font-bold text-slate-500">
            Initializing your practice workspace...
          </span>
          <span
            id="progress-percentage"
            class="text-[11px] font-black text-indigo-700 font-mono-code"
          >
            0%
          </span>
        </div>

        <div
          class="flex items-center justify-center gap-1.5 pt-1 text-[10px] font-bold text-slate-400 border-t border-slate-100"
        >
          <i
            data-lucide="shield-check"
            class="w-3.5 h-3.5 text-emerald-600"
          ></i>
          <span>Your Complete Exam Preparation Partner</span>
        </div>
      </footer>
    </div>

    <!-- JAVASCRIPT: EXACT 4-SECOND ENGINE (100 STEPS × 40ms = 4,000ms) -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof lucide !== "undefined") {
          lucide.createIcons();
        }

        const progressBar = document.getElementById("splash-progress-bar");
        const percentText = document.getElementById("progress-percentage");
        const loadingText = document.getElementById("loading-text");

        let progress = 0;

        // 100 steps * 40ms = 4000ms (4 Seconds)
        const interval = setInterval(() => {
          progress += 1;

          if (progressBar) progressBar.style.width = `${progress}%`;
          if (percentText) percentText.textContent = `${progress}%`;

          // Dynamic updates over 4 seconds
          if (progress === 25) {
            loadingText.textContent = "Setting up smart mock test engine...";
          }
          if (progress === 50) {
            loadingText.textContent = "Loading performance tracker...";
          }
          if (progress === 75) {
            loadingText.textContent = "Syncing All-India ranking system...";
          }
          if (progress === 95) {
            loadingText.textContent = "Your workspace is ready!";
          }

          if (progress >= 100) {
            clearInterval(interval);
            redirectUser();
          }
        }, 40);

        function redirectUser() {
          const session =
            localStorage.getItem("examIndiaSession") ||
            localStorage.getItem("kidsPaintSession");
          const user =
            localStorage.getItem("examIndiaUser") ||
            localStorage.getItem("kidsPaintUser");

          if (session && user) {
            window.location.href = "home_gov.html";
          } else {
            window.location.href = "auth_gov.html";
          }
        }
      });
    </script>
  </body>
</html>
