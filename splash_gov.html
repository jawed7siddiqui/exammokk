<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>ExamIndia - Govt Exam Prep Portal</title>

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts: Outfit (Modern Headings) & Plus Jakarta Sans (Clean Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background: radial-gradient(
          circle at 50% 20%,
          #1e1b4b 0%,
          #0f172a 60%,
          #020617 100%
        );
        min-height: 100dvh;
      }

      .font-heading {
        font-family: "Outfit", sans-serif;
      }

      .font-mono-tag {
        font-family: "Space Grotesk", monospace;
      }

      /* Elegant Breathing Glow */
      @keyframes soft-float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-10px);
        }
      }
      .animate-float-subtle {
        animation: soft-float 3.5s ease-in-out infinite;
      }

      @keyframes emblem-glow {
        0%,
        100% {
          box-shadow:
            0 0 25px rgba(99, 102, 241, 0.35),
            0 0 50px rgba(59, 130, 246, 0.2);
        }
        50% {
          box-shadow:
            0 0 45px rgba(99, 102, 241, 0.6),
            0 0 80px rgba(59, 130, 246, 0.35);
        }
      }
      .animate-emblem {
        animation: emblem-glow 3s ease-in-out infinite;
      }

      /* Shimmer Effect for Loading */
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      .shimmer-effect::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.4),
          transparent
        );
        animation: shimmer 1.8s infinite;
      }
    </style>
  </head>
  <body
    class="flex flex-col items-center justify-between p-6 relative overflow-hidden select-none antialiased text-white"
  >
    <!-- AMBIENT GLOW BACKDROPS -->
    <div
      class="absolute top-10 left-1/2 -translate-x-1/2 w-80 h-80 bg-indigo-600/15 rounded-full blur-3xl pointer-events-none"
    ></div>
    <div
      class="absolute bottom-10 right-4 w-60 h-60 bg-blue-500/10 rounded-full blur-3xl pointer-events-none"
    ></div>
    <div
      class="absolute top-1/3 left-4 w-48 h-48 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"
    ></div>

    <!-- Floating Background Academic Icons -->
    <i
      data-lucide="award"
      class="absolute top-20 right-10 w-9 h-9 text-indigo-400/15 animate-float-subtle pointer-events-none"
    ></i>
    <i
      data-lucide="landmark"
      class="absolute bottom-32 left-8 w-11 h-11 text-blue-400/15 animate-float-subtle pointer-events-none"
      style="animation-delay: 1.5s"
    ></i>
    <i
      data-lucide="book-marked"
      class="absolute top-1/3 left-8 w-8 h-8 text-amber-400/15 animate-float-subtle pointer-events-none"
      style="animation-delay: 2.2s"
    ></i>
    <i
      data-lucide="target"
      class="absolute bottom-1/3 right-8 w-10 h-10 text-emerald-400/15 animate-pulse pointer-events-none"
    ></i>

    <!-- 1. TOP HEADER BADGE -->
    <header class="pt-4 z-10">
      <div
        class="inline-flex items-center gap-2 bg-slate-900/80 backdrop-blur-md border border-slate-700/60 px-4 py-1.5 rounded-full shadow-lg"
      >
        <span class="text-sm">🇮🇳</span>
        <span
          class="text-[11px] font-extrabold tracking-wider text-slate-200 uppercase font-mono-tag"
        >
          National Testing Portal
        </span>
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      </div>
    </header>

    <!-- 2. CENTER HERO SECTION -->
    <main class="flex flex-col items-center text-center my-auto z-10 max-w-sm">
      <!-- Govt Exam App Emblem Icon -->
      <div class="relative mb-6 animate-float-subtle">
        <div
          class="w-28 h-28 bg-gradient-to-br from-indigo-600 via-indigo-700 to-slate-900 rounded-3xl p-0.5 border border-indigo-400/30 animate-emblem flex items-center justify-center relative overflow-hidden"
        >
          <div
            class="w-full h-full bg-slate-950/40 rounded-[22px] flex items-center justify-center backdrop-blur-xs"
          >
            <i
              data-lucide="graduation-cap"
              class="w-14 h-14 text-indigo-300"
            ></i>
          </div>
        </div>

        <div
          class="absolute -top-2 -right-2 bg-gradient-to-r from-amber-400 to-orange-500 text-slate-950 p-2 rounded-xl shadow-md border border-amber-300/40"
        >
          <i
            data-lucide="shield-check"
            class="w-4 h-4 text-slate-950 stroke-[2.5]"
          ></i>
        </div>
      </div>

      <!-- Main App Name -->
      <h1
        class="text-4xl font-extrabold tracking-tight text-white font-heading uppercase drop-shadow-md mb-1 flex items-center gap-1"
      >
        <span>Exam</span><span class="text-indigo-400">India</span>
      </h1>

      <!-- Slogan / Subtitle -->
      <p
        class="text-xs font-semibold text-slate-300 mb-6 tracking-wide px-2 leading-relaxed"
      >
        Your Gateway to Central &amp; State Govt Careers
      </p>

      <!-- FEATURE PILLS / TAGS -->
      <div class="flex flex-wrap justify-center gap-2 mb-6 max-w-xs">
        <span
          class="bg-slate-900/90 border border-slate-700/80 text-indigo-300 text-[11px] font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 shadow-sm"
        >
          🏛️ UPSC &amp; State PSC
        </span>
        <span
          class="bg-slate-900/90 border border-slate-700/80 text-blue-300 text-[11px] font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 shadow-sm"
        >
          ⚡ SSC &amp; Railways
        </span>
        <span
          class="bg-slate-900/90 border border-slate-700/80 text-emerald-300 text-[11px] font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 shadow-sm"
        >
          🎯 Live Mock Tests
        </span>
        <span
          class="bg-slate-900/90 border border-slate-700/80 text-amber-300 text-[11px] font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 shadow-sm"
        >
          📊 AIR Analytics
        </span>
      </div>
    </main>

    <!-- 3. FOOTER PROGRESS BAR -->
    <footer
      class="w-full max-w-xs flex flex-col items-center gap-2.5 pb-6 z-10"
    >
      <div
        class="w-full bg-slate-800/80 h-2 rounded-full overflow-hidden p-0.5 border border-slate-700/80 relative shimmer-effect"
      >
        <div
          id="splash-progress-bar"
          class="bg-gradient-to-r from-indigo-500 via-blue-500 to-emerald-400 h-full rounded-full transition-all duration-200 ease-out w-0"
        ></div>
      </div>

      <div
        class="flex items-center justify-between w-full px-1 text-[10px] font-bold text-slate-400 tracking-wider uppercase font-mono-tag"
      >
        <span>Initializing Test Engine...</span>
        <span id="progress-percentage">0%</span>
      </div>
    </footer>

    <!-- AUTO REDIRECT CONTROLLER -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof lucide !== "undefined") lucide.createIcons();

        const progressBar = document.getElementById("splash-progress-bar");
        const percentText = document.getElementById("progress-percentage");
        let progress = 0;

        const interval = setInterval(() => {
          progress += 5;
          if (progressBar) progressBar.style.width = `${progress}%`;
          if (percentText) percentText.textContent = `${progress}%`;

          if (progress >= 100) {
            clearInterval(interval);
            redirectUser();
          }
        }, 120); // ~2.4 seconds loading time

        function redirectUser() {
          const session =
            localStorage.getItem("examIndiaSession") ||
            localStorage.getItem("kidsPaintSession");
          const user =
            localStorage.getItem("examIndiaUser") ||
            localStorage.getItem("kidsPaintUser");

          if (session && user) {
            window.location.href = "dashboard_gov_exam.html";
          } else {
            window.location.href = "auth_gov.html";
          }
        }
      });
    </script>
  </body>
</html>
