<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title id="page-tab-title">Exam Dashboard | ExamMokk</title>

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Master Subject Engine -->
    <script src="/js/AllSubject.js"></script>

    <style>
      body {
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
      }
      .custom-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .custom-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .pro-card {
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .pro-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -8px rgba(79, 70, 229, 0.12);
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeIn {
        animation: fadeIn 0.2s ease-out forwards;
      }
    </style>
  </head>
  <body
    class="flex flex-col min-h-screen selection:bg-indigo-600 selection:text-white antialiased"
  >
    <!-- TOAST NOTIFICATION CONTAINER -->
    <div
      id="custom-toast-container"
      class="fixed top-5 right-5 z-[9999] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none"
    ></div>

    <!-- 1. REUSABLE GLOBAL HEADER -->
    <div id="global-header"></div>

    <!-- 2. MAIN DASHBOARD CONTAINER -->
    <main
      class="flex-grow py-4 sm:py-8 px-3.5 sm:px-6 lg:px-8 max-w-6xl mx-auto w-full space-y-5"
    >
      <!-- STREAM TITLE + LIVE CHALLENGE HERO BANNER (SLIM PRO BANNER) -->
      <div
        class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 rounded-2xl sm:rounded-3xl p-4 sm:p-6 text-white shadow-xl shadow-slate-950/10 border border-slate-800 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4"
      >
        <div class="space-y-1">
          <div class="flex items-center gap-2">
            <span
              class="inline-flex items-center px-2 py-0.5 rounded-md text-[10px] font-black uppercase tracking-wider bg-emerald-500/20 text-emerald-300 border border-emerald-500/30"
            >
              Live Mock
            </span>
            <span
              id="page-header-title"
              class="text-xs sm:text-sm font-bold text-indigo-200"
            >
              Loading Exam Stream...
            </span>
          </div>
          <h2
            id="daily-challenge-title"
            class="text-base sm:text-xl font-extrabold text-white tracking-tight"
          >
            Today's Special Speed Test Set
          </h2>
          <div class="flex items-center gap-3 text-xs text-slate-300 pt-0.5">
            <span
              id="daily-challenge-qs"
              class="flex items-center gap-1 font-medium"
              >📝 15 Qs</span
            >
            <span>•</span>
            <span
              id="daily-challenge-time"
              class="flex items-center gap-1 font-medium"
              >⏱️ 15 Mins</span
            >
            <span>•</span>
            <span class="text-emerald-400 font-bold">100% Free</span>
          </div>
        </div>

        <button
          onclick="startDailyTest()"
          class="w-full sm:w-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white rounded-xl font-bold text-xs sm:text-sm transition flex items-center justify-center gap-2 cursor-pointer shadow-md shrink-0"
        >
          <span>Start Now</span>
          <i data-lucide="play" class="w-4 h-4 fill-current"></i>
        </button>
      </div>

      <!-- SUBJECT MODULES -->
      <section class="space-y-3">
        <div class="flex items-center justify-between px-1">
          <h3
            class="text-xs sm:text-sm font-black uppercase tracking-wider text-slate-500 flex items-center gap-1.5"
          >
            <i data-lucide="layers" class="w-4 h-4 text-indigo-600"></i>
            <span>Subject Modules</span>
          </h3>
          <span
            id="total-subjects-count"
            class="text-[11px] font-bold text-indigo-600 bg-indigo-50 px-2.5 py-0.5 rounded-full border border-indigo-100"
          >
            0 Modules
          </span>
        </div>

        <!-- ACCORDION CONTAINER -->
        <div id="subjects-accordion-container" class="space-y-2.5"></div>
      </section>
    </main>

    <!-- UNLOCK / PAYWALL MODAL -->
    <div
      id="paywall-modal"
      class="fixed inset-0 bg-slate-950/70 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden"
    >
      <div
        class="bg-white rounded-2xl w-full max-w-sm p-5 space-y-4 shadow-2xl border border-slate-100 animate-fadeIn"
      >
        <div
          class="flex items-center justify-between border-b border-slate-100 pb-3"
        >
          <h3 class="text-sm font-black text-slate-900">Unlock Test Paper</h3>
          <button
            onclick="closePaywallModal()"
            class="w-7 h-7 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center cursor-pointer hover:bg-slate-200 transition"
          >
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div
          class="bg-indigo-50/70 border border-indigo-100 rounded-xl p-3.5 text-center space-y-1"
        >
          <p
            id="paywall-test-title"
            class="text-xs font-bold text-indigo-950 truncate"
          >
            Mock Test Series
          </p>
          <div class="flex items-center justify-center gap-2">
            <span
              id="paywall-test-price"
              class="text-xl font-black text-indigo-600"
              >₹9</span
            >
            <span
              id="paywall-test-mrp"
              class="text-xs text-slate-400 line-through font-bold"
              >₹19</span
            >
            <span
              class="text-[10px] font-black bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full"
              >SAVE 50%</span
            >
          </div>
        </div>

        <div class="space-y-2">
          <button
            onclick="executeBuyTest()"
            class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow transition flex items-center justify-center gap-1.5 cursor-pointer active:scale-95"
          >
            <i data-lucide="unlock" class="w-3.5 h-3.5"></i>
            <span id="btn-paywall-text">Unlock Now @ ₹9</span>
          </button>
          <button
            onclick="executeBuyPass()"
            class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs rounded-xl transition flex items-center justify-center gap-1.5 cursor-pointer active:scale-95"
          >
            <i data-lucide="crown" class="w-3.5 h-3.5 text-amber-400"></i>
            <span>Get Exam Pass @ ₹99/mo</span>
          </button>
        </div>
      </div>
    </div>

    <!-- 3. REUSABLE GLOBAL FOOTER -->
    <div id="global-footer"></div>

    <script src="/js/layout.js"></script>

    <script>
      const BASE_API_URL =
        "https://exam-api.jawedsiddiqui.cloud/api/kidspaint/subject";

      const urlParams = new URLSearchParams(window.location.search);
      const rawType = (urlParams.get("type") || "SSC").toUpperCase();

      const STREAM_TITLES = {
        DAILY_GK: { title: "Daily GK & Current Affairs", badge: "Daily Live" },
        SSC: { title: "SSC (CGL, CHSL, MTS)", badge: "TCS Pattern" },
        RAILWAYS: {
          title: "Railways (RRB NTPC, Group D)",
          badge: "Railway CBT",
        },
        BANKING: { title: "Banking (IBPS, SBI, RBI)", badge: "IBPS Pattern" },
        JEE_NEET: { title: "JEE Main & NEET UG", badge: "NTA Simulator" },
        DEFENCE: { title: "Defence & Police Exams", badge: "Defence Series" },
        TEACHING: { title: "Teaching & State TET", badge: "Teaching Series" },
        ENTRANCE: { title: "CUET & Law Entrances", badge: "NTA Entrance" },
        GOVT_PSC: { title: "Civil Services & State PSC", badge: "State PCS" },
      };

      const currentSegment = STREAM_TITLES[rawType] ? rawType : "SSC";
      let openSubjectId = null;
      let activeDailyTest = null;
      let expandedSubjectsMap = {};

      function showToastMessage(text, type = "info") {
        const container = document.getElementById("custom-toast-container");
        if (!container) return;

        const toast = document.createElement("div");
        toast.className = `p-3 rounded-2xl text-xs font-bold text-white shadow-xl flex items-center justify-between gap-2 pointer-events-auto animate-fadeIn ${
          type === "error"
            ? "bg-rose-600"
            : type === "success"
              ? "bg-emerald-600"
              : "bg-indigo-600"
        }`;

        toast.innerHTML = `
          <span>${text}</span>
          <button onclick="this.parentElement.remove()" class="p-1 opacity-70 hover:opacity-100 cursor-pointer">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        `;

        container.appendChild(toast);
        if (typeof lucide !== "undefined") lucide.createIcons();

        setTimeout(() => {
          toast.remove();
        }, 3500);
      }

      function isWithinFiveDays(dateString) {
        if (!dateString) return false;
        const testDate = new Date(dateString).getTime();
        const diffInDays = (Date.now() - testDate) / (1000 * 60 * 60 * 24);
        return diffInDays >= 0 && diffInDays <= 5;
      }

      function getCurrentSubjectList() {
        if (
          typeof subjectsBySegment !== "undefined" &&
          subjectsBySegment[currentSegment]
        ) {
          return subjectsBySegment[currentSegment];
        }
        if (
          currentSegment === "DAILY_GK" &&
          (window.DAILY_GK || typeof DAILY_GK !== "undefined")
        ) {
          return window.DAILY_GK || DAILY_GK;
        }
        if (
          window[currentSegment] ||
          typeof window[currentSegment] !== "undefined"
        ) {
          return window[currentSegment];
        }
        return [];
      }

      function syncHeaderUI() {
        const meta = STREAM_TITLES[currentSegment] || {
          title: "Exam Dashboard",
        };
        document.getElementById("page-tab-title").innerText =
          `${meta.title} | ExamMokk`;
        document.getElementById("page-header-title").innerText = meta.title;
      }

      async function fetchSubjectTests(subjObj) {
        if (!subjObj) return;
        subjObj.loading = true;
        subjObj.hasError = false;
        renderAccordion();

        try {
          const apiQuery = subjObj.apiSubject || subjObj.name;
          const res = await fetch(
            `${BASE_API_URL}/${encodeURIComponent(apiQuery)}`,
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const resData = await res.json();

          if (
            resData?.success &&
            Array.isArray(resData.data) &&
            resData.data.length > 0
          ) {
            const rawItems = resData.data.map((item) => ({
              id: item.test_id || item._id,
              title:
                item.title || item.test_name || `${subjObj.name} Mock Test`,
              rawLevel: item.level ? Number(item.level) : null,
              desc:
                item.desc || item.category_title || "Official Practice Paper",
              ques: Number(item.total_questions) || 15,
              time: Number(item.total_time_mins) || 15,
              access_type: item.access_type || "free",
              price: item.price || 0,
              discounted_price: item.discounted_price || 0,
              difficulty: item.difficulty_level || "Medium",
              is_daily: Boolean(item.is_daily_challenge),
              included_in_pass: item.included_in_pass !== false,
              exam_category: item.exam_category || currentSegment,
              createdAt: item.createdAt || item.date || null,
            }));

            // Separate tests with explicit level vs missing level
            const explicitLevelTests = rawItems
              .filter((item) => item.rawLevel !== null && item.rawLevel > 0)
              .sort((a, b) => a.rawLevel - b.rawLevel);

            const missingLevelTests = rawItems.filter(
              (item) => item.rawLevel === null || item.rawLevel <= 0,
            );

            let nextAutoLevel =
              explicitLevelTests.length > 0
                ? explicitLevelTests[explicitLevelTests.length - 1].rawLevel + 1
                : 1;

            const incrementedMissingTests = missingLevelTests.map((item) => {
              const assigned = nextAutoLevel;
              nextAutoLevel++;
              return {
                ...item,
                level: assigned,
              };
            });

            // Level 1, 2 upar, incremented tests unke baad
            subjObj.categories = [
              ...explicitLevelTests.map((t) => ({ ...t, level: t.rawLevel })),
              ...incrementedMissingTests,
            ];
          } else if (Array.isArray(subjObj.categories)) {
            subjObj.categories = subjObj.categories.map((c, idx) => ({
              id: c.id,
              title: `${c.title}`,
              level: idx + 1,
              desc: c.description || `${subjObj.name} Practice Chapter`,
              ques: 15,
              time: 15,
              access_type: "free",
              price: 0,
              discounted_price: 0,
              difficulty: "Medium",
              is_daily: false,
              included_in_pass: true,
              exam_category: currentSegment,
              createdAt: null,
            }));
          }

          let dailyItem =
            subjObj.categories.find((c) => c.is_daily) || subjObj.categories[0];
          if (dailyItem) {
            activeDailyTest = dailyItem;
            document.getElementById("daily-challenge-title").innerText =
              dailyItem.title;
            document.getElementById("daily-challenge-qs").innerText =
              `📝 ${dailyItem.ques} Qs`;
            document.getElementById("daily-challenge-time").innerText =
              `⏱️ ${dailyItem.time} Mins`;
          }

          subjObj.loaded = true;
        } catch (error) {
          subjObj.hasError = true;
        } finally {
          subjObj.loading = false;
          renderAccordion();
        }
      }

      function openFirstSubject() {
        const activeList = getCurrentSubjectList();
        if (activeList.length > 0) {
          openSubjectId = activeList[0].id;
          fetchSubjectTests(activeList[0]);
        } else {
          renderAccordion();
        }
      }

      function toggleSubjectMore(subId) {
        expandedSubjectsMap[subId] = !expandedSubjectsMap[subId];
        renderAccordion();
      }

      function renderAccordion() {
        const container = document.getElementById(
          "subjects-accordion-container",
        );
        const activeList = getCurrentSubjectList();
        const isUserPremium = getUserPremiumStatus();

        document.getElementById("total-subjects-count").innerText =
          `${activeList.length} Subjects`;

        if (activeList.length === 0) {
          container.innerHTML = `
            <div class="py-10 text-center bg-white rounded-2xl border border-slate-200 p-4">
              <p class="text-xs font-bold text-slate-500">No subject tests found.</p>
            </div>
          `;
          if (typeof lucide !== "undefined") lucide.createIcons();
          return;
        }

        container.innerHTML = activeList
          .map((subj) => {
            const isOpen = subj.id === openSubjectId;
            const allCategories = subj.categories || [];
            const categoryCount = allCategories.length;
            const isExpanded = Boolean(expandedSubjectsMap[subj.id]);

            // Web view: show max 3 initial cards, click to expand rest
            const visibleCategories = isExpanded
              ? allCategories
              : allCategories.slice(0, 3);
            const hiddenCount = Math.max(0, categoryCount - 3);

            return `
            <div class="bg-white border ${isOpen ? "border-indigo-400 ring-1 ring-indigo-400/20 shadow-xs" : "border-slate-200/90"} rounded-2xl overflow-hidden transition">
              
              <!-- SUBJECT TITLE ROW -->
              <div 
                onclick="toggleSubject('${subj.id}')"
                class="p-3.5 sm:p-4 flex items-center justify-between cursor-pointer select-none hover:bg-slate-50 transition"
              >
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-9 h-9 rounded-xl ${subj.color || "bg-indigo-600"} text-white flex items-center justify-center text-base font-bold shrink-0">
                    ${subj.icon || "📚"}
                  </div>
                  <div class="min-w-0">
                    <h4 class="font-extrabold text-slate-900 text-xs sm:text-sm truncate">${subj.name}</h4>
                    <span class="text-[11px] text-slate-400 font-semibold">${categoryCount} Papers Available</span>
                  </div>
                </div>

                <div class="flex items-center gap-2">
                  <div class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 transition duration-200 ${isOpen ? "rotate-180 bg-indigo-50 text-indigo-600" : ""}">
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                  </div>
                </div>
              </div>

              <!-- PAPERS GRID -->
              ${
                isOpen
                  ? `
                <div class="bg-slate-50/60 p-3 sm:p-4 border-t border-slate-100 space-y-3 animate-fadeIn">
                  ${
                    subj.loading
                      ? `<div class="py-6 text-center text-xs font-bold text-indigo-600">Loading tests...</div>`
                      : categoryCount > 0
                        ? `
                        <div class="space-y-3">
                          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                            ${visibleCategories
                              .map((cat) => {
                                const isPaid =
                                  cat.access_type === "paid" ||
                                  cat.access_type === "subscription_only";
                                const isUnlocked = isUserPremium || !isPaid;
                                const isNew = isWithinFiveDays(cat.createdAt);

                                const cardContainerClass = isNew
                                  ? "bg-emerald-50/70 border border-emerald-300 shadow-2xs hover:border-emerald-400"
                                  : "bg-white border border-slate-200 rounded-xl shadow-2xs hover:border-indigo-300";

                                const titleTextClass = isNew
                                  ? "text-emerald-950 font-black"
                                  : "text-slate-900 font-extrabold";

                                const descTextClass = isNew
                                  ? "text-emerald-700/90"
                                  : "text-slate-500";

                                const levelBadgeClass = isNew
                                  ? "bg-emerald-100 text-emerald-800 border-emerald-200"
                                  : "bg-indigo-50 text-indigo-700 border-indigo-200";

                                let priceBadge = "";
                                if (cat.access_type === "paid") {
                                  priceBadge = `<span class="text-[9.5px] font-black bg-indigo-50 text-indigo-700 border border-indigo-200 px-1.5 py-0.2 rounded shrink-0">₹${cat.discounted_price || cat.price}</span>`;
                                } else if (
                                  cat.access_type === "subscription_only"
                                ) {
                                  priceBadge = `<span class="text-[9.5px] font-black bg-amber-50 text-amber-800 border border-amber-200 px-1.5 py-0.2 rounded shrink-0">🔒 PASS</span>`;
                                }

                                const catJsonEscaped = JSON.stringify(
                                  cat,
                                ).replace(/'/g, "&apos;");

                                return `
                                  <div class="pro-card ${cardContainerClass} p-3.5 flex flex-col justify-between space-y-2.5 transition-all">
                                    <div class="space-y-1">
                                      <div class="flex items-center gap-1.5 flex-wrap">
                                        <h5 class="${titleTextClass} text-xs leading-snug break-words">
                                          ${cat.title}
                                        </h5>
                                        <span class="px-1.5 py-0.2 ${levelBadgeClass} border text-[8.5px] font-black rounded uppercase shrink-0">
                                          LVL ${cat.level || 1}
                                        </span>
                                        ${priceBadge}
                                      </div>

                                      <p class="text-[10.5px] font-medium ${descTextClass} line-clamp-2 leading-relaxed">
                                        ${cat.desc}
                                      </p>
                                    </div>

                                    <div class="pt-2 border-t ${isNew ? "border-emerald-200/60" : "border-slate-100"} flex items-center justify-between gap-2">
                                      <div class="flex items-center gap-1.5 text-[10px] font-bold text-slate-400">
                                        <span class="${isNew ? "text-emerald-800" : "text-slate-600"}">📝 ${cat.ques} Qs</span>
                                        <span>•</span>
                                        <span class="${isNew ? "text-emerald-800" : "text-slate-600"}">⏱️ ${cat.time}m</span>
                                      </div>

                                      <div>
                                        ${
                                          isUnlocked
                                            ? `
                                          <button 
                                            onclick="startTest('${cat.id}', '${cat.exam_category}', ${cat.level || 1})"
                                            class="px-3.5 py-1.5 ${isNew ? "bg-emerald-600 hover:bg-emerald-700" : "bg-indigo-600 hover:bg-indigo-700"} active:scale-95 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 cursor-pointer"
                                          >
                                            <span>Start</span>
                                            <i data-lucide="play" class="w-3 h-3 fill-current"></i>
                                          </button>
                                        `
                                            : `
                                          <button 
                                            onclick='openPaywall(${catJsonEscaped})'
                                            class="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white rounded-lg text-xs font-bold transition flex items-center gap-1.5 cursor-pointer"
                                          >
                                            <i data-lucide="lock" class="w-3 h-3"></i>
                                            <span>Unlock</span>
                                          </button>
                                        `
                                        }
                                      </div>
                                    </div>
                                  </div>
                                `;
                              })
                              .join("")}
                          </div>

                          <!-- MINIMAL TOGGLE ARROW BUTTON FOR WEB (IF > 3 TESTS) -->
                          ${
                            categoryCount > 3
                              ? `
                            <div class="pt-1 flex justify-center">
                              <button
                                onclick="event.stopPropagation(); toggleSubjectMore('${subj.id}')"
                                class="px-5 py-2 bg-white hover:bg-slate-100 border border-slate-200/90 active:scale-95 rounded-full text-slate-700 font-extrabold text-xs transition-all cursor-pointer flex items-center gap-2 shadow-2xs group"
                              >
                                <span>${isExpanded ? "Show Less" : `+${hiddenCount} More Tests`}</span>
                                <i 
                                  data-lucide="${isExpanded ? "chevron-up" : "chevron-down"}" 
                                  class="w-3.5 h-3.5 text-indigo-600 transition-transform duration-200 group-hover:translate-y-0.5"
                                ></i>
                              </button>
                            </div>
                          `
                              : ""
                          }
                        </div>
                      `
                        : `<div class="py-4 text-center text-slate-400 font-bold text-xs">No tests available.</div>`
                  }
                </div>
              `
                  : ""
              }
            </div>
          `;
          })
          .join("");

        if (typeof lucide !== "undefined") lucide.createIcons();
      }

      function toggleSubject(id) {
        if (openSubjectId === id) {
          openSubjectId = null;
        } else {
          openSubjectId = id;
          const subj = getCurrentSubjectList().find((s) => s.id === id);
          if (subj && !subj.loaded && !subj.loading) {
            fetchSubjectTests(subj);
            return;
          }
        }
        renderAccordion();
      }

      function startTest(testId, examCategory, level = 1) {
        window.location.href = `/test/runner?test_id=${encodeURIComponent(testId)}&level=${level}&segment=${encodeURIComponent(examCategory || currentSegment)}`;
      }

      function startDailyTest() {
        if (activeDailyTest) {
          startTest(
            activeDailyTest.id,
            activeDailyTest.exam_category,
            activeDailyTest.level || 1,
          );
        } else {
          const list = getCurrentSubjectList();
          const firstCat = list[0]?.categories?.[0];
          if (firstCat) {
            startTest(firstCat.id, firstCat.exam_category, firstCat.level || 1);
          }
        }
      }

      function getUserPremiumStatus() {
        try {
          const rawUser = localStorage.getItem("examIndiaUser");
          if (rawUser) {
            const userObj = JSON.parse(rawUser);
            return userObj.is_premium || userObj.has_pass || false;
          }
        } catch (e) {}
        return false;
      }

      function openPaywall(testObj) {
        document.getElementById("paywall-test-title").innerText = testObj.title;
        document.getElementById("paywall-test-price").innerText =
          `₹${testObj.discounted_price || testObj.price || 9}`;
        document.getElementById("paywall-test-mrp").innerText =
          `₹${testObj.price || 19}`;
        document.getElementById("btn-paywall-text").innerText =
          `Unlock Now @ ₹${testObj.discounted_price || testObj.price || 9}`;
        document.getElementById("paywall-modal").classList.remove("hidden");
      }

      function closePaywallModal() {
        document.getElementById("paywall-modal").classList.add("hidden");
      }

      function executeBuyTest() {
        closePaywallModal();
        showToastMessage("Opening Payment Gateway...", "info");
      }

      function executeBuyPass() {
        closePaywallModal();
        showToastMessage("Redirecting to All-Access Pass...", "info");
      }

      document.addEventListener("DOMContentLoaded", () => {
        syncHeaderUI();
        openFirstSubject();
        if (typeof lucide !== "undefined") lucide.createIcons();
      });
    </script>
  </body>
</html>
