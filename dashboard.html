<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>KidsPaint - Mobile Dashboard</title>

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Master Scripts -->
    <script src="js/kidsSubject.js"></script>
    <script src="js/nav.js"></script>

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #090d16;
        -webkit-tap-highlight-color: transparent;
      }
      .font-kids {
        font-family: "Fredoka", sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-3px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeIn {
        animation: fadeIn 0.2s ease-out forwards;
      }
    </style>
  </head>
  <body class="flex justify-center items-center min-h-screen bg-slate-950">
    <!-- MOBILE CONTAINER (Phone Viewport: 430px Fit) -->
    <div
      class="w-full max-w-[430px] bg-slate-50 h-screen max-h-screen flex flex-col justify-start shadow-2xl relative overflow-hidden"
    >
      <!-- 1. FIXED TOP HEADER (NO GAP) -->
      <header
        class="bg-white border-b border-slate-200 shadow-2xs px-4 py-2.5 sticky top-0 z-30 shrink-0 flex items-center justify-between w-full"
      >
        <a href="index.html" class="flex items-center gap-1.5 no-underline">
          <i
            data-lucide="sparkles"
            class="w-4 h-4 fill-current text-amber-400"
          ></i>
          <span
            class="text-lg font-black tracking-wide text-indigo-600 uppercase flex items-center font-kids"
          >
            Kids&nbsp;<span class="text-pink-500 animate-pulse">P</span
            ><span class="text-amber-500">a</span
            ><span class="text-emerald-500">i</span
            ><span class="text-cyan-500">n</span
            ><span class="text-violet-500">t</span>
          </span>
        </a>

        <button
          onclick="handleLogout()"
          class="flex items-center gap-1 bg-red-50 hover:bg-red-100 text-red-600 px-2.5 py-1 rounded-xl border border-red-100 text-[11px] font-extrabold transition-all active:scale-95 cursor-pointer shadow-2xs"
        >
          <i data-lucide="log-out" class="w-3.5 h-3.5 text-red-500"></i>
          <span>Logout</span>
        </button>
      </header>

      <!-- 2. MAIN SCROLLABLE CONTENT (LOCKED TO TOP) -->
      <main
        class="flex-1 px-4 pt-3 pb-24 space-y-3 overflow-y-auto no-scrollbar"
      >
        <!-- USER PROFILE & RANK CARD -->
        <div
          class="flex items-center justify-between bg-white p-3 rounded-2xl border border-slate-200/80 shadow-2xs"
        >
          <div class="flex items-center gap-2.5 min-w-0">
            <div
              id="user-avatar"
              class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 text-white font-extrabold flex items-center justify-center text-sm shadow-xs uppercase shrink-0"
            >
              K
            </div>
            <div class="min-w-0">
              <h2
                id="user-display-name"
                class="text-xs font-extrabold text-slate-800 truncate leading-tight"
              >
                Student
              </h2>
              <p
                id="user-display-grade"
                class="text-[10px] text-slate-400 font-semibold mt-0.5"
              >
                Grade 1
              </p>
            </div>
          </div>

          <div
            class="bg-indigo-50 border border-indigo-100 px-2.5 py-1 rounded-xl text-right shrink-0"
          >
            <span class="text-[8px] font-bold text-slate-400 block uppercase"
              >Rank</span
            >
            <span class="text-xs font-black text-indigo-600 font-kids"
              >#12 overall</span
            >
          </div>
        </div>

        <!-- SCORECARD SUMMARY BANNER -->
        <div
          class="bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-800 rounded-2xl p-3.5 text-white shadow-md shadow-indigo-600/10 relative overflow-hidden"
        >
          <div class="flex items-center justify-between mb-1.5">
            <span
              class="text-[9px] font-extrabold uppercase tracking-wider bg-white/20 backdrop-blur-md px-2 py-0.5 rounded-full text-white"
            >
              Last Performance
            </span>
            <span class="text-[10px] font-bold text-indigo-200">Recent</span>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center my-2">
            <div
              class="bg-white/10 backdrop-blur-xs rounded-xl p-1.5 border border-white/10"
            >
              <p class="text-[8px] font-bold text-indigo-200 uppercase">
                Score
              </p>
              <p
                id="dash-banner-score"
                class="text-xs font-black text-white mt-0.5 font-kids"
              >
                85/100
              </p>
            </div>
            <div
              class="bg-white/10 backdrop-blur-xs rounded-xl p-1.5 border border-white/10"
            >
              <p class="text-[8px] font-bold text-indigo-200 uppercase">
                Accuracy
              </p>
              <p
                id="dash-banner-accuracy"
                class="text-xs font-black text-emerald-300 mt-0.5 font-kids"
              >
                92%
              </p>
            </div>
            <div
              class="bg-white/10 backdrop-blur-xs rounded-xl p-1.5 border border-white/10"
            >
              <p class="text-[8px] font-bold text-indigo-200 uppercase">
                Grade
              </p>
              <p
                id="dash-banner-grade"
                class="text-xs font-black text-amber-300 mt-0.5 font-kids"
              >
                A+
              </p>
            </div>
          </div>

          <button
            onclick="window.location.href = 'scoreboard.html'"
            class="w-full mt-1 py-2 bg-white text-indigo-700 rounded-xl font-extrabold text-xs flex items-center justify-center gap-1 shadow-sm active:scale-95 transition-all cursor-pointer font-kids"
          >
            <span>View Scorecard &amp; Analysis</span>
            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- SUBJECT EXPANDABLE ACCORDION SECTION -->
        <div class="space-y-2">
          <div class="flex items-center justify-between px-1">
            <h3
              class="text-xs font-extrabold text-slate-800 uppercase tracking-wider"
            >
              All Subjects &amp; Test Papers
            </h3>
            <span
              id="total-subjects-count"
              class="text-[10px] font-extrabold bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full border border-indigo-100"
            ></span>
          </div>

          <!-- ACCORDION CONTAINER -->
          <div id="subjects-accordion-container" class="space-y-2.5"></div>
        </div>
      </main>

      <!-- 3. DYNAMIC BOTTOM NAVIGATION PLACEHOLDER (Rendered by js/nav.js) -->
      <div id="bottom-nav-placeholder"></div>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
      const BASE_API_URL =
        "https://api.jawedsiddiqui.cloud/api/kidspaint/subject";

      let openSubjectId = null;

      function loadUserProfile() {
        try {
          const rawUser = localStorage.getItem("kidsPaintUser");
          if (rawUser) {
            const userObj = JSON.parse(rawUser);
            const name = userObj.studentName || userObj.name || "Student";
            const grade = userObj.classGrade || "Grade 1";

            document.getElementById("user-display-name").textContent = name;
            document.getElementById("user-display-grade").textContent = grade;
            document.getElementById("user-avatar").textContent = name
              .charAt(0)
              .toUpperCase();
          }
        } catch (err) {
          console.error("User Load Error:", err);
        }
      }

      async function fetchSubjectTests(subjObj) {
        subjObj.loading = true;
        renderAccordion();

        try {
          const res = await fetch(
            `${BASE_API_URL}/${encodeURIComponent(subjObj.apiSubject)}`,
          );
          const resData = await res.json();

          if (resData?.success && Array.isArray(resData.data)) {
            subjObj.categories = resData.data.map((item) => ({
              id: item.test_id || item._id,
              title:
                item.title || item.test_name || `${subjObj.name} Test Paper`,
              desc:
                item.category_title ||
                item.description ||
                "Interactive Practice Module",
              ques: item.total_questions || item.questions?.length || 10,
              time: item.total_time_mins || item.time_limit || 20,
            }));
          } else {
            subjObj.categories = [];
          }
          subjObj.loaded = true;
        } catch (error) {
          console.error(
            `Failed to fetch tests for ${subjObj.apiSubject}:`,
            error,
          );
          subjObj.categories = [];
        } finally {
          subjObj.loading = false;
          renderAccordion();
        }
      }

      function renderAccordion() {
        const container = document.getElementById(
          "subjects-accordion-container",
        );
        const activeList =
          typeof subjectsData !== "undefined" ? subjectsData : [];

        document.getElementById("total-subjects-count").textContent =
          `${activeList.length} Subjects`;

        container.innerHTML = activeList
          .map((subj) => {
            const isOpen = subj.id === openSubjectId;

            return `
            <div class="bg-white border ${isOpen ? "border-indigo-500 shadow-xs" : "border-slate-200/90"} rounded-2xl overflow-hidden transition-all duration-200">
              
              <!-- SUBJECT HEADER -->
              <div 
                onclick="toggleSubject('${subj.id}')"
                class="p-3 flex items-center justify-between cursor-pointer select-none bg-white hover:bg-slate-50 transition-all"
              >
                <div class="flex items-center gap-2.5 min-w-0">
                  <div class="w-9 h-9 rounded-xl ${subj.color || "bg-indigo-500"} text-white flex items-center justify-center text-lg font-black shrink-0 shadow-2xs">
                    ${subj.icon || "📝"}
                  </div>
                  <div class="min-w-0">
                    <h4 class="font-extrabold text-slate-800 text-xs truncate">${subj.name}</h4>
                    <span class="text-[9px] font-bold text-slate-400 block">
                      ${subj.loading ? "Loading tests..." : subj.loaded ? `${subj.categories.length} Test Papers` : "Tap to explore"}
                    </span>
                  </div>
                </div>

                <div class="flex items-center gap-1.5 shrink-0">
                  <span class="text-[9px] font-extrabold px-2 py-0.5 rounded-full border ${subj.badgeColor || "bg-indigo-50 text-indigo-700 border-indigo-200"}">
                    ${subj.loading ? "⏳..." : subj.loaded ? `${subj.categories.length} Tests` : "View"}
                  </span>
                  <div class="w-6 h-6 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 transition-transform duration-200 ${isOpen ? "rotate-180 bg-indigo-50 text-indigo-600" : ""}">
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5"></i>
                  </div>
                </div>
              </div>

              <!-- EXPANDABLE TEST PAPERS LIST -->
              ${
                isOpen
                  ? `
                <div class="bg-slate-50 p-2.5 border-t border-slate-100 space-y-2 animate-fadeIn">
                  ${
                    subj.loading
                      ? `
                      <div class="py-5 text-center">
                        <div class="w-5 h-5 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-1.5"></div>
                        <p class="text-[11px] font-bold text-indigo-600">Fetching ${subj.name} Papers...</p>
                      </div>
                    `
                      : subj.categories.length > 0
                        ? subj.categories
                            .map(
                              (cat) => `
                        <div class="bg-white border border-slate-200/80 rounded-xl p-2.5 flex items-center justify-between shadow-2xs hover:border-indigo-300 transition-all">
                          <div class="pr-2 min-w-0">
                            <h5 class="font-extrabold text-slate-800 text-xs truncate">${cat.title}</h5>
                            <p class="text-[9px] font-semibold text-slate-400 truncate mt-0.5">${cat.desc}</p>
                            <div class="flex items-center gap-1.5 mt-1">
                              <span class="text-[8px] font-bold bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded">
                                ${cat.ques} Ques
                              </span>
                              <span class="text-[8px] font-bold bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded">
                                ⏱️ ${cat.time} M
                              </span>
                            </div>
                          </div>

                          <button 
                            onclick="startTest('${cat.id}')"
                            class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-[11px] font-extrabold transition-all cursor-pointer shadow-2xs active:scale-95 shrink-0 flex items-center gap-1 font-kids"
                          >
                            <span>Start</span>
                            <i data-lucide="play" class="w-3 h-3 fill-current"></i>
                          </button>
                        </div>
                      `,
                            )
                            .join("")
                        : `
                      <div class="py-3 text-center text-slate-400 font-bold text-[11px]">
                        📂 No test papers available right now.
                      </div>
                    `
                  }
                </div>
              `
                  : ""
              }

            </div>
          `;
          })
          .join("");

        if (typeof lucide !== "undefined") {
          lucide.createIcons();
        }
      }

      function toggleSubject(id) {
        const targetSubj = (
          typeof subjectsData !== "undefined" ? subjectsData : []
        ).find((s) => s.id === id);

        if (openSubjectId === id) {
          openSubjectId = null;
        } else {
          openSubjectId = id;
          if (targetSubj && !targetSubj.loaded && !targetSubj.loading) {
            fetchSubjectTests(targetSubj);
            return;
          }
        }
        renderAccordion();
      }

      function startTest(testId) {
        window.location.href = `kids_runner.html?test_id=${encodeURIComponent(testId)}`;
      }

      function handleLogout() {
        if (confirm("Kya aap logout karna chahte hain?")) {
          localStorage.clear();
          sessionStorage.clear();
          location.reload();
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadUserProfile();
        renderAccordion();
      });
    </script>
  </body>
</html>
