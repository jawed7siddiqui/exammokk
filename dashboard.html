<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>KidsPaint - Scalable Mobile Dashboard</title>

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&family=Fredoka:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #0f172a;
        -webkit-tap-highlight-color: transparent;
      }
      .font-kids {
        font-family: "Fredoka", sans-serif;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeIn {
        animation: fadeIn 0.25s ease-out forwards;
      }
    </style>
  </head>
  <body class="flex justify-center items-center min-h-screen">
    <!-- MOBILE CONTAINER (Phone Viewport: 430px) -->
    <div
      class="w-full max-w-[430px] bg-slate-50 min-h-screen flex flex-col justify-between shadow-2xl relative overflow-hidden pb-20"
    >
      <!-- 1. HEADER -->
      <header
        class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50 px-4 py-3"
      >
        <div class="flex items-center justify-between w-full">
          <a href="#" class="flex items-center gap-1 no-underline">
            <i
              data-lucide="sparkles"
              class="w-5 h-5 fill-current text-amber-400"
            ></i>
            <span
              class="text-xl font-black tracking-wide text-indigo-600 uppercase flex items-center font-kids"
            >
              Kids&nbsp;<span class="text-pink-500 animate-pulse">P</span
              ><span class="text-amber-500">a</span
              ><span class="text-emerald-500">i</span
              ><span class="text-cyan-500">n</span
              ><span class="text-violet-500">t</span>
            </span>
          </a>

          <button
            onclick="handleLogout()"
            class="flex items-center gap-1.5 bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded-xl border border-red-100 text-xs font-extrabold transition-all active:scale-95 cursor-pointer shadow-sm"
          >
            <i data-lucide="log-out" class="w-4 h-4 text-red-500"></i>
            <span>Logout</span>
          </button>
        </div>
      </header>

      <!-- 2. MAIN CONTENT -->
      <main class="px-4 py-4 space-y-4 overflow-y-auto">
        <!-- USER PROFILE & RANK (Dynamic LocalStorage Values) -->
        <div
          class="flex items-center justify-between bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm"
        >
          <div class="flex items-center gap-3">
            <div
              id="user-avatar"
              class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 to-violet-500 text-white font-extrabold flex items-center justify-center text-base shadow-md shadow-indigo-100 uppercase"
            >
              K
            </div>
            <div>
              <h2
                id="user-display-name"
                class="text-xs font-extrabold text-slate-800 leading-tight"
              >
                Kumar
              </h2>
              <p
                id="user-display-grade"
                class="text-[10px] text-slate-500 font-semibold mt-0.5"
              >
                Grade 1
              </p>
            </div>
          </div>
          <div
            class="bg-indigo-50 border border-indigo-100 px-2.5 py-1 rounded-xl text-right"
          >
            <span class="text-[9px] font-bold text-slate-400 block uppercase"
              >Rank</span
            >
            <span class="text-xs font-black text-indigo-600">#12 overall</span>
          </div>
        </div>

        <!-- SCORECARD BANNER -->
        <div
          class="bg-gradient-to-br from-indigo-600 via-indigo-700 to-violet-800 rounded-2xl p-4 text-white shadow-xl shadow-indigo-100 relative overflow-hidden"
        >
          <div class="flex items-center justify-between mb-2">
            <span
              class="text-[9px] font-extrabold uppercase tracking-wider bg-white/20 backdrop-blur-md px-2 py-0.5 rounded-full text-white"
            >
              Last Test Performance
            </span>
            <span class="text-[10px] font-bold text-indigo-200">2 hrs ago</span>
          </div>

          <div class="grid grid-cols-3 gap-2 text-center my-2">
            <div
              class="bg-white/10 backdrop-blur-sm rounded-xl p-2 border border-white/10"
            >
              <p class="text-[9px] font-bold text-indigo-200 uppercase">
                Score
              </p>
              <p class="text-sm font-black text-white mt-0.5">85/100</p>
            </div>
            <div
              class="bg-white/10 backdrop-blur-sm rounded-xl p-2 border border-white/10"
            >
              <p class="text-[9px] font-bold text-indigo-200 uppercase">
                Accuracy
              </p>
              <p class="text-sm font-black text-emerald-300 mt-0.5">92%</p>
            </div>
            <div
              class="bg-white/10 backdrop-blur-sm rounded-xl p-2 border border-white/10"
            >
              <p class="text-[9px] font-bold text-indigo-200 uppercase">Rank</p>
              <p class="text-sm font-black text-amber-300 mt-0.5">#5</p>
            </div>
          </div>

          <button
            onclick="alert('Complete Scorecard View')"
            class="w-full mt-1 py-2 bg-white text-indigo-700 rounded-xl font-extrabold text-xs flex items-center justify-center gap-1 shadow-md active:scale-95 transition-all cursor-pointer"
          >
            <span>View Scorecard & Analysis</span>
            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- SUBJECT EXPANDABLE ACCORDION SECTION -->
        <div>
          <div class="flex items-center justify-between mb-2.5">
            <h3
              class="text-xs font-extrabold text-slate-800 uppercase tracking-wider"
            >
              All Subjects & Test Papers
            </h3>
            <span
              id="total-subjects-count"
              class="text-[10px] font-extrabold bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded-full"
            ></span>
          </div>

          <!-- ACCORDION CONTAINER -->
          <div id="subjects-accordion-container" class="space-y-3"></div>
        </div>
      </main>

      <!-- 3. BOTTOM NAVIGATION -->
      <nav
        class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-white border-t border-slate-200 px-6 py-2.5 flex justify-between items-center z-50"
      >
        <button class="flex flex-col items-center gap-0.5 text-indigo-600">
          <i data-lucide="home" class="w-5 h-5"></i>
          <span class="text-[10px] font-extrabold">Home</span>
        </button>
        <button
          class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-indigo-600"
        >
          <i data-lucide="file-check-2" class="w-5 h-5"></i>
          <span class="text-[10px] font-bold">Tests</span>
        </button>
        <button
          class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-indigo-600"
        >
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
          <span class="text-[10px] font-bold">Scorecard</span>
        </button>
        <button
          class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-indigo-600"
        >
          <i data-lucide="user" class="w-5 h-5"></i>
          <span class="text-[10px] font-bold">Profile</span>
        </button>
      </nav>
    </div>

    <!-- JAVASCRIPT SCALABLE ACCORDION & API INTEGRATION -->
    <script>
      const BASE_API_URL =
        "https://api.jawedsiddiqui.cloud/api/kidspaint/subject";

      // Subject Metadata Mapping
      const subjectsData = [
        {
          id: "gk",
          apiSubject: "General Knowledge",
          name: "General Knowledge",
          icon: "🌍",
          color: "bg-amber-500",
          badgeColor: "bg-amber-50 text-amber-700 border-amber-200",
          categories: [],
          loaded: false,
          loading: false,
        },
        {
          id: "maths",
          apiSubject: "Mathematics", // 👈 Maths ki jagah Mathematics Bhej rahe hain
          name: "Maths",
          icon: "🔢",
          color: "bg-indigo-500",
          badgeColor: "bg-indigo-50 text-indigo-700 border-indigo-200",
          categories: [],
          loaded: false,
          loading: false,
        },
        {
          id: "computer",
          apiSubject: "Computer",
          name: "Computer",
          icon: "💻",
          color: "bg-sky-500",
          badgeColor: "bg-sky-50 text-sky-700 border-sky-200",
          categories: [],
          loaded: false,
          loading: false,
        },
        {
          id: "english",
          apiSubject: "English",
          name: "English",
          icon: "🔤",
          color: "bg-emerald-500",
          badgeColor: "bg-emerald-50 text-emerald-700 border-emerald-200",
          categories: [],
          loaded: false,
          loading: false,
        },
        {
          id: "hindi",
          apiSubject: "Hindi",
          name: "Hindi",
          icon: "📚",
          color: "bg-rose-500",
          badgeColor: "bg-rose-50 text-rose-700 border-rose-200",
          categories: [],
          loaded: false,
          loading: false,
        },
      ];

      // Track Open Accordion (Only 1 open at a time)
      let openSubjectId = null;

      // Extract User Data from LocalStorage ('kidsPaintUser')
      function loadUserProfile() {
        try {
          const rawUser = localStorage.getItem("kidsPaintUser");
          if (rawUser) {
            const userObj = JSON.parse(rawUser);
            const name = userObj.studentName || userObj.name || "Kumar";
            const grade = userObj.classGrade || "Grade 1";

            document.getElementById("user-display-name").textContent = name;
            document.getElementById("user-display-grade").textContent = grade;
            document.getElementById("user-avatar").textContent = name
              .charAt(0)
              .toUpperCase();
          }
        } catch (err) {
          console.error("Error reading kidsPaintUser:", err);
        }
      }

      // Fetch Subject Tests on Demand
      async function fetchSubjectTests(subjObj) {
        subjObj.loading = true;
        renderAccordion();

        try {
          const res = await fetch(
            `${BASE_API_URL}/${encodeURIComponent(subjObj.apiSubject)}`,
          );
          const resData = await res.json();

          if (resData?.success && Array.isArray(resData.data)) {
            subjObj.categories = resData.data.map((item) => ({
              id: item.test_id || item._id,
              title: item.title || item.test_name || "Maths Test Paper",
              desc:
                item.category_title ||
                item.description ||
                "Interactive Practice Module",
              ques: item.total_questions || item.questions?.length || 15,
              time: item.total_time_mins || item.time_limit || 20,
            }));
          } else {
            subjObj.categories = [];
          }
          subjObj.loaded = true;
        } catch (error) {
          console.error(
            `Failed to fetch tests for ${subjObj.apiSubject}:`,
            error,
          );
          subjObj.categories = [];
        } finally {
          subjObj.loading = false;
          renderAccordion();
        }
      }

      function renderAccordion() {
        const container = document.getElementById(
          "subjects-accordion-container",
        );
        document.getElementById("total-subjects-count").textContent =
          `${subjectsData.length} Subjects`;

        container.innerHTML = subjectsData
          .map((subj) => {
            const isOpen = subj.id === openSubjectId;

            return `
            <!-- SUBJECT ITEM -->
            <div class="bg-white border-2 ${isOpen ? "border-indigo-500 shadow-md" : "border-slate-200"} rounded-2xl overflow-hidden transition-all duration-300">
              
              <!-- SUBJECT HEADER -->
              <div 
                onclick="toggleSubject('${subj.id}')"
                class="p-3.5 flex items-center justify-between cursor-pointer select-none bg-white hover:bg-slate-50 transition-all"
              >
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl ${subj.color} text-white flex items-center justify-center text-xl font-black shrink-0 shadow-sm">
                    ${subj.icon}
                  </div>
                  <div>
                    <h4 class="font-extrabold text-slate-800 text-sm">${subj.name}</h4>
                    <span class="text-[10px] font-bold text-slate-400">
                      ${subj.loading ? "Loading tests..." : subj.loaded ? `${subj.categories.length} Test Modules` : "Click to load tests"}
                    </span>
                  </div>
                </div>

                <div class="flex items-center gap-2">
                  <span class="text-[10px] font-extrabold px-2 py-0.5 rounded-full border ${subj.badgeColor}">
                    ${subj.loading ? "⏳..." : subj.loaded ? `${subj.categories.length} Tests` : "Explore"}
                  </span>
                  <div class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-600 transition-transform duration-300 ${isOpen ? "rotate-180 bg-indigo-50 text-indigo-600" : ""}">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                  </div>
                </div>
              </div>

              <!-- EXPANDABLE TEST PAPERS LIST -->
              ${
                isOpen
                  ? `
                <div class="bg-slate-50 p-3 border-t border-slate-100 space-y-2.5 animate-fadeIn">
                  ${
                    subj.loading
                      ? `
                      <div class="py-6 text-center">
                        <div class="w-7 h-7 border-3 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                        <p class="text-xs font-extrabold text-indigo-600">Fetching ${subj.name} Papers...</p>
                      </div>
                    `
                      : subj.categories.length > 0
                        ? subj.categories
                            .map(
                              (cat) => `
                        <div class="bg-white border border-slate-200/80 rounded-xl p-3 flex items-center justify-between shadow-xs hover:border-indigo-300 transition-all">
                          <div class="pr-2">
                            <h5 class="font-extrabold text-slate-800 text-xs">${cat.title}</h5>
                            <p class="text-[10px] font-semibold text-slate-400 mt-0.5">${cat.desc}</p>
                            <div class="flex items-center gap-2 mt-1.5">
                              <span class="text-[9px] font-black bg-slate-100 text-slate-600 px-2 py-0.5 rounded">
                                ${cat.ques} Ques
                              </span>
                              <span class="text-[9px] font-black bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded">
                                ⏱️ ${cat.time} Mins
                              </span>
                            </div>
                          </div>

                          <button 
                            onclick="startTest('${cat.id}', '${cat.title}')"
                            class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-extrabold transition-all cursor-pointer shadow-sm active:scale-95 shrink-0 flex items-center gap-1"
                          >
                            <span>Start</span>
                            <i data-lucide="play" class="w-3 h-3 fill-current"></i>
                          </button>
                        </div>
                      `,
                            )
                            .join("")
                        : `
                      <div class="py-4 text-center text-slate-400 font-extrabold text-xs">
                        📂 No test papers available for ${subj.name} right now.
                      </div>
                    `
                  }
                </div>
              `
                  : ""
              }

            </div>
          `;
          })
          .join("");

        lucide.createIcons();
      }

      function toggleSubject(id) {
        const targetSubj = subjectsData.find((s) => s.id === id);

        if (openSubjectId === id) {
          openSubjectId = null; // Close if clicked again
        } else {
          openSubjectId = id; // Open requested subject
          if (targetSubj && !targetSubj.loaded && !targetSubj.loading) {
            fetchSubjectTests(targetSubj);
            return;
          }
        }
        renderAccordion();
      }

      function startTest(testId, title) {
        // Redirect to Test Runner Page
        window.location.href = `kids_runner.html?test_id=${encodeURIComponent(testId)}`;
      }

      function handleLogout() {
        if (confirm("Kya aap logout karna chahte hain?")) {
          localStorage.clear();
          sessionStorage.clear();
          location.reload();
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadUserProfile();
        renderAccordion();
      });
    </script>
  </body>
</html>
