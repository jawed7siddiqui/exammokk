<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- PRIMARY SEO METADATA -->
    <title>Exam Preparation Blogs & Strategy Guides – AI ExamMokk</title>
    <meta
      name="description"
      content="Read expert preparation strategies, syllabus analysis, daily current affairs rundowns, and smart CBT techniques on AI ExamMokk."
    />
    <meta
      name="keywords"
      content="exam blogs, competitive exam strategy, ssc cgl tips, bank po strategy, current affairs notes, exammokk blogs"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://exammokk.cloud/blogs" />

    <!-- MOBILE CAPABILITY & THEME -->
    <meta name="theme-color" content="#4f46e5" />

    <!-- TAILWIND CSS, LUCIDE ICONS & FONTS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        -webkit-tap-highlight-color: transparent;
      }
      .font-mono-tag {
        font-family: "Space Grotesk", monospace;
      }
      .card-hover {
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease,
          border-color 0.2s ease;
      }
      .card-hover:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
      }
    </style>
  </head>
  <body
    class="flex flex-col min-h-screen selection:bg-indigo-600 selection:text-white antialiased relative"
  >
    <!-- REUSABLE HEADER (layout.js will render here) -->
    <div id="global-header"></div>

    <main
      class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-4 sm:py-6 space-y-6"
    >
      <!-- 1. HERO SECTION -->
      <section
        class="bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-900 border border-amber-500/30 rounded-3xl p-6 sm:p-8 text-white overflow-hidden shadow-xl shadow-slate-950/20 relative"
      >
        <div
          class="absolute -right-12 -top-12 w-64 h-64 bg-amber-500/15 rounded-full blur-3xl pointer-events-none"
        ></div>
        <div
          class="absolute -left-12 -bottom-12 w-52 h-52 bg-indigo-500/20 rounded-full blur-3xl pointer-events-none"
        ></div>

        <div class="relative z-10 max-w-3xl space-y-3">
          <div
            class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-amber-400/15 border border-amber-300/30 text-[10px] sm:text-[11px] font-mono-tag font-black text-amber-300 shadow-xs"
          >
            <span>📚</span>
            <span>STRATEGY, NOTIFICATIONS &amp; CURRENT AFFAIRS</span>
          </div>

          <h1
            class="text-2xl sm:text-3xl md:text-4xl font-black tracking-tight text-white leading-tight"
          >
            Exam Insights &amp;
            <span
              class="text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-400 to-amber-200"
            >
              Preparation Articles
            </span>
          </h1>

          <p
            class="text-xs sm:text-sm text-slate-300 leading-relaxed font-medium"
          >
            Subject-wise revision tips, high-yield current affairs digests, exam
            pattern breakdowns, and data-backed score improvement strategies.
          </p>
        </div>
      </section>

      <!-- 2. BLOG LIST SECTION -->
      <section class="space-y-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2">
            <i data-lucide="book-open" class="w-5 h-5 text-indigo-600"></i>
            <h2 class="text-base sm:text-lg font-black text-slate-900">
              Latest Articles
            </h2>
          </div>
          <span
            class="text-xs font-bold bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full border border-indigo-200 font-mono-tag"
          >
            FREE ACCESS
          </span>
        </div>

        <!-- Dynamic Blog Grid -->
        <div
          id="blog-list-container"
          class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5"
        >
          <!-- Cards populated via JS -->
        </div>

        <!-- Skeleton / Loader -->
        <div id="main-loader" class="text-center py-12 hidden">
          <div
            class="inline-block animate-spin rounded-full h-8 w-8 border-3 border-indigo-600 border-t-transparent"
          ></div>
          <p
            class="text-slate-500 font-semibold mt-3 text-xs tracking-wider uppercase"
          >
            Loading Articles...
          </p>
        </div>

        <!-- Load More Button -->
        <div
          id="pagination-wrapper"
          class="text-center pt-4 flex justify-center"
        >
          <button
            id="load-more-btn"
            onclick="loadMore()"
            class="hidden px-5 py-2.5 bg-white hover:bg-slate-50 text-slate-900 border border-slate-200 font-bold text-xs rounded-xl shadow-xs transition-all active:scale-95 cursor-pointer"
          >
            Load More Articles 🚀
          </button>
        </div>
      </section>
    </main>

    <!-- REUSABLE FOOTER (layout.js will render here) -->
    <div id="global-footer"></div>

    <!-- LAYOUT ENGINE SCRIPT -->
    <script src="/js/layout.js"></script>

    <!-- BLOG LOGIC SCRIPT -->
    <script>
      let currentPage = 1;
      const limit = 6;
      const selectedCategory = "All";

      const getCurrentDomain = () => {
        const host = window.location.hostname;
        if (host.includes("exammokk.cloud")) {
          return "exammokk.cloud";
        }
        return "exammokk.cloud";
      };

      async function fetchBlogs(page = 1, category = "All") {
        const loader = document.getElementById("main-loader");
        const btn = document.getElementById("load-more-btn");
        const paginationWrapper = document.getElementById("pagination-wrapper");
        const currentDomain = getCurrentDomain();

        loader.classList.remove("hidden");
        btn.classList.add("hidden");

        try {
          const catQuery =
            category !== "All"
              ? `&category=${encodeURIComponent(category)}`
              : "";
          const apiUrl = `https://exam-api.jawedsiddiqui.cloud/api/blogs?page=${page}&limit=${limit}&domain=${currentDomain}${catQuery}`;

          const response = await fetch(apiUrl);
          const { data, success, totalPages } = await response.json();

          if (success) {
            renderBlogs(data, page === 1);

            if (totalPages > 1 && page < totalPages) {
              btn.classList.remove("hidden");
            } else if (data && data.length > 0) {
              paginationWrapper.innerHTML =
                '<p class="text-slate-400 font-bold text-xs uppercase tracking-wider">All articles loaded.</p>';
            } else if (page === 1) {
              paginationWrapper.innerHTML =
                '<p class="text-slate-500 font-semibold text-xs">No articles published yet.</p>';
            }
          }
        } catch (error) {
          console.error("API Error:", error);
          document.getElementById("blog-list-container").innerHTML =
            '<div class="col-span-full text-center text-rose-600 font-bold text-xs py-8">Unable to load blogs right now. Please refresh.</div>';
        } finally {
          loader.classList.add("hidden");
        }
      }

      function renderBlogs(blogs, isFirstPage) {
        const container = document.getElementById("blog-list-container");
        if (isFirstPage) container.innerHTML = "";

        if (!blogs || blogs.length === 0) {
          if (isFirstPage) {
            container.innerHTML =
              '<div class="col-span-full text-center py-10 font-bold text-xs text-slate-400">No blog posts found.</div>';
          }
          return;
        }

        blogs.forEach((blog) => {
          const blogSlug = blog.slug || "#";
          const blogLink = `/blogs/${blogSlug}`;
          const imageSrc =
            blog.featuredImage ||
            "https://via.placeholder.com/600x340/0f172a/ffffff?text=ExamMokk+Prep";
          const publishDate = new Date(
            blog.createdAt || Date.now(),
          ).toLocaleDateString("en-IN", {
            month: "short",
            day: "numeric",
            year: "numeric",
          });

          const cardHTML = `
            <article class="group bg-white border border-slate-200/90 hover:border-indigo-600 rounded-2xl p-4 shadow-2xs card-hover flex flex-col justify-between overflow-hidden">
              <div class="space-y-3">
                <a href="${blogLink}" class="block overflow-hidden rounded-xl bg-slate-100 aspect-video">
                  <img
                    src="${imageSrc}"
                    alt="${blog.title}"
                    class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-200"
                    onerror="this.src='https://via.placeholder.com/600x340/0f172a/ffffff?text=ExamMokk+Prep'"
                  />
                </a>

                <div>
                  <div class="flex items-center justify-between text-[11px] font-mono-tag font-bold text-slate-400 mb-1.5">
                    <span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-md uppercase">
                      ${blog.category || "Preparation"}
                    </span>
                    <span>${publishDate}</span>
                  </div>

                  <a href="${blogLink}" class="no-underline">
                    <h3 class="text-sm font-black text-slate-900 group-hover:text-indigo-600 transition-colors line-clamp-2 leading-snug">
                      ${blog.title}
                    </h3>
                  </a>

                  <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed mt-1 font-medium">
                    ${blog.excerpt || "Read full analysis, tips, and study breakdown inside."}
                  </p>
                </div>
              </div>

              <div class="mt-4 pt-3 border-t border-slate-100">
                <a
                  href="${blogLink}"
                  class="w-full py-1.5 px-3 bg-slate-900 hover:bg-slate-800 text-white font-extrabold text-[11px] rounded-xl shadow-xs transition-all flex items-center justify-center gap-1 no-underline tracking-wide"
                >
                  <span>READ ARTICLE</span>
                  <i data-lucide="arrow-right" class="w-3 h-3"></i>
                </a>
              </div>
            </article>
          `;
          container.insertAdjacentHTML("beforeend", cardHTML);
        });

        if (window.lucide) lucide.createIcons();
      }

      function loadMore() {
        currentPage++;
        fetchBlogs(currentPage, selectedCategory);
      }

      document.addEventListener("DOMContentLoaded", () => {
        fetchBlogs(1, selectedCategory);
        if (window.lucide) lucide.createIcons();
      });
    </script>
  </body>
</html>
