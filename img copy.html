<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Generate Premium Stylish OG Banner</title>
  </head>
  <body
    style="
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #0f172a;
      margin: 0;
    "
  >
    <h3 style="color: #f8fafc; font-weight: 700">
      Generating Premium 1200x630 og-banner.png...
    </h3>
    <canvas
      id="bannerCanvas"
      width="1200"
      height="630"
      style="
        max-width: 90%;
        border-radius: 16px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      "
    ></canvas>
    <br />
    <button
      id="downloadBtn"
      style="
        padding: 14px 32px;
        background: linear-gradient(135deg, #4f46e5, #06b6d4);
        color: white;
        border: none;
        font-size: 16px;
        font-weight: 800;
        border-radius: 10px;
        cursor: pointer;
        box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
      "
    >
      Download Stylish og-banner.png
    </button>

    <script>
      const canvas = document.getElementById("bannerCanvas");
      const ctx = canvas.getContext("2d");

      function drawBanner() {
        // 1. Base Canvas
        ctx.fillStyle = "#f8fafc";
        ctx.fillRect(0, 0, 1200, 630);

        // 2. Dot Matrix Pattern
        ctx.fillStyle = "#cbd5e1";
        for (let x = 30; x < 1200; x += 30) {
          for (let y = 30; y < 630; y += 30) {
            ctx.beginPath();
            ctx.arc(x, y, 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        // 3. Vibrant Ambient Glows
        ctx.save();
        ctx.filter = "blur(90px)";
        ctx.fillStyle = "rgba(99, 102, 241, 0.22)";
        ctx.beginPath();
        ctx.arc(1050, 100, 260, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "rgba(6, 182, 212, 0.22)";
        ctx.beginPath();
        ctx.arc(150, 500, 240, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Outer Border
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 3;
        ctx.strokeRect(1, 1, 1198, 628);

        // 4. Logo Badge (Top Left)
        ctx.save();
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(15, 23, 42, 0.08)";
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 6;
        roundRect(ctx, 70, 45, 280, 64, 18);
        ctx.fill();
        ctx.restore();

        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 2;
        roundRect(ctx, 70, 45, 280, 64, 18);
        ctx.stroke();

        // Logo Icon
        const iconGrad = ctx.createLinearGradient(84, 55, 128, 99);
        iconGrad.addColorStop(0, "#4f46e5");
        iconGrad.addColorStop(1, "#06b6d4");
        ctx.fillStyle = iconGrad;
        roundRect(ctx, 84, 55, 44, 44, 12);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(98, 67, 16, 4);
        ctx.fillRect(98, 67, 4, 18);
        ctx.fillRect(98, 74, 12, 3);
        ctx.fillRect(98, 81, 16, 4);

        // Logo Typography
        ctx.font = "900 28px sans-serif";
        ctx.fillStyle = "#0f172a";
        ctx.fillText("Exam", 140, 86);
        ctx.fillStyle = "#0891b2";
        ctx.fillText("Mokk", 215, 86);

        // 5. Live Simulation Pill (Top Right)
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#e2e8f0";
        ctx.lineWidth = 2;
        roundRect(ctx, 840, 48, 290, 58, 29);
        ctx.fill();
        ctx.stroke();

        // Green Indicator Dot
        ctx.fillStyle = "#10b981";
        ctx.beginPath();
        ctx.arc(870, 77, 7, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = "800 16px sans-serif";
        ctx.fillStyle = "#0f172a";
        ctx.fillText("100% FREE CBT ENGINE", 890, 83);

        // 6. Main Headlines
        ctx.font = "900 54px sans-serif";
        ctx.fillStyle = "#0f172a";
        ctx.fillText("Free Online Mock Tests & Daily Quiz", 70, 185);

        const textGrad = ctx.createLinearGradient(70, 0, 950, 0);
        textGrad.addColorStop(0, "#4f46e5");
        textGrad.addColorStop(0.5, "#2563eb");
        textGrad.addColorStop(1, "#0891b2");
        ctx.fillStyle = textGrad;
        ctx.font = "bold 34px sans-serif";
        ctx.fillText("SSC, Banking, Railways & Govt Exams की तैयारी", 70, 240);

        // 7. Feature Badges
        const features = [
          { icon: "⚡", title: "Daily Live Quizzes" },
          { icon: "⏱️", title: "Real CBT Interface" },
          { icon: "📊", title: "All India Ranking" },
        ];

        let featX = 70;
        features.forEach((item) => {
          ctx.save();
          ctx.fillStyle = "#ffffff";
          ctx.shadowColor = "rgba(15, 23, 42, 0.06)";
          ctx.shadowBlur = 14;
          ctx.shadowOffsetY = 4;
          roundRect(ctx, featX, 295, 335, 78, 16);
          ctx.fill();
          ctx.restore();

          ctx.strokeStyle = "#e2e8f0";
          ctx.lineWidth = 1.5;
          roundRect(ctx, featX, 295, 335, 78, 16);
          ctx.stroke();

          ctx.font = "30px sans-serif";
          ctx.fillText(item.icon, featX + 20, 345);

          ctx.font = "800 20px sans-serif";
          ctx.fillStyle = "#0f172a";
          ctx.fillText(item.title, featX + 68, 343);

          featX += 360;
        });

        // 8. Exam Target Stream Pills
        ctx.font = "800 16px sans-serif";
        ctx.fillStyle = "#64748b";
        ctx.fillText("POPULAR EXAMS:", 70, 440);

        const streams = [
          "SSC CGL",
          "RRB NTPC",
          "SBI / IBPS PO",
          "Defence",
          "UPSC",
        ];
        let tagX = 70;
        streams.forEach((stream) => {
          ctx.font = "800 18px sans-serif";
          const tagW = ctx.measureText(stream).width + 36;

          ctx.fillStyle = "#ffffff";
          ctx.strokeStyle = "#cbd5e1";
          ctx.lineWidth = 1.5;
          roundRect(ctx, tagX, 465, tagW, 48, 14);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = "#1e293b";
          ctx.fillText(stream, tagX + 18, 496);
          tagX += tagW + 14;
        });

        // 9. CTA Button
        const btnGrad = ctx.createLinearGradient(70, 542, 450, 602);
        btnGrad.addColorStop(0, "#4f46e5");
        btnGrad.addColorStop(1, "#06b6d4");

        ctx.save();
        ctx.shadowColor = "rgba(79, 70, 229, 0.35)";
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 6;
        ctx.fillStyle = btnGrad;
        roundRect(ctx, 70, 542, 360, 60, 16);
        ctx.fill();
        ctx.restore();

        ctx.font = "900 22px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("Start Free Practice ➔", 120, 580);

        // 10. Made in India & Domain Watermark (Bottom Right)
        ctx.font = "800 20px sans-serif";
        ctx.fillStyle = "#475569";
        const footerText = "🇮🇳 Made in India • exammokk.cloud";
        const textWidth = ctx.measureText(footerText).width;
        ctx.fillText(footerText, 1130 - textWidth, 580);
      }

      function roundRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(
          x + width,
          y + height,
          x + width - radius,
          y + height,
        );
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      window.onload = () => {
        drawBanner();
        document.getElementById("downloadBtn").onclick = () => {
          const link = document.createElement("a");
          link.download = "og-banner.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        };
      };
    </script>
  </body>
</html>
