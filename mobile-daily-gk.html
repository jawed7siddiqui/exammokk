<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ExamMokk - Daily GK & Current Affairs</title>

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Master Scripts -->
    <script src="/js/AllSubject.js"></script>
    <script src="/js/nav.js?v=1.0.0"></script>

    <style>
      body {
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: #090d16;
        -webkit-tap-highlight-color: transparent;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeIn {
        animation: fadeIn 0.2s ease-out forwards;
      }
    </style>
  </head>
  <body class="flex justify-center items-center min-h-screen bg-slate-950">
    <!-- MOBILE CONTAINER (Phone Viewport: 430px Fit) -->
    <div
      class="w-full max-w-[430px] bg-slate-50 h-screen max-h-screen flex flex-col justify-start shadow-2xl relative overflow-hidden"
    >
      <!-- 1. FIXED TOP HEADER -->
      <header
        class="bg-white px-4 py-3 border-b border-slate-200/80 shrink-0 shadow-2xs z-10 flex items-center justify-between"
      >
        <!-- LEFT: BACK BUTTON & TITLE -->
        <div class="flex items-center gap-2.5">
          <button
            onclick="window.location.href = 'home.html'"
            class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 flex items-center justify-center transition-all cursor-pointer shrink-0"
            title="Back to Home"
          >
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
          </button>
          <div>
            <h1
              class="text-sm font-black text-slate-900 tracking-tight leading-tight flex items-center gap-1.5"
            >
              <span>Daily GK &amp; CA</span>
              <span class="text-xs">🌍</span>
            </h1>
            <p
              class="text-[10px] font-bold text-indigo-600 leading-none mt-0.5"
            >
              All India Speed Quizzes
            </p>
          </div>
        </div>

        <!-- RIGHT: LOGOUT BUTTON -->
        <button
          onclick="handleUserLogout()"
          class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 active:bg-rose-500 active:text-white text-rose-600 border border-rose-200/80 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5 shadow-2xs active:scale-95"
        >
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Logout</span>
        </button>
      </header>

      <!-- 2. MAIN SCROLLABLE CONTENT -->
      <main
        class="flex-1 px-4 pt-3 pb-24 space-y-3.5 overflow-y-auto no-scrollbar"
      >
        <!-- UNIFIED DAILY LIVE CHALLENGE BANNER -->
        <div
          class="bg-gradient-to-br from-indigo-800 via-indigo-900 to-slate-900 rounded-3xl p-4 text-white shadow-xl shadow-indigo-950/25 border border-white/10 relative overflow-hidden"
        >
          <div
            class="absolute -right-6 -top-6 w-24 h-24 bg-blue-400/20 rounded-full blur-2xl pointer-events-none"
          ></div>

          <!-- TOP SECTION -->
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 mb-1">
                <span
                  class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"
                ></span>
                <span
                  id="daily-challenge-subject"
                  class="text-[11px] font-black tracking-wider text-indigo-200 uppercase truncate"
                >
                  TODAY'S LIVE CHALLENGE
                </span>
              </div>

              <h3
                id="daily-challenge-title"
                class="text-sm font-extrabold text-white leading-snug truncate"
              >
                Daily GK &amp; Current Affairs Speed Drill
              </h3>
            </div>
          </div>

          <!-- MIDDLE ROW -->
          <div class="flex items-center justify-between gap-2 mt-2.5">
            <div
              class="flex items-center gap-2 text-xs font-bold text-indigo-100/90 flex-wrap"
            >
              <span
                class="inline-flex items-center gap-1 bg-white/10 px-2 py-0.5 rounded-md border border-white/10"
              >
                📝 <span id="daily-challenge-qs">15 Qs</span>
              </span>
              <span
                class="inline-flex items-center gap-1 bg-white/10 px-2 py-0.5 rounded-md border border-white/10"
              >
                ⏱️ <span id="daily-challenge-time">10 M</span>
              </span>
              <span
                id="daily-timer"
                class="text-amber-300 font-mono text-[10px]"
              >
                ⏳ Active Today
              </span>
            </div>

            <button
              id="btn-start-daily"
              onclick="startDailyLiveDrill()"
              class="px-3.5 py-1.5 bg-white hover:bg-indigo-50 active:scale-95 text-indigo-900 rounded-xl font-bold text-xs transition-all cursor-pointer flex items-center gap-1.5 shadow-md shrink-0"
            >
              <span>START</span>
              <i
                data-lucide="play"
                class="w-3.5 h-3.5 fill-current text-indigo-700"
              ></i>
            </button>
          </div>
        </div>

        <!-- DAILY GK CATEGORIES (TOPIC WISE ACCORDION) -->
        <div class="space-y-2.5">
          <div class="flex items-center justify-between px-1">
            <h3
              class="text-xs font-extrabold text-slate-800 uppercase tracking-wider"
            >
              GK Modules &amp; Topics
            </h3>
            <span
              id="total-categories-count"
              class="text-[11px] font-extrabold bg-indigo-50 text-indigo-600 px-2.5 py-0.5 rounded-full border border-indigo-100"
              >0 Topics</span
            >
          </div>

          <!-- ACCORDION CONTAINER -->
          <div id="gk-accordion-container" class="space-y-2.5"></div>
        </div>
      </main>

      <!-- 3. DYNAMIC BOTTOM NAVIGATION PLACEHOLDER -->
      <div id="bottom-nav-placeholder"></div>

      <!-- 4. CENTER DIALOG MODAL (Alert & Confirmation) -->
      <div
        id="app-modal"
        class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-xs p-4 hidden"
      >
        <div
          class="w-full max-w-[340px] bg-white rounded-3xl p-5 shadow-2xl border border-slate-100 text-center animate-fadeIn transform transition-all"
        >
          <!-- Icon -->
          <div
            id="modal-icon-container"
            class="w-12 h-12 rounded-2xl flex items-center justify-center mx-auto mb-3.5 text-xl bg-indigo-50 text-indigo-600"
          >
            <span id="modal-icon">ℹ️</span>
          </div>

          <!-- Title & Message -->
          <h4
            id="modal-title"
            class="text-sm font-extrabold text-slate-900 tracking-tight"
          >
            Notification
          </h4>
          <p
            id="modal-message"
            class="text-xs text-slate-500 font-medium mt-1.5 leading-relaxed"
          >
            Message details will appear here.
          </p>

          <!-- Buttons Container -->
          <div id="modal-actions" class="mt-5 flex items-center gap-2">
            <button
              id="modal-btn-cancel"
              class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 rounded-xl text-xs font-bold transition-all cursor-pointer hidden"
            >
              Cancel
            </button>
            <button
              id="modal-btn-confirm"
              class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-xl text-xs font-bold transition-all cursor-pointer shadow-xs shadow-indigo-600/20"
            >
              Okay
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
      const API_CATEGORY_URL =
        "https://exam-api.jawedsiddiqui.cloud/api/kidspaint/category";

      let openCategoryId = null;
      let dailyGkConfig = null;
      let allCategoryTests = [];
      let isCategoryLoading = false;
      let activeDailyTest = null;
      let modalConfirmCallback = null;

      // Custom Center Modal Engine
      function showModal({
        title = "Alert",
        message = "",
        icon = "ℹ️",
        type = "alert", // 'alert' or 'confirm'
        confirmText = "Okay",
        cancelText = "Cancel",
        confirmClass = "bg-indigo-600 hover:bg-indigo-700 text-white",
        onConfirm = null,
      }) {
        const modal = document.getElementById("app-modal");
        const titleEl = document.getElementById("modal-title");
        const msgEl = document.getElementById("modal-message");
        const iconEl = document.getElementById("modal-icon");
        const btnCancel = document.getElementById("modal-btn-cancel");
        const btnConfirm = document.getElementById("modal-btn-confirm");

        titleEl.textContent = title;
        msgEl.textContent = message;
        iconEl.textContent = icon;

        btnConfirm.textContent = confirmText;
        btnConfirm.className = `flex-1 py-2.5 rounded-xl text-xs font-bold transition-all cursor-pointer shadow-xs active:scale-95 ${confirmClass}`;

        if (type === "confirm") {
          btnCancel.textContent = cancelText;
          btnCancel.classList.remove("hidden");
        } else {
          btnCancel.classList.add("hidden");
        }

        modalConfirmCallback = onConfirm;
        modal.classList.remove("hidden");
      }

      function closeModal() {
        document.getElementById("app-modal").classList.add("hidden");
        modalConfirmCallback = null;
      }

      document
        .getElementById("modal-btn-cancel")
        .addEventListener("click", closeModal);

      document
        .getElementById("modal-btn-confirm")
        .addEventListener("click", () => {
          const cb = modalConfirmCallback;
          closeModal();
          if (typeof cb === "function") cb();
        });

      // Check if test is within 5 days old
      function isWithinFiveDays(dateString) {
        if (!dateString) return false;
        const testDate = new Date(dateString).getTime();
        const currentDate = Date.now();
        const diffInDays = (currentDate - testDate) / (1000 * 60 * 60 * 24);
        return diffInDays >= 0 && diffInDays <= 5;
      }

      function getDailyGkConfig() {
        if (window.ALL_SUBJECTS?.DAILY_GK?.length) {
          return Array.isArray(window.ALL_SUBJECTS.DAILY_GK)
            ? window.ALL_SUBJECTS.DAILY_GK[0]
            : window.ALL_SUBJECTS.DAILY_GK;
        }

        if (typeof DAILY_GK !== "undefined") {
          return Array.isArray(DAILY_GK) ? DAILY_GK[0] : DAILY_GK;
        }

        if (
          typeof subjectsBySegment !== "undefined" &&
          subjectsBySegment.DAILY_GK
        ) {
          return Array.isArray(subjectsBySegment.DAILY_GK)
            ? subjectsBySegment.DAILY_GK[0]
            : subjectsBySegment.DAILY_GK;
        }

        return null;
      }

      async function loadAllTestsForCategory() {
        isCategoryLoading = true;
        renderAccordion();

        try {
          const categorySlug = "DAILY_GK";
          const res = await fetch(
            `${API_CATEGORY_URL}/${encodeURIComponent(categorySlug)}`,
          );

          if (!res.ok) throw new Error(`HTTP Status ${res.status}`);

          const resData = await res.json();

          if (
            resData?.success &&
            Array.isArray(resData.data) &&
            resData.data.length > 0
          ) {
            allCategoryTests = resData.data.map((item) => ({
              id: item.test_id || item._id,
              title: item.title || item.test_name || "Daily GK Mock Test",
              desc:
                item.desc || item.category_title || "Official Practice Paper",
              subCategoryId:
                item.category_id || item.sub_category || "dgk_todays_affairs",
              ques: Number(item.total_questions) || 15,
              time: Number(item.total_time_mins) || 10,
              difficulty: item.difficulty_level || "Medium",
              is_daily: Boolean(item.is_daily_challenge),
              createdAt: item.createdAt || item.date || item.created_at || null,
            }));

            const daily =
              allCategoryTests.find((t) => t.is_daily) || allCategoryTests[0];
            if (daily) {
              activeDailyTest = daily;
              document.getElementById("daily-challenge-title").textContent =
                daily.title;
              document.getElementById("daily-challenge-qs").textContent =
                `${daily.ques} Qs`;
              document.getElementById("daily-challenge-time").textContent =
                `${daily.time} M`;
            }
          } else {
            allCategoryTests = [];
          }
        } catch (err) {
          console.warn("Failed to load category tests:", err);
          allCategoryTests = [];
        } finally {
          isCategoryLoading = false;
          renderAccordion();
        }
      }

      function renderAccordion() {
        const container = document.getElementById("gk-accordion-container");
        if (!container) return;

        const categories = dailyGkConfig?.categories || [];
        document.getElementById("total-categories-count").textContent =
          `${categories.length} Topics`;

        if (categories.length === 0) {
          container.innerHTML = `
            <div class="py-12 text-center bg-white rounded-2xl border border-slate-200/80 p-6">
              <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center mx-auto mb-3 text-xl">⏳</div>
              <h4 class="text-xs font-black text-slate-800 uppercase tracking-wider">Coming Soon</h4>
              <p class="text-[11px] text-slate-400 font-semibold mt-1">Daily GK & Current Affairs are being updated.</p>
            </div>
          `;
          if (typeof lucide !== "undefined") lucide.createIcons();
          return;
        }

        container.innerHTML = categories
          .map((cat) => {
            const isOpen = cat.id === openCategoryId;

            const topicTests = allCategoryTests.filter(
              (t) =>
                t.subCategoryId === cat.id ||
                t.title.toLowerCase().includes(cat.title.toLowerCase()),
            );

            return `
            <div class="bg-white border ${
              isOpen ? "border-indigo-500 shadow-xs" : "border-slate-200/90"
            } rounded-2xl overflow-hidden transition-all duration-200">
              
              <!-- TOPIC HEADER -->
              <div 
                onclick="toggleCategory('${cat.id}')"
                class="p-3.5 flex items-center justify-between cursor-pointer select-none bg-white hover:bg-slate-50 transition-all"
              >
                <div class="flex items-center gap-3 min-w-0">
                  <div class="w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 border border-indigo-100 flex items-center justify-center text-lg font-black shrink-0 shadow-xs">
                    ${cat.icon || "📚"}
                  </div>
                  <div class="min-w-0">
                    <h4 class="font-extrabold text-slate-800 text-xs truncate leading-snug">${cat.title}</h4>
                    <span class="text-[10px] font-semibold text-slate-400 block mt-0.5 truncate">
                      ${cat.description || "Daily Speed Quizzes"}
                    </span>
                  </div>
                </div>

                <div class="flex items-center gap-2 shrink-0">
                  <span class="text-[10px] font-extrabold px-2.5 py-0.5 rounded-full border bg-indigo-50 text-indigo-700 border-indigo-200">
                    ${isCategoryLoading ? "⏳ Loading" : topicTests.length > 0 ? `${topicTests.length} Tests` : "Explore"}
                  </span>
                  <div class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 transition-transform duration-200 ${
                    isOpen ? "rotate-180 bg-indigo-50 text-indigo-600" : ""
                  }">
                    <i data-lucide="chevron-down" class="w-4 h-4"></i>
                  </div>
                </div>
              </div>

              <!-- ACCORDION CONTENT -->
              ${
                isOpen
                  ? `
                <div class="bg-slate-50/80 p-3 border-t border-slate-100 space-y-2.5 animate-fadeIn">
                  ${
                    isCategoryLoading
                      ? `
                      <div class="py-5 text-center">
                        <div class="w-6 h-6 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-2"></div>
                        <p class="text-xs font-bold text-indigo-600">Loading tests from server...</p>
                      </div>
                    `
                      : topicTests.length > 0
                        ? topicTests
                            .map((test) => {
                              const isNew = isWithinFiveDays(test.createdAt);

                              return `
                            <div class="bg-white border border-slate-200/80 rounded-2xl p-3 flex items-center justify-between shadow-2xs hover:border-indigo-300 transition-all">
                              <div class="pr-2 min-w-0 flex-1">
                                <div class="flex items-center gap-1.5">
                                  <h5 class="font-extrabold text-slate-800 text-xs truncate">${test.title}</h5>
                                  ${
                                    isNew
                                      ? `<span class="px-1.5 py-0.2 bg-rose-500 text-white text-[9px] font-black tracking-wider rounded-md uppercase shrink-0 shadow-2xs">NEW</span>`
                                      : ""
                                  }
                                </div>
                                <p class="text-[11px] font-medium text-slate-400 truncate mt-0.5">${test.desc}</p>
                                <div class="flex items-center gap-1.5 mt-1.5">
                                  <span class="text-[10px] font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded">${test.ques} Qs</span>
                                  <span class="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded">⏱️ ${test.time}m</span>
                                  <span class="text-[10px] font-bold uppercase text-slate-400">${test.difficulty}</span>
                                </div>
                              </div>

                              <button 
                                onclick="startTest('${test.id}', '${cat.id}')"
                                class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-xl text-xs font-bold transition-all cursor-pointer shadow-xs shrink-0 flex items-center gap-1.5"
                              >
                                <span>Start</span>
                                <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                              </button>
                            </div>
                          `;
                            })
                            .join("")
                        : `
                        <div class="py-6 text-center bg-white rounded-xl border border-dashed border-slate-300 p-4">
                          <span class="text-lg">⏳</span>
                          <p class="text-xs font-bold text-slate-700 mt-1">Coming Soon</p>
                          <p class="text-[10px] text-slate-400 font-medium">New test papers are being uploaded for this topic.</p>
                        </div>
                      `
                  }
                </div>
              `
                  : ""
              }
            </div>
          `;
          })
          .join("");

        if (typeof lucide !== "undefined") lucide.createIcons();
      }

      function toggleCategory(categoryId) {
        if (openCategoryId === categoryId) {
          openCategoryId = null;
        } else {
          openCategoryId = categoryId;
        }
        renderAccordion();
      }

      function startTest(testId, categoryId) {
        window.location.href = `mobile_exam_runner.html?test_id=${encodeURIComponent(testId)}&category=${encodeURIComponent(categoryId)}&segment=DAILY_GK`;
      }

      function startDailyLiveDrill() {
        if (activeDailyTest) {
          startTest(activeDailyTest.id, activeDailyTest.subCategoryId);
        } else if (allCategoryTests.length > 0) {
          startTest(allCategoryTests[0].id, allCategoryTests[0].subCategoryId);
        } else {
          showModal({
            title: "Coming Soon",
            message:
              "Today's GK drill is currently being prepared. Please check back shortly!",
            icon: "⏳",
            type: "alert",
          });
        }
      }

      function handleUserLogout() {
        showModal({
          title: "Logout?",
          message: "Are you sure you want to log out?",
          icon: "🔒",
          type: "confirm",
          confirmText: "Logout",
          confirmClass: "bg-rose-600 hover:bg-rose-700 text-white",
          onConfirm: () => {
            localStorage.clear();
            window.location.href = "auth.html";
          },
        });
      }
      document.addEventListener("DOMContentLoaded", () => {
        dailyGkConfig = getDailyGkConfig();
        if (dailyGkConfig?.categories?.length > 0) {
          openCategoryId = dailyGkConfig.categories[0].id;
        }
        loadAllTestsForCategory();
      });
    </script>
  </body>
</html>
