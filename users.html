<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Panel - Registered Users Management</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />

    <!-- COMMON HEADER LOADER SCRIPT -->
    <script src="/js/admin-header.js"></script>

    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
      }
      code,
      pre,
      .font-mono {
        font-family: "JetBrains Mono", monospace;
      }
      .spinner {
        border: 2px solid rgba(79, 70, 229, 0.2);
        border-radius: 50%;
        border-top-color: #4f46e5;
        width: 16px;
        height: 16px;
        animation: spin 0.6s linear infinite;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      @keyframes slideInRight {
        from {
          transform: translateX(100%);
          opacity: 0;
        }
        to {
          transform: translateX(0);
          opacity: 1;
        }
      }
      .toast-enter {
        animation: slideInRight 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body
    class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased selection:bg-indigo-600 selection:text-white"
  >
    <!-- TOAST NOTIFICATION CONTAINER -->
    <div
      id="toast-container"
      class="fixed top-5 right-5 z-[9999] flex flex-col gap-2.5 max-w-sm w-full pointer-events-none"
    ></div>

    <!-- COMMON MOBILE HEADER -->
    <div id="common-mobile-header" class="contents"></div>

    <!-- MAIN FULL WIDTH CONTAINER -->
    <div
      class="flex-1 flex flex-col min-h-screen w-full bg-slate-50 overflow-x-hidden"
    >
      <!-- COMMON TOP HEADER SLOT -->
      <div id="common-top-header" class="contents"></div>

      <!-- CONTENT BODY -->
      <main class="p-4 md:p-8 flex-1 space-y-5 max-w-[1700px] mx-auto w-full">
        <!-- MANUAL SEARCH BAR ONLY (NO UNWANTED AUTO CALLS) -->
        <div
          class="bg-white border border-slate-200 p-4 rounded-2xl shadow-xs flex flex-col sm:flex-row gap-3 items-center justify-between"
        >
          <div class="flex items-center gap-2 w-full sm:w-auto flex-1 max-w-lg">
            <div class="relative w-full">
              <i
                data-lucide="search"
                class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"
              ></i>
              <input
                type="text"
                id="filter_search"
                placeholder="Search Student Name or Mobile No..."
                class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-semibold text-slate-800 placeholder-slate-400 outline-none focus:border-indigo-500 focus:bg-white"
              />
            </div>
            <button
              type="button"
              onclick="triggerSearch()"
              class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold transition-all shrink-0 cursor-pointer shadow-xs"
            >
              Search
            </button>
            <button
              type="button"
              onclick="resetSearch()"
              class="px-3 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-xs font-bold transition-all shrink-0 cursor-pointer"
            >
              Reset
            </button>
          </div>

          <button
            type="button"
            onclick="loadUsers(currentPage)"
            class="p-2 text-slate-500 hover:text-indigo-600 rounded-xl hover:bg-slate-100 transition-all cursor-pointer flex items-center gap-1.5 text-xs font-bold"
            title="Refresh List"
          >
            <i data-lucide="refresh-cw" class="w-4 h-4"></i>
            <span>Refresh</span>
          </button>
        </div>

        <!-- BULK DELETE ACTION BAR -->
        <div
          id="bulk-action-bar"
          class="bg-rose-50 border border-rose-200 p-3.5 rounded-2xl items-center justify-between shadow-xs"
          style="display: none"
        >
          <div class="flex items-center gap-2">
            <span class="p-1.5 bg-rose-100 rounded-lg text-rose-700">
              <i data-lucide="check-square" class="w-4 h-4"></i>
            </span>
            <span
              id="bulk-selected-count"
              class="text-xs font-bold text-rose-900"
            >
              0 users selected
            </span>
          </div>
          <button
            type="button"
            onclick="promptBulkDelete()"
            class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold text-xs cursor-pointer transition-all active:scale-95 flex items-center gap-1.5 shadow-sm"
          >
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            <span>Delete Selected</span>
          </button>
        </div>

        <!-- USERS TABLE CONTAINER -->
        <div
          class="bg-white rounded-2xl border border-slate-200 shadow-xs flex flex-col"
        >
          <div class="overflow-x-auto min-h-[400px]">
            <table class="w-full text-left text-xs">
              <thead
                class="bg-slate-50/80 text-slate-500 uppercase font-extrabold text-[10px] tracking-wider border-b border-slate-200"
              >
                <tr>
                  <th class="p-3.5 md:p-4 w-10 text-center">
                    <input
                      type="checkbox"
                      id="selectAllCheckbox"
                      onchange="toggleSelectAll(this)"
                      class="w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500 cursor-pointer"
                    />
                  </th>
                  <th class="p-3.5 md:p-4">Candidate Profile</th>
                  <th class="p-3.5 md:p-4">Mobile &amp; Roll No</th>
                  <th class="p-3.5 md:p-4">Platform &amp; Device</th>
                  <th class="p-3.5 md:p-4">Target / Exam</th>
                  <th class="p-3.5 md:p-4">Tests Given</th>
                  <th class="p-3.5 md:p-4">Status</th>
                  <th class="p-3.5 md:p-4">Registered On</th>
                  <th class="p-3.5 md:p-4 text-right">Action</th>
                </tr>
              </thead>
              <tbody
                id="usersTableBody"
                class="divide-y divide-slate-100 font-semibold text-slate-700"
              >
                <tr>
                  <td colspan="9" class="p-8 text-center text-slate-400">
                    Loading users...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- PAGINATION CONTROLS -->
          <div
            id="pagination-container"
            class="p-4 border-t border-slate-100 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs"
          >
            <span id="pagination-info" class="text-slate-500 font-semibold"
              >Showing 0 of 0</span
            >
            <div class="flex items-center gap-2">
              <button
                id="btn-prev"
                onclick="goToPage(currentPage - 1)"
                disabled
                class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed text-slate-700 font-bold rounded-xl transition-all cursor-pointer"
              >
                Previous
              </button>
              <span
                id="pagination-current"
                class="font-mono font-bold px-2 text-indigo-600"
                >Page 1</span
              >
              <button
                id="btn-next"
                onclick="goToPage(currentPage + 1)"
                disabled
                class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 disabled:opacity-40 disabled:cursor-not-allowed text-slate-700 font-bold rounded-xl transition-all cursor-pointer"
              >
                Next
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- ================= MODAL: SECURE DELETE CONFIRMATION ================= -->
    <div
      id="modal-delete-confirm"
      class="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4 z-[100] hidden overflow-y-auto"
    >
      <div
        class="bg-white rounded-3xl shadow-2xl w-full max-w-md border border-rose-100 overflow-hidden flex flex-col"
      >
        <div class="p-6 text-center space-y-4">
          <div
            class="w-12 h-12 bg-rose-100 text-rose-600 rounded-2xl flex items-center justify-center mx-auto"
          >
            <i data-lucide="alert-triangle" class="w-6 h-6"></i>
          </div>

          <div>
            <h3 class="text-base font-extrabold text-slate-800">
              Confirm Account Deletion
            </h3>
            <p id="delete-target-desc" class="text-xs text-slate-500 mt-1">
              You are about to delete user account(s).
            </p>
          </div>

          <div
            class="text-left bg-slate-50 p-3.5 rounded-2xl border border-slate-200"
          >
            <label class="block text-[11px] font-extrabold text-slate-700 mb-1">
              Enter Admin Deletion Passcode:
            </label>
            <input
              type="password"
              id="admin_delete_pass"
              placeholder="Enter PIN"
              class="w-full px-3 py-2 bg-white border border-slate-200 rounded-xl text-xs font-mono font-bold text-slate-800 outline-none focus:border-rose-500 transition-all"
            />
          </div>
        </div>

        <div
          class="border-t border-slate-100 px-6 py-3.5 bg-slate-50 flex items-center justify-end gap-2.5"
        >
          <button
            onclick="closeDeleteModal()"
            class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-xl cursor-pointer transition-all active:scale-95"
          >
            Cancel
          </button>
          <button
            id="btn-confirm-delete"
            onclick="executeDelete()"
            class="px-5 py-2 bg-rose-600 hover:bg-rose-700 active:scale-95 text-white text-xs font-bold rounded-xl cursor-pointer transition-all shadow-xs flex items-center gap-1.5"
          >
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            <span>Confirm Delete</span>
          </button>
        </div>
      </div>
    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
      const USERS_API_URL =
        "https://exam-api.jawedsiddiqui.cloud/api/kidspaint/users";
      const DELETE_API_URL =
        "https://exam-api.jawedsiddiqui.cloud/api/kidspaint/users/bulk-delete";

      let currentPage = 1;
      let totalPages = 1;
      let fetchedUsers = [];
      let activeSearch = "";
      let targetDeleteIds = [];

      function showToast(message, type = "success") {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        const icons = {
          success: `<i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600 shrink-0"></i>`,
          error: `<i data-lucide="alert-circle" class="w-5 h-5 text-rose-600 shrink-0"></i>`,
          info: `<i data-lucide="info" class="w-5 h-5 text-indigo-600 shrink-0"></i>`,
        };
        const bgStyles = {
          success:
            "bg-white border-emerald-200 text-slate-800 shadow-lg shadow-emerald-500/10",
          error:
            "bg-white border-rose-200 text-slate-800 shadow-lg shadow-rose-500/10",
          info: "bg-white border-indigo-200 text-slate-800 shadow-lg shadow-indigo-500/10",
        };

        toast.className = `toast-enter pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl border ${bgStyles[type] || bgStyles.info} text-xs font-bold`;
        toast.innerHTML = `
          ${icons[type] || icons.info}
          <div class="flex-1 leading-snug">${message}</div>
          <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-700 p-1 cursor-pointer">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        `;

        container.appendChild(toast);
        if (window.lucide) lucide.createIcons();

        setTimeout(() => {
          toast.style.transition = "all 0.3s ease";
          toast.style.opacity = "0";
          toast.style.transform = "translateX(100%)";
          setTimeout(() => toast.remove(), 300);
        }, 4000);
      }

      function formatDate(dateStr) {
        if (!dateStr) return "-";
        try {
          const d = new Date(dateStr);
          return d.toLocaleDateString("en-IN", {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
          });
        } catch (e) {
          return dateStr;
        }
      }

      function triggerSearch() {
        activeSearch = document.getElementById("filter_search").value.trim();
        loadUsers(1);
      }

      function resetSearch() {
        document.getElementById("filter_search").value = "";
        activeSearch = "";
        loadUsers(1);
      }

      async function loadUsers(page = 1) {
        const tbody = document.getElementById("usersTableBody");

        tbody.innerHTML = `
          <tr>
            <td colspan="9" class="p-8 text-center text-slate-400">
              <div class="inline-flex items-center gap-2">
                <div class="spinner"></div> Loading Users Data...
              </div>
            </td>
          </tr>
        `;

        try {
          const params = new URLSearchParams({
            page,
            limit: 25,
            ...(activeSearch && { search: activeSearch }),
          });

          const res = await fetch(`${USERS_API_URL}?${params.toString()}`);
          const json = await res.json();

          if (json.success && Array.isArray(json.data)) {
            fetchedUsers = json.data;
            currentPage = json.pagination?.currentPage || page;
            totalPages = json.pagination?.totalPages || 1;

            renderTable(fetchedUsers);
            renderPagination(json.pagination);
          } else {
            fetchedUsers = [];
            tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-slate-400">No users found.</td></tr>`;
            renderPagination({ totalUsers: 0, currentPage: 1, totalPages: 1 });
          }
        } catch (err) {
          tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-rose-500">Failed to fetch users from server.</td></tr>`;
          showToast("Network Error fetching users", "error");
        } finally {
          updateSelectedCount();
        }
      }

      function renderTable(list) {
        const tbody = document.getElementById("usersTableBody");
        if (!list || list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="9" class="p-8 text-center text-slate-400">No users found.</td></tr>`;
          return;
        }

        tbody.innerHTML = list
          .map((user, index) => {
            const studentName = user.studentName || "Candidate";
            const userAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(studentName)}&background=4f46e5&color=fff&size=64`;
            const userId = user._id || user.id;

            return `
              <tr class="hover:bg-slate-50/80 transition-colors border-b border-slate-100">
                <td class="p-3.5 md:p-4 text-center">
                  <input
                    type="checkbox"
                    value="${userId}"
                    class="user-row-checkbox w-4 h-4 rounded text-indigo-600 border-slate-300 focus:ring-indigo-500 cursor-pointer"
                    onchange="onRowCheckboxChange()"
                  />
                </td>
                <td class="p-3.5 md:p-4">
                  <div class="flex items-center gap-2.5">
                    <img src="${userAvatar}" alt="Avatar" class="w-8 h-8 rounded-full border border-slate-200 object-cover" />
                    <div>
                      <div class="font-bold text-slate-800 text-xs">${studentName}</div>
                      <div class="text-[10px] text-slate-400 font-semibold uppercase">${user.role || "aspirant"} • ${user.gender || "N/A"}</div>
                    </div>
                  </div>
                </td>
                <td class="p-3.5 md:p-4 font-mono">
                  <div class="font-bold text-slate-800">${user.mobileNumber || "-"}</div>
                  <span class="text-[10px] text-indigo-600 font-bold">${user.rollNo || "No Roll"}</span>
                </td>
                <td class="p-3.5 md:p-4 font-medium capitalize text-[11px] text-slate-600">
                  ${user.platform || "web"} (${user.deviceType || "device"})
                </td>
                <td class="p-3.5 md:p-4 text-xs font-semibold text-slate-700">
                  <div>${user.targetYear || "UPSC CSE"}</div>
                  <span class="text-[10px] text-slate-400 font-normal">${user.targetStage || "Prelims"} • ${user.medium || "English"}</span>
                </td>
                <td class="p-3.5 md:p-4 font-mono font-bold text-indigo-600 text-center">
                  ${user.test_given || 0}
                </td>
                <td class="p-3.5 md:p-4">
                  <span class="px-2 py-0.5 rounded-full text-[10px] font-extrabold ${user.status === "active" ? "bg-emerald-50 text-emerald-700 border border-emerald-200" : "bg-slate-100 text-slate-600"}">
                    ${user.status || "active"}
                  </span>
                </td>
                <td class="p-3.5 md:p-4 text-[11px] text-slate-500">${formatDate(user.createdAt)}</td>
                <td class="p-3.5 md:p-4 text-right">
                  <button
                    onclick="promptSingleDelete(${index})"
                    class="p-1.5 bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-600 rounded-xl font-bold text-[11px] cursor-pointer transition-all active:scale-95"
                    title="Delete User"
                  >
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </td>
              </tr>
            `;
          })
          .join("");

        if (window.lucide) lucide.createIcons();
      }

      function renderPagination(pagination) {
        const info = document.getElementById("pagination-info");
        const current = document.getElementById("pagination-current");
        const btnPrev = document.getElementById("btn-prev");
        const btnNext = document.getElementById("btn-next");

        if (!pagination) return;

        info.innerText = `Total Registered Users: ${pagination.totalUsers || 0}`;
        current.innerText = `Page ${pagination.currentPage || 1} of ${pagination.totalPages || 1}`;

        btnPrev.disabled =
          !pagination.hasPrevPage && pagination.currentPage <= 1;
        btnNext.disabled =
          !pagination.hasNextPage &&
          pagination.currentPage >= pagination.totalPages;
      }

      function goToPage(page) {
        if (page >= 1 && page <= totalPages) {
          loadUsers(page);
        }
      }

      /* ================= CHECKBOX HANDLERS ================= */
      function toggleSelectAll(masterCheckbox) {
        const isChecked = masterCheckbox.checked;
        const rowCheckboxes = document.querySelectorAll(".user-row-checkbox");
        rowCheckboxes.forEach((cb) => {
          cb.checked = isChecked;
        });
        updateSelectedCount();
      }

      function onRowCheckboxChange() {
        const masterCheckbox = document.getElementById("selectAllCheckbox");
        const rowCheckboxes = document.querySelectorAll(".user-row-checkbox");

        if (rowCheckboxes.length > 0) {
          const allChecked = Array.from(rowCheckboxes).every(
            (cb) => cb.checked,
          );
          if (masterCheckbox) masterCheckbox.checked = allChecked;
        }
        updateSelectedCount();
      }

      function getSelectedIds() {
        const rowCheckboxes = document.querySelectorAll(
          ".user-row-checkbox:checked",
        );
        return Array.from(rowCheckboxes).map((cb) => cb.value);
      }

      function updateSelectedCount() {
        const selectedIds = getSelectedIds();
        const bulkBar = document.getElementById("bulk-action-bar");
        const countText = document.getElementById("bulk-selected-count");
        const selectAllBox = document.getElementById("selectAllCheckbox");

        if (!fetchedUsers || fetchedUsers.length === 0) {
          if (selectAllBox) selectAllBox.checked = false;
        }

        if (selectedIds.length > 0) {
          bulkBar.style.display = "flex";
          countText.innerText = `${selectedIds.length} user account(s) selected`;
        } else {
          bulkBar.style.display = "none";
        }
      }

      /* ================= DELETE ACTIONS ================= */
      function promptSingleDelete(index) {
        const user = fetchedUsers[index];
        if (!user) return;

        const userId = user._id || user.id;
        const name = user.studentName || "User";

        targetDeleteIds = [userId];
        document.getElementById("delete-target-desc").innerText =
          `You are about to delete "${name}". This action cannot be undone.`;
        document.getElementById("admin_delete_pass").value = "";
        document
          .getElementById("modal-delete-confirm")
          .classList.remove("hidden");
        if (window.lucide) lucide.createIcons();
      }

      function promptBulkDelete() {
        const ids = getSelectedIds();
        if (ids.length === 0) {
          showToast("Please select at least one user to delete", "info");
          return;
        }
        targetDeleteIds = ids;
        document.getElementById("delete-target-desc").innerText =
          `You are about to delete ${targetDeleteIds.length} user account(s). This action cannot be undone.`;
        document.getElementById("admin_delete_pass").value = "";
        document
          .getElementById("modal-delete-confirm")
          .classList.remove("hidden");
        if (window.lucide) lucide.createIcons();
      }

      function closeDeleteModal() {
        document.getElementById("modal-delete-confirm").classList.add("hidden");
        targetDeleteIds = [];
      }

      async function executeDelete() {
        const passwordInput = document.getElementById("admin_delete_pass");
        const password = passwordInput.value.trim();
        const confirmBtn = document.getElementById("btn-confirm-delete");

        if (!password) {
          showToast("Please enter the admin passcode (914262)", "error");
          passwordInput.focus();
          return;
        }

        if (password !== "914262") {
          showToast("Incorrect passcode! Deletion blocked.", "error");
          passwordInput.focus();
          return;
        }

        confirmBtn.disabled = true;
        confirmBtn.innerHTML = `<div class="spinner"></div> <span>Deleting...</span>`;

        try {
          const response = await fetch(DELETE_API_URL, {
            method: "DELETE",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              password: password,
              userIds: targetDeleteIds,
            }),
          });

          const result = await response.json();

          if (result.success) {
            showToast(
              result.message || "User(s) deleted successfully!",
              "success",
            );
            closeDeleteModal();
            const selectAllBox = document.getElementById("selectAllCheckbox");
            if (selectAllBox) selectAllBox.checked = false;
            loadUsers(currentPage);
          } else {
            showToast(result.message || "Failed to delete users", "error");
          }
        } catch (err) {
          showToast("Server or network error during deletion", "error");
        } finally {
          confirmBtn.disabled = false;
          confirmBtn.innerHTML = `<i data-lucide="trash-2" class="w-3.5 h-3.5"></i> <span>Confirm Delete</span>`;
          if (window.lucide) lucide.createIcons();
        }
      }

      /* ================= INITIALIZATION ================= */
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof renderAdminHeader === "function") {
          renderAdminHeader("User Directory", "users");
        }

        // Search on 'Enter' key
        document
          .getElementById("filter_search")
          .addEventListener("keypress", (e) => {
            if (e.key === "Enter") {
              triggerSearch();
            }
          });

        loadUsers(1);
        if (window.lucide) lucide.createIcons();
      });
    </script>
  </body>
</html>
