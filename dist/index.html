      function formatItalic() {
        const o = activeCanvas.getActiveObject();
        if (!o) return;

        // --- 1. NEW: GROUP OR MULTIPLE SELECTION LOGIC ---
        if (o.type === "group" || o.type === "activeSelection") {
          o.forEachObject((obj) => {
            if (obj.type.includes("text")) {
              const isAlreadyItalic = obj.fontStyle === "italic";
              const newValue = isAlreadyItalic ? "normal" : "italic";

              obj.set("fontStyle", newValue);

              // Individual character styles clear karein taaki global style apply ho
              if (obj.styles) {
                for (let line in obj.styles) {
                  for (let char in obj.styles[line]) {
                    if (obj.styles[line][char]) {
                      delete obj.styles[line][char].fontStyle;
                    }
                  }
                }
              }
              if (obj.type === "textbox") {
                obj.set("width", obj.width + 10);
              }
            }
          });
        }

        // --- 2. EXISTING LOGIC (SINGLE TEXT) ---
        else if (o.type.includes("text")) {
          let isAlreadyItalic = false;

          if (o.isEditing) {
            const styles = o.getSelectionStyles();
            isAlreadyItalic = styles.some((s) => s.fontStyle === "italic");
          } else {
            isAlreadyItalic = o.fontStyle === "italic";
          }

          const newValue = isAlreadyItalic ? "normal" : "italic";

          if (o.isEditing && o.selectionStart !== o.selectionEnd) {
            o.setSelectionStyles({ fontStyle: newValue });
          } else {
            o.set("fontStyle", newValue);
            if (o.styles) {
              for (let line in o.styles) {
                for (let char in o.styles[line]) {
                  if (o.styles[line][char]) {
                    delete o.styles[line][char].fontStyle;
                  }
                }
              }
            }
          }

          if (o.type === "textbox") {
            o.set("width", o.width + 20);
          }

          o.set({
            lockMovementX: false,
            lockMovementY: false,
            hasControls: true,
            selectable: true,
            editable: true,
            evented: true,
            hoverCursor: "move",
            moveCursor: "move",
            dirty: true,
          });

          o.initDimensions();
        }

        // --- REFRESH & SYNC ---
        o.setCoords();
        activeCanvas.requestRenderAll();

        setTimeout(() => {
          o.setCoords();
          activeCanvas.renderAll();
          if (window.saveHistory) saveHistory();
        }, 50);
      }

      function addAdminTemplateToUser(encodedData) {
        const templateData = JSON.parse(decodeURIComponent(encodedData));

        if (!activeCanvas) {
          alert("Pehle wo page select karein jahan design apply karni hai!");
          return;
        }

        if (typeof closeModal === "function") closeModal();

        const hasContent = activeCanvas.getObjects().length > 0;

        if (hasContent) {
          const modal = document.getElementById("replace-confirm-modal");
          const card = document.getElementById("replace-modal-card");
          modal.classList.remove("hidden");
          modal.classList.add("flex");

          setTimeout(() => {
            if (card)
              (card.classList.remove("scale-95", "opacity-0"),
                card.classList.add("scale-100", "opacity-100"));
          }, 10);

          if (typeof lucide !== "undefined") lucide.createIcons();

          const confirmBtn = document.getElementById("confirm-replace-btn");
          confirmBtn.onclick = () => {
            closeReplaceModal();
            applyLogicNow(templateData);
          };
          return;
        }

        applyLogicNow(templateData);

        function applyLogicNow(data) {
          toggleLoader(true);
          const templatePage = data.pages ? data.pages[0] : data;

          const fabricData = {
            ...templatePage,
            objects: templatePage.objects || [],
          };

          // Textbox fix
          if (fabricData.objects) {
            fabricData.objects.forEach((obj) => {
              if (obj.type && obj.type.includes("text") && !obj.styles)
                obj.styles = {};
            });
          }

          activeCanvas.discardActiveObject();

          // --- FIX: Dimension check to prevent jumping ---
          const needsResize =
            PAGE_WIDTH !== templatePage.width ||
            PAGE_HEIGHT !== templatePage.height;

          // Sirf objects clear karein, canvas ko reset na karein turant
          activeCanvas.clear();

          activeCanvas.loadFromJSON(fabricData, () => {
            activeCanvas.getObjects().forEach((obj) => {
              applyGlobalObjectLogic(obj);
            });
            if (needsResize && templatePage.width && templatePage.height) {
              // Dimensions tabhi change karein jab zaroori ho
              activeCanvas.setDimensions({
                width: templatePage.width,
                height: templatePage.height,
              });

              PAGE_WIDTH = templatePage.width;
              PAGE_HEIGHT = templatePage.height;

              const holder = document.getElementById(
                `holder-${activeCanvas.pageId}`,
              );
              if (holder) {
                holder.style.width = templatePage.width + "px";
                holder.style.height = templatePage.height + "px";
              }
            }

            if (templatePage.background) {
              activeCanvas.setBackgroundColor(
                templatePage.background,
                activeCanvas.renderAll.bind(activeCanvas),
              );
            }

            const currentRecord = canvasInstances.find(
              (c) => c.instance === activeCanvas,
            );
            if (currentRecord) {
              const state = JSON.stringify(
                activeCanvas.toJSON(
                  typeof FABRIC_JSON_FIELDS !== "undefined"
                    ? FABRIC_JSON_FIELDS
                    : [],
                ),
              );
              currentRecord.history = [state];
              currentRecord.historyStep = 0;
              currentRecord.width = templatePage.width;
              currentRecord.height = templatePage.height;
            }

            activeCanvas.renderAll();

            // --- FIX: RequestAnimationFrame for smoother UI transition ---
            requestAnimationFrame(() => {
              if (typeof updateLiveStorage === "function")
                updateLiveStorage(true);
              toggleLoader(false);

              // Sirf tab fitToScreen karein jab resize hua ho, warna glitch dikhega
              if (needsResize && typeof fitToScreen === "function") {
                fitToScreen();
              }

              if (typeof closeModal === "function") closeModal();
              console.log("Template applied without glitch!");
            });
          });
        }
      }
      function applyTemplate(idx) {
        console.log("idx:", idx);
        toggleLoader(true);

        // 🔥 FIX 1: Use the dynamic STORAGE_KEY instead of hardcoded string
        const key =
          typeof STORAGE_KEY !== "undefined"
            ? STORAGE_KEY
            : "dx_templates_default";
        const saved = JSON.parse(localStorage.getItem(key) || "[]");
        const design = saved[idx];

        // 1. Validation
        if (!design || !design.pages || design.pages.length === 0) {
          console.error(`Template data not found in ${key}`);
          return;
        }

        // Check if a page is selected
        if (!activeCanvas) {
          alert("Pehle wo page select karein jahan design apply karni hai!");
          return;
        }

        // 2. Saved data se page content uthayein
        const templatePage = design.pages[0];
        const jsonData = templatePage.json || templatePage;

        // 3. Active Canvas Cleanup (Before Injecting)
        activeCanvas.discardActiveObject();
        activeCanvas.clear();

        // 4. Load the Template into the Active Canvas
        activeCanvas.loadFromJSON(jsonData, () => {
          // --- Dimension Sync ---
          if (templatePage.width && templatePage.height) {
            activeCanvas.setDimensions({
              width: templatePage.width,
              height: templatePage.height,
            });

            // 🔥 FIX 2: Ensure the holder ID is correctly targeted
            // Make sure activeCanvas.pageId correctly matches your holder's ID suffix
            const holder = document.getElementById(
              `holder-${activeCanvas.pageId}`,
            );
            if (holder) {
              holder.style.width = templatePage.width + "px";
              holder.style.height = templatePage.height + "px";
            }
          }

          // --- History Sync (Crucial for Undo/Redo) ---
          const currentRecord = canvasInstances.find(
            (c) => c.instance === activeCanvas,
          );
          if (currentRecord) {
            const state = JSON.stringify(
              activeCanvas.toJSON(FABRIC_JSON_FIELDS),
            );
            currentRecord.history = [state]; // Reset history to this new template state
            currentRecord.historyStep = 0;

            // Re-trigger border/active state logic
            setActivePage(activeCanvas, currentRecord.id);
          }

          activeCanvas.renderAll();
          toggleLoader(false);

          // UI Cleanup
          if (typeof fitToScreen === "function") fitToScreen();
          if (typeof closeModal === "function") closeModal();

          console.log(
            `Template applied from ${key} to page ${activeCanvas.pageId}`,
          );
        });
      }

      function setBGImage(url) {
        toggleLoader(true);
        fabric.Image.fromURL(
          url,
          (img) => {
            if (!img) return;

            const oldBgs = activeCanvas
              .getObjects()
              .filter((obj) => obj.role === "background");
            oldBgs.forEach((bg) => activeCanvas.remove(bg));

            const scaleX = PAGE_WIDTH / img.width;
            const scaleY = PAGE_HEIGHT / img.height;

            // 🔥 THE FIX: Math.max se image "Fit" hoti he.
            // Hum +0.05 (5%) extra add kar rahe hain taaki move karne ke liye jagah mile.
            let finalScale = Math.max(scaleX, scaleY) + 0.05;

            img.set({
              role: "background",
              left: PAGE_WIDTH / 2,
              top: PAGE_HEIGHT / 2,
              originX: "center",
              originY: "center",
              // centeredScaling: true,
              selectable: false,
              hasControls: false,
              evented: true,
              lockMovementX: false,
              lockMovementY: false,
              scaleX: finalScale,
              scaleY: finalScale,
              hoverCursor: "default",
            });

            // Is bar log mein 'canMoveHorizontal' true aana chahiye
            console.log("✅ BG Set Done:", {
              imgActualW: img.getScaledWidth(),
              canvasW: PAGE_WIDTH,
              canMoveHorizontal: img.getScaledWidth() > PAGE_WIDTH,
            });

            img.setControlsVisibility({
              mt: false,
              mb: false,
              ml: false,
              mr: false,
              mtr: false,
              tl: true,
              tr: true,
              bl: true,
              br: true,
            });

            activeCanvas.add(img);
            img.sendToBack();
            img.moveTo(0);
            activeCanvas.renderAll();
            toggleLoader(false);
            setTimeout(() => saveHistory(), 50);
            closeModal();
          },
          { crossOrigin: "anonymous" },
        );
      }

      function applyGlobalObjectLogic(obj) {
        if (!obj) return;

        // --- FORCE SHOW CONTROLS ---
        obj.set({
          hasControls: true, // Hamesha controls dikhao
          hasBorders: true, // Border dikhao
          selectable: true,
          evented: true,
          lockScalingFlip: true, // Scaling flip hone se bachane ke liye
          // --- SHARED UI SETTINGS ---
          editingBorderColor: "#6366f1",
          padding: obj.isType("textbox") ? 5 : 0,
          hasRotatingPoint: false,
          transparentCorners: false,
          cornerColor: "#ffffff",
          cornerStrokeColor: "#6366f1",
          cornerSize: 8,
          cornerStyle: "circle",
          borderDashArray: null, // Ensure dashed borders nahi hain
          borderColor: "#6366f1",
        });

        // --- TEXT BOX SPECIFIC ---
        if (obj.isType("textbox") || obj.isType("i-text")) {
          if (typeof textRotationControl !== "undefined")
            obj.controls.mtr = textRotationControl;

          obj.setControlsVisibility({
            mt: false,
            mb: false,
            ml: true,
            mr: true,
            tl: true,
            tr: true,
            bl: true,
            br: true,
            mtr: true,
          });
        }
        // --- LINE SPECIFIC ---
        else if (obj.isType("line")) {
          obj.setControlsVisibility({
            mt: false,
            mb: false,
            ml: true,
            mr: true,
            tl: false,
            tr: false,
            bl: false,
            br: false,
            mtr: true,
          });
        }
        // --- ALL OTHERS (Rect, Circle, Image) ---
        else {
          if (typeof imageRotationControl !== "undefined") {
            obj.controls.mtr = imageRotationControl;
          }
          obj.setControlsVisibility({
            mt: true,
            mb: true,
            ml: true,
            mr: true,
            tl: true,
            tr: true,
            bl: true,
            br: true,
            mtr: true,
          });
        }

        obj.setCoords(); // Controls ki position refresh karein
      }
      function addShape(type) {
        if (!activeCanvas || !SHAPE_LIBRARY[type]) return;
        toggleLoader(true);
        closeModal();

        const config = SHAPE_LIBRARY[type];
        const shapeSize = Math.round(PAGE_WIDTH * 0.25);
        let shape;

        const baseAttr = {
          role: "shape",
          left: PAGE_WIDTH / 2,
          top: PAGE_HEIGHT / 2,
          fill: config.color,
          originX: "center",
          originY: "center",
          strokeUniform: true,
          noScaleCache: false,
          objectCaching: false,
        };

        // --- Object Creation Logic ---
        if (config.isLine) {
          const lineWidth = PAGE_WIDTH * 0.4;
          shape = new fabric.Line([0, 0, lineWidth, 0], {
            ...baseAttr,
            stroke: config.color,
            strokeWidth: 4,
            strokeDashArray: config.dash,
            strokeLineCap: "round",
          });
        } else if (config.path) {
          shape = new fabric.Path(config.path, {
            ...baseAttr,
            scaleX: shapeSize / 24,
            scaleY: shapeSize / 24,
          });
        } else if (["square", "rect_soft", "rect_round"].includes(type)) {
          const rxValue =
            type === "rect_soft" ? 20 : type === "rect_round" ? 60 : 0;
          shape = new fabric.Rect({
            ...baseAttr,
            width: shapeSize,
            height: shapeSize,
            rx: rxValue,
            ry: rxValue,
          });
        } else if (type === "circle") {
          shape = new fabric.Circle({ ...baseAttr, radius: shapeSize / 2 });
        } else if (type === "triangle") {
          shape = new fabric.Triangle({
            ...baseAttr,
            width: shapeSize,
            height: shapeSize,
          });
        }

        if (shape) {
          // Apply Global Logic (Controls & Events)
          applyGlobalObjectLogic(shape);

          activeCanvas.add(shape);
          activeCanvas.setActiveObject(shape);

          if (typeof openFullTools === "function") openFullTools(shape);

          activeCanvas.renderAll();
          setTimeout(() => saveHistory(), 50);
          shape.setCoords();
        }
        toggleLoader(false);
      }

      function addTable(rows = 3, cols = 3) {
        if (!activeCanvas) return;

        const cellWidth = 120;
        const cellHeight = 40;
        const tableObjects = [];

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            // 1. Cell Background
            const rect = new fabric.Rect({
              width: cellWidth,
              height: cellHeight,
              left: c * cellWidth,
              top: r * cellHeight,
              fill: "#ffffff",
              stroke: "#d1d5db",
              strokeWidth: 1,
              selectable: false, // Group ke andar individual selection off
            });

            // 2. Cell Text
            const text = new fabric.Textbox("", {
              width: cellWidth - 10,
              fontSize: 14,
              left: c * cellWidth + 5,
              top: r * cellHeight + 10,
              textAlign: "center",
              selectable: true,
              role: "table-cell",
            });

            tableObjects.push(rect, text);
          }
        }

        const tableGroup = new fabric.Group(tableObjects, {
          left: PAGE_WIDTH / 2,
          top: PAGE_HEIGHT / 2,
          originX: "center",
          originY: "center",
          role: "table",
          subTargetCheck: true, // Important: Taaki group ke andar text edit ho sake
        });

        applyGlobalObjectLogic(tableGroup);
        activeCanvas.add(tableGroup).setActiveObject(tableGroup).renderAll();
        saveHistory();
        closeModal();
      }

      function addDraw(toolId, color, size) {
        if (!activeCanvas) return;

        // 1. Drawing Mode ON karein
        activeCanvas.isDrawingMode = true;

        // Brush logic: Type ke hisaab se brush select karein
        let brush;
        if (toolId === "spray") {
          brush = new fabric.SprayBrush(activeCanvas);
          brush.density = 25;
        } else if (toolId === "circle") {
          brush = new fabric.CircleBrush(activeCanvas);
        } else {
          brush = new fabric.PencilBrush(activeCanvas);
        }

        // --- GLOW / NEON / NORMAL SETUP ---
        if (toolId === "glow") {
          // Glow ke liye soft transparency aur bada size best hai
          brush.color = color + "44"; // 25-30% opacity
          brush.width = parseInt(size, 10) * 1.5; // Glow hamesha thoda broad hota hai
          brush.shadow = new fabric.Shadow({
            color: color,
            blur: 35, // Bahut soft glow ke liye high blur
            offsetX: 0,
            offsetY: 0,
          });
        } else if (toolId === "neon") {
          brush.color = color;
          brush.width = parseInt(size, 10);
          brush.shadow = new fabric.Shadow({
            color: color,
            blur: 15,
            offsetX: 0,
            offsetY: 0,
          });
        } else {
          brush.color = toolId === "highlighter" ? color + "66" : color;
          brush.width = parseInt(size, 10);
        }

        activeCanvas.freeDrawingBrush = brush;
        activeCanvas.defaultCursor = "crosshair";

        // Purane listeners saaf karein
        activeCanvas.off("path:created");

        // 2. Continuous Drawing Logic
        activeCanvas.on("path:created", (e) => {
          const path = e.path;

          let pathSettings = {
            role: "draw",
            strokeUniform: true,
            selectable: true,
            strokeLineCap: "round",
            strokeLineJoin: "round",
          };

          // --- SPECIAL EFFECTS APPLIED TO PATH ---
          if (toolId === "dashed") {
            pathSettings.strokeDashArray = [10, 10];
          }

          path.set(pathSettings);

          // --- GLOW LAYER LOGIC ---

      function renderCanvaRotationIcon(
        ctx,
        left,
        top,
        styleOverride,
        fabricObject,
      ) {
        ctx.save();
        ctx.translate(left, top);

        // 1. White Circle Background with Shadow
        ctx.beginPath();
        ctx.arc(0, 0, 14, 0, 2 * Math.PI, false);
        ctx.fillStyle = "#ffffff";
        ctx.shadowColor = "rgba(0,0,0,0.2)";
        ctx.shadowBlur = 8;
        ctx.fill();

        // 2. Grey Border
        ctx.lineWidth = 1;
        ctx.strokeStyle = "#e2e8f0";
        ctx.stroke();

        // 3. Drawing Canva-style "Rotate Arrows"
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = "#0e1217";
        ctx.lineCap = "round";

        // Arrows Paths
        ctx.arc(0, 0, 6, 0.2 * Math.PI, 0.8 * Math.PI);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, 6, 1.2 * Math.PI, 1.8 * Math.PI);
        ctx.stroke();

        // Arrow heads
        ctx.fillStyle = "#0e1217";
        ctx.beginPath();
        ctx.moveTo(6, 2);
        ctx.lineTo(9, 5);
        ctx.lineTo(4, 6);
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(-6, -2);
        ctx.lineTo(-9, -5);
        ctx.lineTo(-4, -6);
        ctx.fill();

        ctx.restore();
      }

      function formatUnderline() {
        const o = activeCanvas.getActiveObject();
        if (!o) return;

        // --- 1. GROUP YA MULTIPLE SELECTION LOGIC ---
        if (o.type === "group" || o.type === "activeSelection") {
          o.forEachObject((obj) => {
            if (obj.type.includes("text")) {
              const newState = !obj.underline;
              obj.set("underline", newState);

              // Sticky individual styles ko clear karein
              if (obj.styles) {
                for (let line in obj.styles) {
                  for (let char in obj.styles[line]) {
                    if (
                      typeof obj.styles[line][char].underline !== "undefined"
                    ) {
                      delete obj.styles[line][char].underline;
                    }
                  }
                }
              }
            }
          });
        }

        // --- 2. SINGLE TEXT (EDIT MODE) ---
        else if (
          o.type.includes("text") &&
          o.isEditing &&
          o.selectionStart !== o.selectionEnd
        ) {
          const styles = o.getSelectionStyles();
          const isAlreadyUnderlined =
            styles.some((s) => s.underline === true) || o.underline === true;

          o.setSelectionStyles({
            underline: !isAlreadyUnderlined,
          });
        }

        // --- 3. SINGLE TEXT (NORMAL MODE) ---
        else if (o.type.includes("text")) {
          const newState = !o.underline;
          o.set("underline", newState);

          if (o.styles) {

              for (let char in o.styles[line]) {

      function moveFocus(direction, pageId) {
        const pagesList = document.getElementById("pages-list");
        const container = document.getElementById("editor-container");
        const holder = document.querySelector(`#holder-${pageId}`);

        if (!holder) return;

        const wrapper = holder.closest(".page-wrapper");
        const index = canvasInstances.findIndex((c) => c.id === pageId);

        // Target identify karein (Up/Down)
        let target =
          direction === "up"
            ? wrapper.previousElementSibling
            : wrapper.nextElementSibling;

        // Boundary checks
        if (!target || target.tagName === "BUTTON") return;

        // Animation ke liye purani position record karein
        const oldPos = wrapper.getBoundingClientRect().top;

        // --- 1. DOM SWAP & ARRAY REORDER ---
        if (direction === "up") {
          pagesList.insertBefore(wrapper, target);
          // Array mein elements ko swap karein
          [canvasInstances[index], canvasInstances[index - 1]] = [
            canvasInstances[index - 1],
            canvasInstances[index],
          ];
        } else {
          // insertAfter helper nahi hota, isliye logic: target ke baad insert karna
          pagesList.insertBefore(target, wrapper);
          // Array mein elements ko swap karein
          [canvasInstances[index], canvasInstances[index + 1]] = [
            canvasInstances[index + 1],
            canvasInstances[index],
          ];
        }

        // --- 2. STORAGE SYNC (The Fix) ---
        // Hum direct updateLiveStorage call karenge kyunki array order badal chuka hai
        if (typeof updateLiveStorage === "function") {
          updateLiveStorage();
          console.log("Order saved to Storage for: " + STORAGE_KEY);
        }

        // --- 3. UI STATE & LABELS ---
        const movedRecord = canvasInstances.find((c) => c.id === pageId);
        if (movedRecord) {
          setActivePage(movedRecord.instance, pageId);
        }

        if (typeof updatePageLabels === "function") {
          updatePageLabels();
        }

        // --- 4. ANIMATION & SMART SCROLL ---
        const newPos = wrapper.getBoundingClientRect().top;
        const ctx = document.getElementById("ctx-tools");
        if (ctx) ctx.classList.add("ctx-force-hide");

        // Smooth Flip Animation
        wrapper.animate(
          [
            { transform: `translateY(${oldPos - newPos}px)` },
            { transform: "translateY(0)" },
          ],
          { duration: 250, easing: "ease-out" },
        );

        if (container) {
          setTimeout(() => {
            const buffer = direction === "up" ? 80 : 40;
            const offset =
              wrapper.offsetTop -
              container.clientHeight / 2 +
              wrapper.clientHeight / 2 -
              buffer;
            container.scrollTo({
              top: Math.max(0, offset),
              behavior: "smooth",
            });
          }, 50);
        }
      }

        const allObjects = activeCanvas.getObjects();

        const bg = allObjects.find((o) => o.role === "background");
        const bgIndex = allObjects.indexOf(bg);
        const currentIndex = allObjects.indexOf(obj);

        switch (action) {
          case "front":
            obj.bringToFront();
            break;
          case "forward":
            obj.bringForward();
            break;
          case "backward":
            // Agar peeche wala object background he (Index 0), toh wahi ruk jao
            if (bg && currentIndex <= bgIndex + 1) {
              console.log("Already above background");
            } else {
              obj.sendBackwards();

            break;
          case "back":
            if (bg) {
              // Background ke theek upar (Index 1 par) bhej do
              obj.moveTo(bgIndex + 1);

      function executePageDelete() {
        if (!pageToDeleteData) return;

        const { btn, id } = pageToDeleteData;
        const targetPageId = Number(id);

        // 🔥 FIX 2: Dynamic STORAGE_KEY use karein execution ke waqt bhi
        const key =
          typeof STORAGE_KEY !== "undefined"
            ? STORAGE_KEY
            : "dx_templates_default";
        let storedData = localStorage.getItem(key);
        if (!storedData) return;

        let allTemplates = JSON.parse(storedData);

        if (allTemplates.length > 0) {
          const currentDesign = allTemplates[0];

          // Page Level ID find karein
          const pageIndex = currentDesign.pages.findIndex(
            (p) => Number(p.id) === targetPageId,
          );

          if (pageIndex > -1) {
            // 1. Storage se remove karein
            currentDesign.pages.splice(pageIndex, 1);
            localStorage.setItem(key, JSON.stringify(allTemplates));

            // 2. UI Cleanup
            if (btn) {
              const wrapper = btn.closest(".page-wrapper");
              if (wrapper) wrapper.remove();
            }

            // 3. Memory Cleanup (Fabric instances)
            if (typeof canvasInstances !== "undefined") {
              // Instance ko dispose karna zaroori hai memory leak bachane ke liye
              const instanceToDispose = canvasInstances.find(
                (c) => Number(c.id) === targetPageId,
              );
              if (instanceToDispose && instanceToDispose.instance) {
                instanceToDispose.instance.dispose();
              }

              canvasInstances = canvasInstances.filter(
                (c) => Number(c.id) !== targetPageId,
              );

              // Auto-Focus: Agar delete hone wala active tha, toh pehle canvas ko active karein
              if (canvasInstances.length > 0) {
                const newActive = canvasInstances[0];
                activeCanvas = newActive.instance;
                if (typeof setActivePage === "function") {
                  setActivePage(activeCanvas, newActive.id);
                }
              }
            }

            console.log(
              `Page ${targetPageId} permanently removed from ${key}.`,
            );
          } else {
            console.warn("Page not found in storage, performing live sync.");
            if (typeof updateLiveStorage === "function") updateLiveStorage();
          }
        }

        closeDeleteModal();
        if (typeof fitToScreen === "function") fitToScreen(); // Re-align pages
      }

          o.type.includes("text") &&
          o.isEditing &&
          o.selectionStart !== o.selectionEnd
        ) {
          const styles = o.getSelectionStyles();
          const isAlreadyBold = styles.every((s) => s.fontWeight === "bold");

          o.setSelectionStyles({
            fontWeight: isAlreadyBold ? "normal" : "bold",
          });

          // Bold hone par width thodi badhayein taaki text wrap na ho
          if (!isAlreadyBold) {
            o.set("width", o.width + 15);
          }
        }

        // --- 3. SINGLE TEXT OBJECT (NORMAL MODE) ---
        else if (o.type.includes("text")) {
          const isAlreadyBold = o.fontWeight === "bold";
          o.set({
            fontWeight: isAlreadyBold ? "normal" : "bold",
            width: o.width + (isAlreadyBold ? -20 : 20), // Width adjustment
          });

          if (o.styles) o.removeStyle("fontWeight");
        }

        // Common Updates
        o.setCoords();
        activeCanvas.requestRenderAll();
        setTimeout(() => saveHistory(), 50);

      // 1. Memory mein current state rakhein
      let cachedPages = [];

      function updateLiveStorage() {
        if (
          window.isInitialLoading ||
          window.isHydrating ||
          canvasInstances.length === 0
        )
          return;

        // Har baar naya map chalane ke bajaye, sirf active page ka data update karein
        const activePage = canvasInstances.find(
          (c) => c.instance === activeCanvas,
        );

        // Sirf active page ka fresh JSON lein
        const updatedPageData = activePage.instance.toJSON(FABRIC_JSON_FIELDS);
        updatedPageData.id = activePage.id;
        updatedPageData.width = PAGE_WIDTH;
        updatedPageData.height = PAGE_HEIGHT;

        // Baaki pages ka purana data hi use karein (Fastest Way)
        const currentData = canvasInstances.map((c) => {
          if (c.instance === activeCanvas) return updatedPageData;
          // Yahan aap caching logic laga sakte hain (e.g. c.instance.lastJson)
          return c.instance.toJSON(FABRIC_JSON_FIELDS);
        });

        const key =
          typeof STORAGE_KEY !== "undefined"
            ? STORAGE_KEY
            : "dx_templates_default";
        let saved = JSON.parse(localStorage.getItem(key) || "[]");

        const currentDesign = {
          preview: "", // Still empty for speed
          pages: currentData,
          layoutW: PAGE_WIDTH,
          layoutH: PAGE_HEIGHT,
          lastModified: Date.now(),
          namespace: key,
        };

        if (saved.length > 0) saved[0] = currentDesign;
        else saved.unshift(currentDesign);

        // 🔥 Web Workers ya requestIdleCallback use karein takki UI freeze na ho
        window.requestIdleCallback(() => {
          localStorage.setItem(key, JSON.stringify(saved.slice(0, 10)));
        });
      } // --- LOCK LOGIC ---
      function toggleLock() {
        const obj = activeCanvas.getActiveObject();
        if (!obj) return;

        const isLocked = !obj.lockMovementX;

        obj.set({
          lockMovementX: isLocked,
          lockMovementY: isLocked,
          lockRotation: isLocked,
          lockScalingX: isLocked,
          lockScalingY: isLocked,
          editable: !isLocked, // Text edit lock
          hasControls: !isLocked,
        });

        // Update Icon
        const lockBtn = document.getElementById("btn-lock");
        lockBtn.innerHTML = isLocked
          ? '<i data-lucide="lock" class="w-4 h-4 text-red-500"></i>'
          : '<i data-lucide="unlock" class="w-4 h-4 text-gray-700"></i>';

        lucide.createIcons(); // Refresh icons
        activeCanvas.renderAll();
        saveHistory(activeCanvas);
      }

      function toggleGroup() {
        const activeObj = activeCanvas.getActiveObject();
        if (!activeObj) return;

        const groupBtn = document.getElementById("btn-group");

        // 1. GROUP BANANA (Selection -> Group)
        if (activeObj.type === "activeSelection") {
          // toGroup() existing objects ko hi group mein convert karta hai (No clones)
          const newGroup = activeObj.toGroup();

          if (typeof applyGlobalObjectLogic === "function") {
            applyGlobalObjectLogic(newGroup);
          }

          newGroup.set({
            // IMPORTANT: False rakhein taaki pehle group select ho,
            // hamari custom mouse:down logic handles the rest.
            subTargetCheck: false,
            interactive: true,
            objectCaching: false,
          });

          if (groupBtn) groupBtn.innerText = "UNGROUP";

          // UI update logic
          if (typeof openFullTools === "function") openFullTools(newGroup);
        }

        // 2. UNGROUP KARNA (Group -> Selection)
        else if (activeObj.type === "group") {
          const items = activeObj.getObjects();
          items.forEach((obj) => {
            obj._controlsFixed = false; // Controls reset
          });

          // Group ko wapas selection mein badlein
          activeObj.toActiveSelection();

          // Grouping button reset
          if (groupBtn) groupBtn.innerText = "GROUP";

          if (typeof openFullTools === "function") openFullTools(null);
        }

        activeCanvas.requestRenderAll();

        // History save
        setTimeout(() => {
          if (typeof saveHistory === "function") saveHistory();
        }, 50);
      }

      function updateContextUI() {
        const obj = activeCanvas.getActiveObject();
        if (!obj) return;

        // Lock button update
        const lockBtn = document.getElementById("btn-lock");
        if (lockBtn) {
          const isLocked = obj.lockMovementX;
          lockBtn.innerHTML = isLocked
            ? '<i data-lucide="lock" class="w-4 h-4 text-red-500"></i>'
            : '<i data-lucide="unlock" class="w-4 h-4 text-gray-700"></i>';
        }

        // Group button update
        const groupBtn = document.getElementById("btn-group");
        if (groupBtn) {
          // --- 🛡️ LOADED GROUP FIX ---
          if (obj.type === "group") {
            groupBtn.innerText = "UNGROUP"; // Saved group pe click karte hi UNGROUP dikhao
            groupBtn.style.display = "block";
          } else if (obj.type === "activeSelection") {
            groupBtn.innerText = "GROUP"; // Multi-select pe GROUP dikhao
            groupBtn.style.display = "block";
          } else {
            groupBtn.style.display = "none"; // Single element pe hide
          }
        }

        if (typeof lucide !== "undefined") lucide.createIcons();
      }
      window.onload = () => {
        const list = document.getElementById("pages-list");
        const editorContainer = document.getElementById("editor-container");

        if (!list) {
          console.warn("Element #pages-list not found.");
          initApp();
          return;
        }

        // --- 🆕 STEP: RELOAD LOCK ---
        if (editorContainer) {
          editorContainer.style.overflow = "hidden";
        }

        // --- 1. Master Layout & Key Detection ---
        const path = window.location.pathname.toLowerCase();
        let selectedLayout = "default";
        if (path.includes("fb-story")) selectedLayout = "fb-story";
        else if (path.includes("insta-story") || path.includes("story"))
          selectedLayout = "insta-story";
        else if (path.includes("fb-post")) selectedLayout = "fb-post";
        else if (path.includes("insta-post")) selectedLayout = "insta-post";

        STORAGE_KEY = `dx_templates_${selectedLayout}`;
        PAGE_WIDTH = LAYOUTS[selectedLayout].w;
        PAGE_HEIGHT = LAYOUTS[selectedLayout].h;

        // --- 2. Scroll Listener ---
        if (editorContainer) {
          editorContainer.addEventListener("scroll", () => {
            closeFloatingPicker?.();
            const activeObj =
              typeof activeCanvas !== "undefined"
                ? activeCanvas?.getActiveObject()
                : null;
            const ctxTools = document.getElementById("ctx-tools");

            if (activeObj && ctxTools) {
              const canvasRect =
                activeCanvas.upperCanvasEl.getBoundingClientRect();
              if (
                canvasRect.bottom < 100 ||
                canvasRect.top > window.innerHeight - 100
              ) {
                ctxTools.classList.add("ctx-force-hide");
              } else {
                if (typeof positionCtxTools === "function")
                  positionCtxTools(activeObj);
                ctxTools.classList.remove("ctx-force-hide");
              }
            }
          });
        }

        // --- 3. Animation & Hydration Logic (REFINED) ---
        list.style.opacity = "0";

        // Sabse pehle hum check karenge ki Fonts ready hain
        document.fonts.ready.then(() => {
          console.log("[System] Fonts confirmed ready.");

          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

          if (saved && saved.length > 0 && saved[0].pages) {
            console.log(`[Hydration] Restoring design for ${STORAGE_KEY}...`);

            // Strict Lock
            window.isInitialLoading = true;

            // 🆕 Fabric ko execute hone ke liye 100ms ka breathing space dein
            setTimeout(() => {
              loadTemplate(0);

              // Auto-save ko tabhi unlock karein jab template puri tarah render ho jaye
              setTimeout(() => {
                window.isInitialLoading = false;
                console.log("Auto-save unlocked.");
              }, 1200); // 1.2s safety for high-res templates
            }, 100);
          } else {
            console.log(`[Fresh] Creating new workspace for ${STORAGE_KEY}...`);
            initApp();
          }

          // --- 🆕 STEP: UNLOCK SCROLLBARS ---
          setTimeout(() => {
            if (editorContainer) {
              editorContainer.style.overflowY = "auto";
              editorContainer.style.overflowX = "auto";
              editorContainer.scrollLeft = 0;
            }

            list.style.transition = "opacity 0.4s ease-out";
            list.style.opacity = "1";

            if (typeof fitToScreen === "function") fitToScreen();
          }, 800);
        });
      };
      function toggleLoader(show = true) {
        const loader = document.getElementById("editor-loader");
        const modal = document.getElementById("asset-modal");
        if (!loader) return;

        if (show) {
          // 1. Pehle Modal ko hide karo
          if (modal) modal.classList.remove("active");

          // 2. Kuch ms (e.g., 50ms) baad loader start karo
          setTimeout(() => {
            loader.classList.remove("hidden");
          }, 50);
        } else {
          // Halka sa delay taaki "flash" effect na aaye
          setTimeout(() => {
            loader.classList.add("hidden");
          }, 300);
        }
      }

      function openSubFonts() {
        const container = document.getElementById("font-list-container");
        if (!container) return;

        container.innerHTML = FONT_LIST.map((f) => {
          // Font family ko safely string me convert karein
          const familyEscaped = f.family.replace(/'/g, "\\'");
          return `
                    <button onclick="changeFontFamily('${familyEscaped}')"
                            class="w-full p-4 text-left bg-gray-50 rounded-xl active:bg-indigo-100 transition mb-2 border border-transparent active:border-indigo-200"
                            style="font-family: ${f.family}">
                        <span class="text-lg">${f.name}</span>
                    </button>
                `;
        }).join("");

        openSub("sub-modal-fonts");
      }

      function changeFontFamily(family) {
        if (!activeCanvas) return;

        const obj = activeCanvas.getActiveObject();

        if (obj) {
          // Agar group selected he (Multiple text)
          if (obj.type === "activeSelection") {
            obj.forEachObject(function (child) {
              if (child.isType("textbox")) child.set("fontFamily", family);
            });
          }
          // Agar single text selected he
          else if (obj.isType("textbox")) {
            obj.set("fontFamily", family);
          }

          obj.setCoords();
          activeCanvas.requestRenderAll();

          // Mobile UI fix: thoda delay ke sath render call karein
          // taaki selection box update ho jaye
          setTimeout(() => {
            activeCanvas.renderAll();
          }, 50);

          setTimeout(() => saveHistory(), 50);
          closeSubModal();

          console.log("Font changed to:", family);
        } else {
          console.log("No object selected");
        }
      }

      function deselectAll() {
        // 1. Saare canvases se active objects hatao
        canvasInstances.forEach((c) => {
          c.instance.discardActiveObject();
          // --- STOP DRAWING LOGIC ---
          if (c.instance.isDrawingMode) {
            c.instance.isDrawingMode = false;
            c.instance.defaultCursor = "default";
          }
          c.instance.requestRenderAll();
        });

        // 2. Active page ki indigo border hatao (Optional: Agar aap chahte ho focus poora hat jaye)
        document.querySelectorAll(".canvas-holder").forEach((h) => {
          h.classList.remove("active-page-border");
        });

        // 3. Floating toolbar (ctx-tools) hide karein
        const ctx = document.getElementById("ctx-tools");
        if (ctx) {
          ctx.classList.add("ctx-force-hide");
          ctx.style.opacity = "0";
        }

        // 4. Bottom settings panel ya color picker band karein
        if (typeof closeFullTools === "function") closeFullTools();
        if (typeof closeFloatingPicker === "function") closeFloatingPicker();

        // activeCanvas ko reset na karein taaki undo/redo ko pata rahe last page kaunsa tha
        // par focus visible nahi rahega.
      }

      document.addEventListener(
        "mousedown",
        (e) => {
          // 1. Check karein ki kya click specifically 'page-wrapper' ya 'page-entry' par hua hai
          // Hum check kar rahe hain ki click khali area (wrapper) par hai aur kisi element ke andar nahi
          const isWrapperClick =
            e.target.classList.contains("page-wrapper") ||
            e.target.classList.contains("page-entry");

          // 2. Safety: Agar click canvas ke andar kisi object par hai, toh wrapper click hone par bhi ignore karein
          const isInsideCanvas = e.target.closest(".canvas-container");

          // 3. Logic: Sirf tabhi deselect karein jab click wrapper par ho aur canvas ke bahar ho
          if (isWrapperClick && !isInsideCanvas) {
            console.log("Wrapper click detected. Deselecting everything...");
            deselectAll();
          }
        },
        true,
      );
      window.addEventListener("resize", fitToScreen);
      window.addEventListener("resize", fitToScreen);
