<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ExamIndia - Aspirant Profile</title>

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Dynamic Bottom Navigation Component -->
    <script src="js/nav_gov.js"></script>

    <style>
      body {
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: #090d16;
        -webkit-tap-highlight-color: transparent;
      }
      .font-mono {
        font-family: "JetBrains Mono", monospace;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="flex justify-center items-center min-h-screen bg-slate-950">
    <!-- MOBILE CONTAINER (Phone Viewport: 430px) -->
    <div
      class="w-full max-w-[430px] bg-slate-50 h-screen max-h-screen flex flex-col justify-start shadow-2xl relative overflow-hidden"
    >
      <!-- 1. TOP FIXED HEADER -->
      <div id="top-header-placeholder"></div>

      <!-- 2. MAIN CONTENT -->
      <main
        class="flex-1 px-4 pt-3 pb-24 space-y-3.5 overflow-y-auto no-scrollbar"
      >
        <!-- PROFILE HERO CARD -->
        <div
          class="bg-gradient-to-br from-indigo-700 via-indigo-800 to-slate-900 rounded-2xl p-4 text-white shadow-md shadow-indigo-950/20 text-center relative overflow-hidden"
        >
          <div
            id="profile-avatar"
            class="w-14 h-14 mx-auto rounded-2xl bg-white/20 border-2 border-white/30 text-white font-extrabold flex items-center justify-center text-2xl shadow-inner uppercase mb-2.5"
          >
            A
          </div>

          <h2 id="profile-name" class="text-base font-black tracking-wide">
            Aspirant
          </h2>
          <p
            id="profile-grade"
            class="text-xs text-indigo-200 font-semibold mt-0.5"
          >
            UPSC / State PSC Aspirant
          </p>
          <p class="text-[11px] text-indigo-300 font-bold mt-1">
            Roll / ID:
            <span id="profile-user-id" class="text-amber-300 font-mono"
              >--</span
            >
          </p>
        </div>

        <!-- QUICK 3 STATS -->
        <div class="grid grid-cols-3 gap-2.5">
          <div
            class="bg-white border border-slate-200/80 rounded-2xl p-3 text-center shadow-2xs"
          >
            <span class="text-lg">📋</span>
            <p class="text-[10px] font-bold text-slate-400 uppercase mt-1">
              Mocks Taken
            </p>
            <p
              id="stat-profile-tests"
              class="text-sm font-black text-slate-800 mt-0.5"
            >
              0
            </p>
          </div>
          <div
            class="bg-white border border-slate-200/80 rounded-2xl p-3 text-center shadow-2xs"
          >
            <span class="text-lg">🎯</span>
            <p class="text-[10px] font-bold text-slate-400 uppercase mt-1">
              Accuracy
            </p>
            <p
              id="stat-profile-accuracy"
              class="text-sm font-black text-emerald-600 mt-0.5"
            >
              0%
            </p>
          </div>
          <div
            class="bg-white border border-slate-200/80 rounded-2xl p-3 text-center shadow-2xs"
          >
            <span class="text-lg">🏆</span>
            <p class="text-[10px] font-bold text-slate-400 uppercase mt-1">
              Score Points
            </p>
            <p
              id="stat-profile-stars"
              class="text-sm font-black text-indigo-700 mt-0.5"
            >
              0
            </p>
          </div>
        </div>

        <!-- ASPIRANT DETAILS -->
        <div class="space-y-1.5">
          <h3
            class="text-xs font-extrabold text-slate-700 uppercase tracking-wider px-1"
          >
            Aspirant Details
          </h3>

          <div
            class="bg-white border border-slate-200/80 rounded-2xl p-3.5 space-y-2.5 shadow-2xs text-xs"
          >
            <div class="flex items-center justify-between">
              <span class="text-slate-400 font-semibold">Candidate Name</span>
              <span
                id="detail-name"
                class="font-extrabold text-slate-800 text-xs"
                >Aspirant</span
              >
            </div>
            <div
              class="border-t border-slate-100 pt-2.5 flex items-center justify-between"
            >
              <span class="text-slate-400 font-semibold">Target Exam</span>
              <span
                id="detail-grade"
                class="font-extrabold text-slate-800 text-xs"
                >Govt &amp; PSC Exams</span
              >
            </div>
            <div
              class="border-t border-slate-100 pt-2.5 flex items-center justify-between"
            >
              <span class="text-slate-400 font-semibold">Exam Medium</span>
              <span class="font-extrabold text-indigo-600 text-xs"
                >Bilingual (EN / HI)</span
              >
            </div>
          </div>
        </div>

        <!-- QUICK SHORTCUTS -->
        <div class="space-y-1.5">
          <h3
            class="text-xs font-extrabold text-slate-700 uppercase tracking-wider px-1"
          >
            Shortcuts
          </h3>

          <div
            class="bg-white border border-slate-200/80 rounded-2xl overflow-hidden shadow-2xs divide-y divide-slate-100 text-xs"
          >
            <button
              onclick="window.location.href = 'scoreboard_gov.html'"
              class="w-full p-3.5 flex items-center justify-between hover:bg-slate-50 active:bg-slate-100 transition-all cursor-pointer"
            >
              <div
                class="flex items-center gap-3 font-bold text-slate-700 text-xs"
              >
                <span class="text-base">📊</span>
                <span>View Full Scoreboard &amp; Stats</span>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </button>

            <button
              onclick="window.location.href = 'testpaper_gov.html'"
              class="w-full p-3.5 flex items-center justify-between hover:bg-slate-50 active:bg-slate-100 transition-all cursor-pointer"
            >
              <div
                class="flex items-center gap-3 font-bold text-slate-700 text-xs"
              >
                <span class="text-base">📚</span>
                <span>All Mock Test Papers</span>
              </div>
              <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400"></i>
            </button>
          </div>
        </div>

        <!-- LOGOUT BUTTON -->
        <div class="pt-1.5">
          <button
            onclick="handleLogout()"
            class="w-full py-3 bg-white hover:bg-rose-50 border border-slate-200/90 hover:border-rose-200 rounded-2xl flex items-center justify-center gap-2 text-rose-600 font-extrabold text-xs transition-all active:scale-98 cursor-pointer shadow-2xs"
          >
            <i data-lucide="log-out" class="w-4 h-4 text-rose-500"></i>
            <span>Logout Account</span>
          </button>
        </div>
      </main>

      <!-- 3. DYNAMIC BOTTOM NAVIGATION -->
      <div id="bottom-nav-placeholder"></div>
    </div>

    <!-- JAVASCRIPT PROFILE ENGINE -->
    <script>
      const SCOREBOARD_API_URL =
        "https://api.jawedsiddiqui.cloud/api/test/questions/scoreboard";

      function getActiveUserId() {
        const urlParams = new URLSearchParams(window.location.search);
        let userId = urlParams.get("user_id") || urlParams.get("student_id");

        if (!userId) {
          try {
            const rawUser = localStorage.getItem("examIndiaUser");
            if (rawUser) {
              const userObj = JSON.parse(rawUser);
              userId =
                userObj.id ||
                userObj.userId ||
                userObj.user_id ||
                userObj.student_id;
            }
          } catch (e) {
            console.error("Local storage error:", e);
          }
        }
        return userId || "GUEST_ASPIRANT";
      }

      function loadProfileData() {
        const userId = getActiveUserId();
        let userName = "Aspirant";
        let targetExam = "Govt & PSC Exams";

        try {
          const rawUser = localStorage.getItem("examIndiaUser");
          if (rawUser) {
            const userObj = JSON.parse(rawUser);
            userName =
              userObj.name ||
              userObj.userName ||
              userObj.user_name ||
              "Aspirant";
            targetExam =
              userObj.targetExam || userObj.classGrade || "Govt & PSC Exams";
          }
        } catch (e) {}

        document.getElementById("profile-name").innerText = userName;
        document.getElementById("detail-name").innerText = userName;
        document.getElementById("profile-grade").innerText = targetExam;
        document.getElementById("detail-grade").innerText = targetExam;
        document.getElementById("profile-user-id").innerText = userId;
        document.getElementById("profile-avatar").innerText = userName
          .charAt(0)
          .toUpperCase();

        fetchUserStats(userId);
      }

      async function fetchUserStats(userId) {
        try {
          const res = await fetch(
            `${SCOREBOARD_API_URL}/${encodeURIComponent(userId)}`,
          );
          const resData = await res.json();

          if (resData?.success && resData.data?.summary) {
            const summary = resData.data.summary;
            document.getElementById("stat-profile-tests").innerText =
              summary.total_tests || 0;
            document.getElementById("stat-profile-accuracy").innerText =
              `${summary.overall_accuracy || 0}%`;
            document.getElementById("stat-profile-stars").innerText =
              summary.total_stars || summary.total_points || 0;
          }
        } catch (err) {
          console.error("Profile Stats Fetch Error:", err);
        }
      }

      function handleLogout() {
        if (confirm("Kya aap logout karna chahte hain?")) {
          localStorage.removeItem("examIndiaUser");
          localStorage.removeItem("token");
          localStorage.removeItem("user_session");
          sessionStorage.clear();
          window.location.href = "auth_gov.html";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        loadProfileData();
        if (typeof lucide !== "undefined") {
          lucide.createIcons();
        }
      });
    </script>
  </body>
</html>
