<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>ExamIndia - Exam Dashboard</title>

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Master Scripts -->
    <script src="/js/AllSubject.js"></script>
    <script src="/js/nav_gov.js"></script>

    <style>
      body {
        font-family:
          "Plus Jakarta Sans",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: #090d16;
        -webkit-tap-highlight-color: transparent;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fadeIn {
        animation: fadeIn 0.2s ease-out forwards;
      }
    </style>
  </head>
  <body class="flex justify-center items-center min-h-screen bg-slate-950">
    <!-- MOBILE CONTAINER (Phone Viewport: 430px Fit) -->
    <div
      class="w-full max-w-[430px] bg-slate-50 h-screen max-h-screen flex flex-col justify-start shadow-2xl relative overflow-hidden"
    >
      <!-- 1. FIXED TOP HEADER -->
      <header
        class="bg-white px-4 py-3 border-b border-slate-200/80 shrink-0 shadow-2xs z-10 flex items-center justify-between"
      >
        <!-- LEFT: BACK BUTTON & DYNAMIC CATEGORY TITLE -->
        <div class="flex items-center gap-2.5">
          <button
            onclick="window.location.href = 'home_gov.html'"
            class="w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 flex items-center justify-center transition-all cursor-pointer shrink-0"
            title="Back to Home"
          >
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
          </button>
          <div>
            <h1
              id="page-header-title"
              class="text-sm font-black text-slate-900 tracking-tight leading-tight"
            >
              Loading Dashboard...
            </h1>
            <p
              id="page-header-subtitle"
              class="text-[10px] font-bold text-indigo-600 leading-none mt-0.5"
            >
              Exam Test Series
            </p>
          </div>
        </div>

        <!-- RIGHT: LOGOUT BUTTON -->
        <button
          onclick="handleUserLogout()"
          class="px-3 py-1.5 bg-rose-50 hover:bg-rose-100 active:bg-rose-500 active:text-white text-rose-600 border border-rose-200/80 rounded-xl text-xs font-bold transition-all cursor-pointer flex items-center gap-1.5 shadow-2xs active:scale-95"
        >
          <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
          <span>Logout</span>
        </button>
      </header>

      <!-- 2. MAIN SCROLLABLE CONTENT -->
      <main
        class="flex-1 px-4 pt-3 pb-24 space-y-3.5 overflow-y-auto no-scrollbar"
      >
        <!-- UNIFIED COMPACT WIDGET: DAILY LIVE TEST & LAST SCORE SUMMARY -->
        <div
          id="non-kids-daily-widget"
          class="bg-gradient-to-br from-indigo-800 via-indigo-900 to-slate-900 rounded-3xl p-4 text-white shadow-xl shadow-indigo-950/25 border border-white/10 relative overflow-hidden"
        >
          <div
            class="absolute -right-6 -top-6 w-24 h-24 bg-blue-400/20 rounded-full blur-2xl pointer-events-none"
          ></div>

          <!-- TOP SECTION -->
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-1.5 mb-1">
                <span
                  class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"
                ></span>
                <span
                  id="daily-challenge-subject"
                  class="text-[11px] font-black tracking-wider text-indigo-200 uppercase truncate"
                >
                  Daily Live Challenge
                </span>
              </div>

              <h3
                id="daily-challenge-title"
                class="text-sm font-extrabold text-white leading-snug truncate"
              >
                Practice Mock Tests Below
              </h3>
            </div>

            <div class="shrink-0">
              <span
                class="bg-emerald-400 text-slate-950 text-[10px] font-black px-2 py-0.5 rounded-full uppercase tracking-wider shadow-xs"
              >
                100% FREE
              </span>
            </div>
          </div>

          <!-- MIDDLE ROW -->
          <div class="flex items-center justify-between gap-2 mt-2.5">
            <div
              class="flex items-center gap-2 text-xs font-bold text-indigo-100/90 flex-wrap"
            >
              <span
                class="inline-flex items-center gap-1 bg-white/10 px-2 py-0.5 rounded-md border border-white/10"
              >
                📝 <span id="daily-challenge-qs">15 Qs</span>
              </span>
              <span
                class="inline-flex items-center gap-1 bg-white/10 px-2 py-0.5 rounded-md border border-white/10"
              >
                ⏱️ <span id="daily-challenge-time">15 M</span>
              </span>
              <span
                id="daily-timer"
                class="text-amber-300 font-mono text-[10px]"

                ⏳ Active Today
              </span>
            </div>

            <button
              id="btn-start-daily"
              onclick="startDailyTest()"
              class="px-3.5 py-1.5 bg-white hover:bg-indigo-50 active:scale-95 text-indigo-900 rounded-xl font-bold text-xs transition-all cursor-pointer flex items-center gap-1.5 shadow-md shrink-0"
            >
              <span>Start</span>
              <i
                data-lucide="play"
                class="w-3.5 h-3.5 fill-current text-indigo-700"
              ></i>
            </button>
          </div>

          <!-- BOTTOM SECTION -->

              <span class="text-indigo-300 font-semibold shrink-0"

                class="bg-black/20 px-2 py-0.5 rounded-md text-slate-200 text-[11px]"

            </div>
          </div>

              Modules &amp; Test Sets

      </main>

      <!-- 3. DYNAMIC BOTTOM NAVIGATION PLACEHOLDER -->

    <!-- 4. MONETIZATION / UNLOCK MODAL -->

              Unlock Mock Test Series
            </h3>
            <p class="text-[11px] text-slate-400 font-semibold">

    <!-- JAVASCRIPT ENGINE -->
    <script>
      const BASE_API_URL =
        "https://api.jawedsiddiqui.cloud/api/kidspaint/subject";
      const SCOREBOARD_API_URL =
        "https://api.jawedsiddiqui.cloud/api/test/questions/scoreboard";

      // 1. EXTRACT DIRECT STREAM URL PARAMETER
      const urlParams = new URLSearchParams(window.location.search);
      const rawType = (urlParams.get("type") || "SSC").toUpperCase();

      // Normalize stream key with AllSubject.js
      const STREAM_TITLES = {
        SSC: { title: "SSC Exams", sub: "CGL, CHSL, MTS & GD Constable" },
        RAILWAYS: {
          title: "Railway Exams",
          sub: "RRB NTPC, Group D, ALP & RPF",
        },
        BANKING: {
          title: "Banking & Insurance",
          sub: "SBI PO, IBPS Clerk & RBI Grade B",
        },
        JEE_NEET: {
          title: "JEE & NEET UG",
          sub: "Physics, Chemistry, Maths & Bio",
        },
        DEFENCE: {
          title: "Defence & Police",
          sub: "NDA, CDS, Police SI & Constable",
        },
        TEACHING: {
          title: "Teaching & TET",
          sub: "CTET Paper 1 & 2, State TET & KVS",
        },
        ENTRANCE: { title: "CUET & Entrance", sub: "CUET UG/PG, CLAT & IPMAT" },
        GOVT_PSC: {
          title: "Govt PSC & UPSC",
          sub: "Civil Services & State PCS",
        },
      };

      const currentSegment = STREAM_TITLES[rawType] ? rawType : "SSC";

      let openSubjectId = null;
      let selectedTestForPurchase = null;
      let activeDailyTest = null;

      // 2. GET CURRENT SUBJECT LIST DIRECTLY FROM ALLSUBJECT.JS
      function getCurrentSubjectList() {
        if (
          typeof subjectsBySegment === "undefined" ||
          !subjectsBySegment[currentSegment]
        ) {
          return [];
        }
        return subjectsBySegment[currentSegment];
      }

      // 3. DYNAMIC HEADER TITLE UPDATE
      function syncHeaderUI() {
        const titleEl = document.getElementById("page-header-title");
        const subTitleEl = document.getElementById("page-header-subtitle");
        const meta = STREAM_TITLES[currentSegment] || {
          title: "Exam Dashboard",
          sub: "Test Series",
        };

        titleEl.textContent = meta.title;
        subTitleEl.textContent = meta.sub;
      }

      // 4. FETCH RECENT SCORE SUMMARY
      async function fetchRecentUserScore() {
        try {
          const userStr = localStorage.getItem("examIndiaUser");
          const studentId = userStr
            ? JSON.parse(userStr).student_id || "GUEST_STUDENT"
            : "GUEST_STUDENT";

          const res = await fetch(
            `${SCOREBOARD_API_URL}?student_id=${encodeURIComponent(studentId)}&limit=1`,
          );
          if (res.ok) {
            const data = await res.json();
            const recent = data.data?.[0] || data.results?.[0];
            if (recent) {
              document.getElementById("dash-banner-title").textContent =
                recent.subject || recent.class_or_exam_name || "Test";
              document.getElementById("dash-banner-score").textContent =
                `${recent.total_score}/${recent.max_score}`;
              document.getElementById("dash-banner-accuracy").textContent =
                `${recent.accuracy || 0}%`;
            }
          }
        } catch (e) {
          console.warn("Could not load recent score summary:", e);
        }
      }

      // 5. FETCH SUBJECT TESTS
      async function fetchSubjectTests(subjObj) {
        subjObj.loading = true;
        subjObj.hasError = false;
        renderAccordion();

        try {
          const apiQuery = subjObj.apiSubject || subjObj.name;
          const res = await fetch(
            `${BASE_API_URL}/${encodeURIComponent(apiQuery)}`,
          );

          if (!res.ok) {
            throw new Error(`HTTP ${res.status}`);
          }

          const resData = await res.json();

          if (
            resData?.success &&
            Array.isArray(resData.data) &&
            resData.data.length > 0
          ) {
            subjObj.categories = resData.data.map((item) => ({
              id: item.test_id || item._id,
              title:
                item.title || item.test_name || `${subjObj.name} Mock Test`,
              desc:
                item.category_title ||
                item.board_or_exam ||
                "Official Exam Practice Set",
              ques: Number(item.total_questions) || 15,
              time: Number(item.total_time_mins) || 15,
              access_type: item.access_type || "free",
              price: item.price || 0,
              discounted_price: item.discounted_price || 0,
              difficulty: item.difficulty_level || "Medium",
              is_daily: Boolean(item.is_daily_challenge),
              included_in_pass: item.included_in_pass !== false,
              exam_category: item.exam_category || currentSegment,
            }));
          } else {
            // Fallback to offline predefined chapters in AllSubject.js if backend is empty
            if (Array.isArray(subjObj.categories)) {
              subjObj.categories = subjObj.categories.map((c) => ({
                id: c.id,
                title: `${c.title} – Set #1`,
                desc: `${subjObj.name} Practice Chapter`,
                ques: 15,
                time: 15,
                access_type: "free",
                price: 0,
                discounted_price: 0,
                difficulty: "Medium",
                is_daily: false,
                included_in_pass: true,
                exam_category: currentSegment,
              }));
            }
          }

          // Daily live test update
          let dailyItem =
            subjObj.categories.find((c) => c.is_daily) || subjObj.categories[0];

          if (dailyItem) {
            activeDailyTest = dailyItem;
            document.getElementById("daily-challenge-subject").textContent =
              subjObj.name;
            document.getElementById("daily-challenge-title").textContent =
              dailyItem.title;
            document.getElementById("daily-challenge-qs").textContent =
              `${dailyItem.ques} Qs`;
            document.getElementById("daily-challenge-time").textContent =
              `${dailyItem.time} Mins`;
          }

          subjObj.loaded = true;
        } catch (error) {
          console.error("Fetch subject tests failed:", error);
          subjObj.hasError = true;
          subjObj.errorMessage = "Failed to load test sets.";
        } finally {
          subjObj.loading = false;
          renderAccordion();
        }
      }

        const activeList = getCurrentSubjectList();
        if (activeList.length > 0) {
          openSubjectId = activeList[0].id;
          fetchSubjectTests(activeList[0]);
        } else {
          renderAccordion();
        }
      }

          `${activeList.length} Subjects`;

                        <div class="bg-white border border-slate-200/80 rounded-2xl p-3 flex items-center justify-between shadow-2xs hover:border-indigo-300 transition-all">
                          <div class="pr-2 min-w-0 flex-1">
                            <div class="flex items-center gap-2">
                              <h5 class="font-extrabold text-slate-800 text-xs truncate">${cat.title}</h5>
                              ${badgeHtml}
                            </div>
                            <p class="text-[11px] font-medium text-slate-400 truncate mt-0.5">${cat.desc}</p>
                            <div class="flex items-center gap-1.5 mt-1.5">
                              <span class="text-[10px] font-bold bg-slate-100 text-slate-700 px-2 py-0.5 rounded">${cat.ques} Qs</span>
                              <span class="text-[10px] font-bold bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded">⏱️ ${cat.time}m</span>
                              <span class="text-[10px] font-bold uppercase text-slate-400">${cat.difficulty || "Medium"}</span>
                            </div>
                          </div>

                          ${
                            isUnlocked
                              ? `
                            <button 
                              onclick="startTest('${cat.id}', '${cat.exam_category}')"
                              class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-xl text-xs font-bold transition-all cursor-pointer shadow-xs shrink-0 flex items-center gap-1.5"
                            >
                              <span>Start</span>
                              <i data-lucide="play" class="w-3.5 h-3.5 fill-current"></i>
                            </button>
                          `
                              : `
                            <button 
                              onclick='openPaywall(${catJsonEscaped})'
                              class="px-3.5 py-2 bg-amber-500 hover:bg-amber-600 active:scale-95 text-white rounded-xl text-xs font-bold transition-all cursor-pointer shadow-xs shrink-0 flex items-center gap-1.5"
                            >
                              <span>Unlock</span>
                              <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                            </button>
                          `
                          }
                        </div>
                      `;
                              })
                              .join("")
                          : `<div class="py-4 text-center text-slate-400 font-bold text-xs">📂 No tests found in this category.</div>`
                  }
                </div>
              `
                  : ""
              }
            </div>
          `;
          })
          .join("");

        if (typeof lucide !== "undefined") lucide.createIcons();
      }

      function toggleSubject(id) {
        if (openSubjectId === id) {
          openSubjectId = null;
        } else {
          openSubjectId = id;
          const subj = getCurrentSubjectList().find((s) => s.id === id);
          if (subj && !subj.loaded && !subj.loading) {
            fetchSubjectTests(subj);
            return;
          }
        }
        renderAccordion();
      }

      function startTest(testId, examCategory) {
        window.location.href = `gov_exam_runner.html?test_id=${encodeURIComponent(testId)}&segment=${encodeURIComponent(examCategory || currentSegment)}`;
      }

      function startDailyTest() {
        if (activeDailyTest) {
          startTest(activeDailyTest.id, activeDailyTest.exam_category);
        } else {
          const list = getCurrentSubjectList();
          const firstCat = list[0]?.categories?.[0];
          if (firstCat) startTest(firstCat.id, firstCat.exam_category);
        }
      }

      function getUserPremiumStatus() {
        try {
          const rawUser = localStorage.getItem("examIndiaUser");
          if (rawUser) {
            const userObj = JSON.parse(rawUser);
            return userObj.is_premium || userObj.has_pass || false;
          }
        } catch (e) {}
        return false;
      }

      function openPaywall(testObj) {
        selectedTestForPurchase = testObj;
        document.getElementById("paywall-test-title").textContent =
          testObj.title;
        document.getElementById("paywall-test-price").textContent =
          `₹${testObj.discounted_price || testObj.price || 9}`;
        document.getElementById("paywall-test-mrp").textContent =
          `₹${testObj.price || 19}`;
        document.getElementById("btn-paywall-text").textContent =
          `Buy This Test @ ₹${testObj.discounted_price || testObj.price || 9}`;
        document.getElementById("paywall-modal").classList.remove("hidden");
      }

      function closePaywallModal() {
        document.getElementById("paywall-modal").classList.add("hidden");
      }

      function executeBuyTest() {
        closePaywallModal();
        alert("Redirecting to checkout...");
      }

      function executeBuyPass() {
        closePaywallModal();
        alert("Redirecting to Exam Pass subscription...");
      }

      function handleUserLogout() {
        if (confirm("Are you sure you want to log out?")) {
          localStorage.clear();
          window.location.href = "auth_gov.html";
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        syncHeaderUI();
        openFirstSubject();
        fetchRecentUserScore();
        if (typeof lucide !== "undefined") lucide.createIcons();
      });
    </script>
  </body>
</html>
