<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>KidsPaint Studio - Learn, Draw & Play</title>

    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Montserrat:wght@700;800;900&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: "Fredoka", cursive, sans-serif;
        background: linear-gradient(
          135deg,
          #4f46e5 0%,
          #7c3aed 50%,
          #db2777 100%
        );
        min-height: 100dvh;
      }

      /* Pulse & Floating Animations */
      @keyframes float-bounce {
        0%,
        100% {
          transform: translateY(0px) rotate(0deg);
        }
        50% {
          transform: translateY(-18px) rotate(4deg);
        }
      }
      .animate-float {
        animation: float-bounce 4s ease-in-out infinite;
      }

      @keyframes pulse-glow {
        0%,
        100% {
          filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.4));
        }
        50% {
          filter: drop-shadow(0 0 35px rgba(255, 255, 255, 0.8));
        }
      }
      .animate-glow {
        animation: pulse-glow 3s ease-in-out infinite;
      }

      /* Custom Shimmer Light Effect */
      @keyframes shimmer {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(100%);
        }
      }
      .shimmer-effect::after {
        content: "";
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.3),
          transparent
        );
        animation: shimmer 2s infinite;
      }
    </style>
  </head>
  <body
    class="flex flex-col items-center justify-between p-6 relative overflow-hidden select-none antialiased"
  >
    <!-- BACKGROUND PLAYFUL BLOBS & ART ICONS -->
    <div
      class="absolute top-8 left-8 w-28 h-28 bg-amber-400/20 rounded-full blur-xl animate-float pointer-events-none"
    ></div>
    <div
      class="absolute bottom-16 right-8 w-36 h-36 bg-cyan-400/20 rounded-full blur-2xl animate-float pointer-events-none"
      style="animation-delay: 1.5s"
    ></div>
    <div
      class="absolute top-1/2 left-4 w-20 h-20 bg-pink-400/20 rounded-full blur-lg animate-float pointer-events-none"
      style="animation-delay: 2.5s"
    ></div>

    <!-- Floating Background Icons -->
    <i
      data-lucide="palette"
      class="absolute top-16 right-12 w-10 h-10 text-white/20 animate-float pointer-events-none"
    ></i>
    <i
      data-lucide="gamepad-2"
      class="absolute bottom-28 left-10 w-12 h-12 text-white/20 animate-float pointer-events-none"
      style="animation-delay: 2s"
    ></i>
    <i
      data-lucide="brain"
      class="absolute top-1/3 left-12 w-10 h-10 text-white/20 animate-float pointer-events-none"
      style="animation-delay: 1s"
    ></i>
    <i
      data-lucide="sparkles"
      class="absolute bottom-1/3 right-10 w-12 h-12 text-yellow-300/30 animate-pulse pointer-events-none"
    ></i>

    <!-- 1. TOP BADGE: MADE IN INDIA 🇮🇳 -->
    <header class="pt-4 z-10">
      <div
        class="inline-flex items-center gap-2 bg-white/10 backdrop-blur-md border border-white/20 px-4 py-2 rounded-full shadow-lg"
      >
        <span class="text-base">🇮🇳</span>
        <span
          class="text-xs font-black tracking-widest text-white uppercase font-['Montserrat']"
        >
          Made in India
        </span>
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
      </div>
    </header>

    <!-- 2. CENTER HERO CONTENT -->
    <main class="flex flex-col items-center text-center my-auto z-10 max-w-sm">
      <!-- Animated Logo Icon -->
      <div class="relative mb-6 animate-float">
        <div
          class="w-28 h-28 md:w-32 md:h-32 bg-white rounded-3xl shadow-2xl flex items-center justify-center transform rotate-3 border-4 border-yellow-300 animate-glow"
        >
          <i data-lucide="palette" class="w-16 h-16 text-indigo-600"></i>
        </div>
        <div
          class="absolute -top-2 -right-2 bg-pink-500 text-white p-2 rounded-full shadow-lg animate-bounce"
        >
          <i data-lucide="sparkles" class="w-5 h-5 fill-current"></i>
        </div>
      </div>

      <!-- App Title -->
      <h1
        class="text-4xl md:text-5xl font-black tracking-wider text-white uppercase drop-shadow-md mb-2"
      >
        Kids<span class="text-yellow-300">P</span
        ><span class="text-pink-300">a</span
        ><span class="text-emerald-300">i</span
        ><span class="text-cyan-300">n</span
        ><span class="text-orange-300">t</span>
      </h1>

      <!-- Main Tagline -->
      <p
        class="text-sm md:text-base font-semibold text-white/90 mb-6 tracking-wide px-4"
      >
        Boost Creative Genius & Brain IQ
      </p>

      <!-- FEATURE PILLS / TAGS -->
      <div class="flex flex-wrap justify-center gap-2 mb-8 max-w-xs">
        <span
          class="bg-white/15 backdrop-blur-md border border-white/20 text-white text-xs font-bold px-3.5 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm"
        >
          🎨 Learn Paint
        </span>
        <span
          class="bg-white/15 backdrop-blur-md border border-white/20 text-white text-xs font-bold px-3.5 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm"
        >
          ✏️ Draw
        </span>
        <span
          class="bg-white/15 backdrop-blur-md border border-white/20 text-white text-xs font-bold px-3.5 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm"
        >
          🎮 Play Games
        </span>
        <span
          class="bg-white/15 backdrop-blur-md border border-white/20 text-yellow-200 text-xs font-bold px-3.5 py-1.5 rounded-full flex items-center gap-1.5 shadow-sm"
        >
          🧠 Brain IQ Puzzles
        </span>
      </div>
    </main>

    <!-- 3. FOOTER & LOADING PROGRESS BAR -->
    <footer class="w-full max-w-xs flex flex-col items-center gap-3 pb-6 z-10">
      <!-- Progress Bar -->
      <div
        class="w-full bg-white/20 h-2.5 rounded-full overflow-hidden p-0.5 border border-white/30 relative shimmer-effect"
      >
        <div
          id="splash-progress-bar"
          class="bg-gradient-to-r from-yellow-300 via-emerald-300 to-pink-400 h-full rounded-full transition-all duration-300 ease-out w-0"
        ></div>
      </div>

      <p
        class="text-[11px] font-bold text-white/80 tracking-widest uppercase font-['Montserrat']"
      >
        Loading Studio...
      </p>
    </footer>

    <!-- AUTO REDIRECT CONTROLLER SCRIPT -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        if (typeof lucide !== "undefined") lucide.createIcons();

        const progressBar = document.getElementById("splash-progress-bar");
        let progress = 0;

        // Animated Loader Ticker
        const interval = setInterval(() => {
          progress += 5;
          if (progressBar) progressBar.style.width = `${progress}%`;

          if (progress >= 100) {
            clearInterval(interval);
            redirectUser();
          }
        }, 160); // Total ~3 seconds loading time

        function redirectUser() {
          // Check Login Session
          const session = localStorage.getItem("kidsPaintSession");
          const user = localStorage.getItem("kidsPaintUser");

          if (session && user) {
            window.location.href = "paint_mobile.html";
          } else {
            window.location.href = "auth.html";
          }
        }
      });
    </script>
  </body>
</html>
