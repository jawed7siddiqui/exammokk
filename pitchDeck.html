      // Clean rounded card helper
      function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
      }

      // Base Master Slide (Clean, Simple, Professional Slate/White theme)

        c.fillStyle = "#ffffff";
        c.fillRect(0, 0, 1200, 675);

        c.fillStyle = "#f1f5f9";
        for (let x = 30; x < 1200; x += 36) {
          for (let y = 30; y < 675; y += 36) {
            c.beginPath();
            c.arc(x, y, 1.2, 0, Math.PI * 2);
            c.fill();
          }
        }

        // 3. Subtle Clean Border
        c.strokeStyle = "#e2e8f0";
        c.lineWidth = 2;
        c.strokeRect(1, 1, 1198, 673);

        // 4. Clean Header: Brand

        c.font = "900 24px 'Plus Jakarta Sans', sans-serif";
        c.fillText("KIDS PAINT", 55, 62);

        c.fillStyle = "#2563eb";
        c.font = "900 24px 'Plus Jakarta Sans', sans-serif";
        c.fillText("AI", 200, 62);

        // 5. Section Pill (Top Right)
        c.fillStyle = "#f8fafc";
        roundRect(c, 840, 36, 305, 40, 20);
        c.fill();
        c.strokeStyle = "#e2e8f0";
        c.lineWidth = 1;
        roundRect(c, 840, 36, 305, 40, 20);
        c.stroke();

        c.fillStyle = "#0284c7";
        c.beginPath();
        c.arc(860, 56, 4, 0, Math.PI * 2);
        c.fill();

        c.fillStyle = "#475569";
        c.font = "700 12px 'Plus Jakarta Sans', sans-serif";
        c.fillText(sectionTag.toUpperCase(), 874, 60);

        c.lineWidth = 1.5;

        c.lineTo(1145, 90);

        c.font = "600 12px 'Plus Jakarta Sans', sans-serif";

        c.textAlign = "right";
        c.fillText(
          "Confidential — Kidspaint Leadership & Strategy Deck",
          1145,
          642,
        );
        c.textAlign = "left";

      function updateSlide() {
        renderSlide(ctx, currentSlide);
        document.getElementById("slideCounter").innerText =
          `Slide ${currentSlide + 1} of ${totalSlides}`;
        document.getElementById("prevBtn").disabled = currentSlide === 0;
        document.getElementById("nextBtn").disabled =
          currentSlide === totalSlides - 1;

        const pills = document.getElementById("pills").children;
        for (let j = 0; j < pills.length; j++) {
          pills[j].style.background =
            j === currentSlide ? "#38bdf8" : "#475569";
        }
      }

      // Initialize slide pills
      const pBox = document.getElementById("pills");
      for (let j = 0; j < totalSlides; j++) {
        const p = document.createElement("div");
        p.style.width = "8px";
        p.style.height = "8px";
        p.style.borderRadius = "50%";
        p.style.cursor = "pointer";
        p.onclick = () => {
          currentSlide = j;
          updateSlide();
        };
        pBox.appendChild(p);
      }

      document.getElementById("prevBtn").onclick = () => {
        if (currentSlide > 0) {
          currentSlide--;
          updateSlide();
        }
      };

      document.getElementById("nextBtn").onclick = () => {
        if (currentSlide < totalSlides - 1) {
          currentSlide++;
          updateSlide();
        }
      };

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" && currentSlide < totalSlides - 1) {
          currentSlide++;
          updateSlide();
        } else if (e.key === "ArrowLeft" && currentSlide > 0) {
          currentSlide--;
          updateSlide();
        }
      });

      // Export Current Slide as PNG
      document.getElementById("exportPngBtn").onclick = () => {
        const a = document.createElement("a");
        a.download = `Kidspaint_Slide_${currentSlide + 1}.png`;
        a.href = canvas.toDataURL("image/png");
        a.click();
      };

      // Download Complete 13-Page PDF
      document.getElementById("downloadPdfBtn").onclick = () => {
        const btn = document.getElementById("downloadPdfBtn");
        btn.innerText = "⏳ Generating 13-Page PDF...";
        btn.disabled = true;

        setTimeout(() => {
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({
            orientation: "landscape",
            unit: "px",
            format: [1200, 675],
          });

          const off = document.getElementById("offCanvas");
          const offCtx = off.getContext("2d");

          for (let s = 0; s < totalSlides; s++) {
            renderSlide(offCtx, s);
            const imgData = off.toDataURL("image/jpeg", 0.95);
            if (s > 0) pdf.addPage([1200, 675], "landscape");
            pdf.addImage(imgData, "JPEG", 0, 0, 1200, 675);
          }

          pdf.save("Kidspaint_Executive_Pitch_Deck_13Slides.pdf");
          btn.innerText = "📄 Download Full 13-Page PDF";
          btn.disabled = false;
        }, 150);
      };

      // Initial Render
      updateSlide();
      if (document.fonts) {
        document.fonts.ready.then(() => updateSlide());
      }
