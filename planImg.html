<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ExamMokk - 100% Free Daily GK Quiz (1200x630)</title>
  </head>
  <body
    style="
      font-family:
        &quot;Segoe UI&quot;,
        system-ui,
        -apple-system,
        sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #090d16;
      margin: 20px 0;
    "
  >
    <h3 style="color: #f8fafc; font-weight: 700; margin-bottom: 14px">
      ExamMokk FB Card Banner • 1200x630 (100% FREE Highlighted)
    </h3>
    <canvas
      id="bannerCanvas"
      width="1200"
      height="630"
      style="
        max-width: 95%;
        border-radius: 16px;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7);
      "
    ></canvas>
    <br />
    <button
      id="downloadBtn"
      style="
        padding: 16px 36px;
        background: linear-gradient(135deg, #16a34a, #059669);
        color: #ffffff;
        border: none;
        font-size: 16px;
        font-weight: 800;
        border-radius: 12px;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(22, 163, 74, 0.4);
      "
    >
      Download Free Card Banner (1200x630 PNG)
    </button>

    <script>
      const canvas = document.getElementById("bannerCanvas");
      const ctx = canvas.getContext("2d");

      function drawBanner() {
        // 1. Background
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, 1200, 630);

        // Subtle Grid
        ctx.strokeStyle = "rgba(226, 232, 240, 0.65)";
        ctx.lineWidth = 1;
        for (let x = 0; x < 1200; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, 630);
          ctx.stroke();
        }
        for (let y = 0; y < 630; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(1200, y);
          ctx.stroke();
        }

        // Ambient Glows
        ctx.save();
        ctx.filter = "blur(70px)";
        ctx.fillStyle = "rgba(34, 197, 94, 0.12)";
        ctx.beginPath();
        ctx.arc(1060, 100, 220, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "rgba(37, 99, 235, 0.10)";
        ctx.beginPath();
        ctx.arc(150, 480, 220, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Card Border
        ctx.strokeStyle = "#cbd5e1";
        ctx.lineWidth = 3;
        roundRect(ctx, 10, 10, 1180, 610, 20);
        ctx.stroke();

        // 2. TOP-LEFT: ExamMokk Brand + All Exam Tags
        drawCard(ctx, 40, 32, 480, 122, 16, "#f8fafc", "#e2e8f0", 1.5);

        // Logo Icon
        const logoGrad = ctx.createLinearGradient(55, 45, 100, 90);
        logoGrad.addColorStop(0, "#1d4ed8");
        logoGrad.addColorStop(1, "#0284c7");
        ctx.fillStyle = logoGrad;
        roundRect(ctx, 55, 45, 46, 46, 12);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(67, 56, 20, 4);
        ctx.fillRect(67, 56, 4, 24);
        ctx.fillRect(67, 66, 15, 4);
        ctx.fillRect(67, 76, 20, 4);

        // Brand Name
        ctx.font = "900 32px sans-serif";
        ctx.fillStyle = "#0f172a";
        ctx.fillText("Exam", 112, 79);
        ctx.fillStyle = "#0284c7";
        ctx.fillText("Mokk", 200, 79);

        // Tags Strip
        const examTags = [
          "ALL GOVT EXAMS",
          "UPSC",
          "SSC",
          "BANKING",
          "RAILWAYS",
        ];
        let tagX = 55;
        examTags.forEach((tag, idx) => {
          ctx.font = "800 11px sans-serif";
          const tw = ctx.measureText(tag).width + 14;
          const isGov = idx === 0;
          drawCard(
            ctx,
            tagX,
            104,
            tw,
            26,
            6,
            isGov ? "#0284c7" : "#0f172a",
            null,
          );
          ctx.fillStyle = isGov ? "#ffffff" : "#38bdf8";
          ctx.fillText(tag, tagX + 7, 121);
          tagX += tw + 5;
        });

        // 3. TOP-RIGHT: BIG "100% FREE" PROMO BADGE
        const freeX = 890;
        const freeY = 32;
        const freeW = 270;
        const freeH = 75;

        // Big Green Badge Background
        ctx.save();
        ctx.shadowColor = "rgba(22, 163, 74, 0.35)";
        ctx.shadowBlur = 18;
        ctx.shadowOffsetY = 4;
        const freeGrad = ctx.createLinearGradient(
          freeX,
          freeY,
          freeX + freeW,
          freeY + freeH,
        );
        freeGrad.addColorStop(0, "#16a34a");
        freeGrad.addColorStop(1, "#15803d");
        ctx.fillStyle = freeGrad;
        roundRect(ctx, freeX, freeY, freeW, freeH, 18);
        ctx.fill();
        ctx.restore();

        // White border inside badge
        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        ctx.lineWidth = 1.5;
        roundRect(ctx, freeX + 2, freeY + 2, freeW - 4, freeH - 4, 16);
        ctx.stroke();

        // Big "100% FREE" Text
        ctx.font = "900 32px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("⚡ 100% FREE", freeX + 20, freeY + 39);

        ctx.font = "800 13px sans-serif";
        ctx.fillStyle = "#bbf7d0";
        ctx.fillText("NO PAYMENT • DIRECT ATTEMPT", freeX + 22, freeY + 61);

        // 4. MAIN HEADLINE & SUB-HEADING (Center Left)
        drawCard(ctx, 40, 175, 290, 32, 8, "#dbeafe", "#bfdbfe", 1);
        ctx.font = "800 13px sans-serif";
        ctx.fillStyle = "#1d4ed8";
        ctx.fillText("🔥 TARGET ALL GOVT EXAMS 2026", 52, 196);

        ctx.font = "900 46px sans-serif";
        ctx.fillStyle = "#0f172a";
        ctx.fillText("DAILY GENERAL", 40, 250);

        const titleGrad = ctx.createLinearGradient(40, 265, 520, 310);
        titleGrad.addColorStop(0, "#2563eb");
        titleGrad.addColorStop(1, "#0284c7");
        ctx.fillStyle = titleGrad;
        ctx.fillText("AWARENESS QUIZ", 40, 305);

        ctx.font = "700 19px sans-serif";
        ctx.fillStyle = "#475569";
        ctx.fillText(
          "Static GK, Current Affairs, Science & Polity MCQs",
          40,
          345,
        );

        // Benefit Checkpoints
        const benefits = [
          "✔  Instant Results & Detailed Solutions",
          "✔  Live All-India Rank & Percentile",
          "✔  Zero Login • Direct Click to Attempt",
        ];
        benefits.forEach((b, i) => {
          ctx.font = "700 16px sans-serif";
          ctx.fillStyle = "#1e293b";
          ctx.fillText(b, 40, 390 + i * 28);
        });

        // 5. RIGHT SIDE QUIZ MOCKUP CARD
        const gX = 740;
        const gY = 125;
        const gW = 420;
        const gH = 340;

        ctx.save();
        ctx.shadowColor = "rgba(15, 23, 42, 0.10)";
        ctx.shadowBlur = 20;
        ctx.shadowOffsetY = 8;
        drawCard(ctx, gX, gY, gW, gH, 18, "#ffffff", "#e2e8f0", 1.8);
        ctx.restore();

        // Card Top Bar
        drawCard(ctx, gX, gY, gW, 56, 18, "#f8fafc", "#e2e8f0", 1);
        ctx.font = "800 15px sans-serif";
        ctx.fillStyle = "#0f172a";
        ctx.fillText("📝 Live Mock Assessment", gX + 22, gY + 34);

        // 10 Min Pill
        drawCard(ctx, gX + 300, gY + 12, 100, 30, 15, "#fef3c7", "#fde047", 1);
        ctx.font = "800 12px sans-serif";
        ctx.fillStyle = "#b45309";
        ctx.fillText("⏱️ 10 Mins", gX + 314, gY + 31);

        // Question preview
        ctx.font = "700 15px sans-serif";
        ctx.fillStyle = "#1e293b";
        ctx.fillText("Q. Latest General Awareness & GK Test", gX + 22, gY + 88);

        // Options
        const options = [
          { t: "A. Current Affairs & Static GK", active: true },
          { t: "B. Indian Polity & Economy", active: false },
          { t: "C. Science & Technology", active: false },
        ];

        options.forEach((opt, idx) => {
          const optY = gY + 110 + idx * 46;
          if (opt.active) {
            drawCard(ctx, gX + 22, optY, 376, 38, 8, "#f0fdf4", "#22c55e", 1.8);
            ctx.fillStyle = "#15803d";
            ctx.font = "800 14px sans-serif";
            ctx.fillText(opt.t + "  ✔", gX + 36, optY + 24);
          } else {
            drawCard(ctx, gX + 22, optY, 376, 38, 8, "#f8fafc", "#e2e8f0", 1);
            ctx.fillStyle = "#64748b";
            ctx.font = "600 14px sans-serif";
            ctx.fillText(opt.t, gX + 36, optY + 24);
          }
        });

        // Card Footer
        drawCard(ctx, gX + 22, gY + 265, 376, 50, 10, "#f1f5f9", "#cbd5e1", 1);
        ctx.font = "800 14px sans-serif";
        ctx.fillStyle = "#15803d";
        ctx.fillText("🟢 Free Test Available", gX + 36, gY + 295);
        ctx.fillStyle = "#64748b";
        ctx.fillText("• High Accuracy", gX + 235, gY + 295);

        // 6. BOTTOM BIG ACTION CTA BUTTON
        const btnX = 40;
        const btnY = 490;
        const btnW = 1120;
        const btnH = 96;

        const btnGrad = ctx.createLinearGradient(
          btnX,
          btnY,
          btnX + btnW,
          btnY + btnH,
        );
        btnGrad.addColorStop(0, "#dc2626");
        btnGrad.addColorStop(0.5, "#ef4444");
        btnGrad.addColorStop(1, "#ea580c");

        ctx.save();
        ctx.shadowColor = "rgba(220, 38, 38, 0.4)";
        ctx.shadowBlur = 25;
        ctx.shadowOffsetY = 8;
        ctx.fillStyle = btnGrad;
        roundRect(ctx, btnX, btnY, btnW, btnH, 20);
        ctx.fill();
        ctx.restore();

        // Button Interior Glow Line
        ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        ctx.lineWidth = 2;
        roundRect(ctx, btnX + 3, btnY + 3, btnW - 6, btnH - 6, 17);
        ctx.stroke();

        // Button Primary Text
        ctx.font = "900 34px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("▶  START FREE QUIZ NOW", 330, btnY + 60);

        // Free Pill Inside Button (Right Side)
        drawCard(
          ctx,
          btnX + btnW - 200,
          btnY + 24,
          175,
          48,
          24,
          "rgba(255,255,255,0.25)",
          "#ffffff",
          1.5,
        );
        ctx.font = "900 15px sans-serif";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("100% FREE  ➔", btnX + btnW - 170, btnY + 53);
      }

      function drawCard(ctx, x, y, w, h, r, fill, stroke, strokeW) {
        ctx.fillStyle = fill;
        roundRect(ctx, x, y, w, h, r);
        ctx.fill();
        if (stroke) {
          ctx.strokeStyle = stroke;
          ctx.lineWidth = strokeW || 1;
          roundRect(ctx, x, y, w, h, r);
          ctx.stroke();
        }
      }

      function roundRect(ctx, x, y, width, height, radius) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(
          x + width,
          y + height,
          x + width - radius,
          y + height,
        );
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
      }

      window.onload = () => {
        drawBanner();
        document.getElementById("downloadBtn").onclick = () => {
          const link = document.createElement("a");
          link.download = "exammokk-free-daily-gk.png";
          link.href = canvas.toDataURL("image/png");
          link.click();
        };
      };
    </script>
  </body>
</html>
